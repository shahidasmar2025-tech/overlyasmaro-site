<!DOCTYPE html>
<html lang="ar" dir="rtl" class=""><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OVERLYASMARO</title>
<style>
  /* ====== أنماط مشتركة ====== */
  :root{ --pink:#ff2d75; --rose:#ffb3c6; --gold:#ffd166; --violet:#c86bff; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:transparent; font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif; }
  #app{ position:relative; width:100%; height:100%; }

  /* ============== أنماط لوحة التحكم الرئيسية (الصفحة الأولى) ============== */
  #hub{
    min-height:100%;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    box-sizing:border-box;
    background:
      radial-gradient(circle at 20% 20%, rgba(255,45,117,.18), transparent 45%),
      radial-gradient(circle at 80% 80%, rgba(200,107,255,.16), transparent 45%),
      #0f0308;
    overflow-y:auto;
  }
  #hub-card{
    width:100%;
    max-width:520px;
    background:rgba(21,3,8,.85);
    border:1px solid rgba(255,45,117,.35);
    border-radius:22px;
    padding:28px 26px 24px;
    box-shadow:0 20px 50px rgba(0,0,0,.55);
    direction:rtl;
  }
  #hub-card h1{
    margin:0 0 6px;
    font-size:21px;
    color:#fff;
    text-align:center;
  }
  #hub-card p.sub{
    margin:0 0 22px;
    font-size:12.5px;
    color:#bbb;
    text-align:center;
    line-height:1.7;
  }
  #hub-card label{
    display:block;
    font-size:12.5px;
    color:#ffb3c6;
    margin-bottom:6px;
  }
  #hub-username{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06);
    color:#fff;
    font-size:15px;
    box-sizing:border-box;
    direction:ltr;
    text-align:center;
    margin-bottom:16px;
  }
  #hub-advanced{ margin:0 0 18px; }
  #hub-advanced summary{ cursor:pointer; font-size:11.5px; color:#999; margin-bottom:8px; }
  #hub-port{
    width:100%;
    padding:9px 12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);
    color:#fff;
    font-size:13px;
    box-sizing:border-box;
    direction:ltr;
    text-align:center;
  }
  .hub-tool{
    display:flex;
    align-items:center;
    gap:14px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    border-radius:16px;
    padding:14px 16px;
    margin-bottom:12px;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .hub-tool:hover{
    transform:translateY(-2px);
    border-color:rgba(255,45,117,.35);
    background:rgba(255,255,255,.06);
  }
  .hub-tool .emoji{
    font-size:26px; flex:0 0 auto; width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; background:rgba(255,45,117,.15);
  }
  .hub-tool .txt{ flex:1 1 auto; min-width:0; }
  .hub-tool .txt b{ color:#fff; font-size:14.5px; display:block; margin-bottom:2px; }
  .hub-tool .txt span{ color:#999; font-size:11.5px; line-height:1.5; display:block; }
  .hub-tool .actions{ flex:0 0 auto; display:flex; flex-direction:column; gap:6px; }
  .hub-tool button{
    border:none; border-radius:9px; padding:8px 14px;
    font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .hub-tool .btn-open{ background:linear-gradient(135deg,#ff2d75,#c86bff); color:#fff; }
  .hub-tool .btn-copy{ background:rgba(255,255,255,.08); color:#ddd; border:1px solid rgba(255,255,255,.15); }
  #hub-feedback{ text-align:center; font-size:11.5px; color:#5cff9d; height:16px; margin-top:6px; }
  #hub-note{ margin-top:16px; font-size:11px; color:#777; text-align:center; line-height:1.7; }

  /* ====== أنماط تأثير القلوب ====== */

  :root{
    --pink:#ff2d75;
    --rose:#ffb3c6;
    --gold:#ffd166;
    --violet:#c86bff;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    background: transparent !important;
    font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  }

  /* لوحة التحكم والنسخ (تظهر فقط عند فتح الرابط المباشر، وتختفي تلقائياً داخل Live Studio) */
  #controller-panel {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(15, 3, 8, 0.95);
    border: 1px solid rgba(255, 45, 117, 0.4);
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.7);
    color: #fff;
    text-align: center;
    z-index: 100000;
    width: 360px;
    direction: rtl;
  }
  #controller-panel h2 {
    margin-top: 0;
    font-size: 19px;
    color: #ffb3c6;
  }
  #controller-panel p {
    font-size: 12px;
    color: #bbb;
    margin-bottom: 15px;
    line-height: 1.6;
  }
  #controller-panel input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 15px;
    margin-bottom: 12px;
    box-sizing: border-box;
    text-align: center;
    direction: ltr;
  }
  #controller-panel button {
    background: linear-gradient(135deg, #ff2d75, #c86bff);
    color: #fff;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    font-size: 15px;
    transition: opacity 0.2s;
  }
  #controller-panel button:hover { opacity: 0.9; }
  #copy-feedback {
    font-size: 12px;
    color: #5cff9d;
    margin-top: 10px;
    height: 18px;
  }

  #stage{
    position:fixed; inset:0;
    pointer-events:none;
    background: transparent !important;
  }

  #status{
    position:fixed; top:14px; inset-inline-start:14px;
    padding:6px 14px; border-radius:999px;
    font-size:12px; color:#ffe1ea;
    background:rgba(20,4,10,.65);
    border:1px solid rgba(255,45,117,.35);
    opacity:0; transition:opacity .4s ease;
    pointer-events:none;
    direction:rtl;
    z-index:9999;
  }
  #status.show{ opacity:1; }
  #status .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    margin-inline-end:6px; background:#ff5252; vertical-align:middle;
  }
  #status.ok .dot{ background:#5cff9d; }

  /* ---------- الأيقونات والقلوب الشفافة ---------- */
  .burst{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center;
    will-change:transform,opacity;
  }

  .heart-wrap{
    position:relative;
    width:var(--size); height:var(--size);
    animation:
      burstIn .42s cubic-bezier(.34,1.56,.64,1) both,
      floatHold 1.3s ease-in-out .42s both,
      burstOut .55s ease-in forwards 1.72s;
    filter:drop-shadow(0 0 14px var(--glow));
  }
  .heart-img, .heart-shine{
    position:absolute; inset:0; width:100%; height:100%;
    clip-path:url(#heart-clip);
    object-fit:cover;
  }
  .heart-img{ background:#3a1420; }
  .heart-shine{
    background:linear-gradient(160deg, rgba(255,255,255,.55), rgba(255,255,255,0) 45%);
    mix-blend-mode:screen;
  }
  .heart-ring{
    position:absolute; inset:-6%;
    clip-path:url(#heart-clip);
    background:linear-gradient(135deg, var(--glow), transparent 70%);
    opacity:.55;
    z-index:-1;
  }

  .nick{
    margin-top:6px;
    max-width:calc(var(--size) * 1.8);
    padding:3px 12px;
    border-radius:999px;
    font-size:calc(var(--size) * .16);
    font-weight:600;
    color:#fff;
    background:rgba(21,3,8,.75);
    border:1px solid rgba(255,255,255,.15);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    direction:ltr;
    animation:burstIn .42s cubic-bezier(.34,1.56,.64,1) both,
              burstOut .55s ease-in forwards 1.72s;
  }

  @keyframes burstIn{
    0%   { transform:scale(0) rotate(-10deg); opacity:0; }
    60%  { transform:scale(1.16) rotate(4deg); opacity:1; }
    80%  { transform:scale(.94) rotate(-2deg); }
    100% { transform:scale(1) rotate(0deg); opacity:1; }
  }
  @keyframes floatHold{
    0%,100% { transform:translateY(0) rotate(0deg); }
    50%     { transform:translateY(-8%) rotate(2deg); }
  }
  @keyframes burstOut{
    0%   { transform:scale(1); opacity:1; filter:blur(0); }
    100% { transform:scale(.35); opacity:0; filter:blur(3px); }
  }

  .particle{
    position:absolute; top:50%; left:50%;
    width:var(--p-size); height:var(--p-size);
    margin:calc(var(--p-size) / -2);
    border-radius:var(--p-round);
    background:var(--p-color);
    opacity:0;
  }
  .particle.in{ animation:particleIn .6s ease-out forwards; }
  .particle.out{
    animation:particleOut .6s ease-out forwards;
    animation-delay:1.72s;
  }
  @keyframes particleIn{
    0%   { transform:translate(0,0) scale(.4) rotate(0deg); opacity:1; }
    100% { transform:translate(var(--tx),var(--ty)) scale(1) rotate(var(--rot)); opacity:0; }
  }
  @keyframes particleOut{
    0%   { transform:translate(0,0) scale(.3) rotate(0deg); opacity:1; }
    100% { transform:translate(var(--tx),var(--ty)) scale(1) rotate(var(--rot)); opacity:0; }
  }

  /* ====== أنماط لوحة المتفاعلين ====== */

  :root{
    --pink:#ff2d75;
    --rose:#ffb3c6;
    --gold:#ffd166;
    --violet:#c86bff;
    --row-h:74px;
    --row-gap:10px;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    background: transparent !important;
    font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  }

  /* لوحة التحكم والنسخ (تظهر فقط عند فتح الرابط المباشر، وتختفي تلقائياً داخل Live Studio) */
  #controller-panel {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(15, 3, 8, 0.95);
    border: 1px solid rgba(255, 45, 117, 0.4);
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.7);
    color: #fff;
    text-align: center;
    z-index: 100000;
    width: 360px;
    direction: rtl;
  }
  #controller-panel h2 { margin-top:0; font-size:19px; color:#ffb3c6; }
  #controller-panel p { font-size:12px; color:#bbb; margin-bottom:15px; line-height:1.6; }
  #controller-panel input {
    width:100%; padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.08); color:#fff; font-size:15px; margin-bottom:12px;
    box-sizing:border-box; text-align:center; direction:ltr;
  }
  #controller-panel button {
    background:linear-gradient(135deg, #ff2d75, #c86bff); color:#fff; border:none;
    padding:12px 20px; border-radius:10px; font-weight:bold; cursor:pointer; width:100%; font-size:15px;
  }
  #copy-feedback { font-size:12px; color:#5cff9d; margin-top:10px; height:18px; }

  #panel{
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    width:280px;
    z-index:10;
  }
  #panel.side-right{ right:22px; }
  #panel.side-left{ left:22px; }

  #panel-title{
    text-align:center;
    font-size:15px;
    font-weight:800;
    color:#fff;
    text-shadow: 0 0 8px rgba(255,45,117,0.8);
    margin-bottom:12px;
    background: rgba(21,3,8,0.6);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255,45,117,0.3);
  }

  #rows{
    position:relative;
    height:calc(var(--rows) * (var(--row-h) + var(--row-gap)));
  }

  .row{
    position:absolute;
    left:0; right:0;
    height:var(--row-h);
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 14px;
    border-radius:18px;
    background:rgba(21, 3, 8, 0.65);
    border:1px solid rgba(255,45,117,.3);
    box-shadow:0 4px 16px rgba(0,0,0,0.4);
    transition: top .5s cubic-bezier(.3,.8,.4,1), background .3s ease;
    box-sizing:border-box;
  }
  .row.empty{
    background:rgba(21,3,8,.3);
    border-style:dashed;
    border-color:rgba(255,255,255,.2);
  }

  .rank{
    flex:0 0 auto;
    width:26px; height:26px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800;
    color:#fff;
    background:#555;
  }
  .rank.r1{ background:linear-gradient(135deg,#ffd166,#ff9f43); }
  .rank.r2{ background:linear-gradient(135deg,#e6e6f0,#b9b9c9); }
  .rank.r3{ background:linear-gradient(135deg,#e0a56a,#b97a45); }

  .avatar-wrap{
    flex:0 0 auto;
    width:48px; height:48px;
    position:relative;
    filter:drop-shadow(0 0 6px var(--glow, #ff2d75aa));
  }
  .avatar-wrap img, .avatar-wrap .fallback{
    position:absolute; inset:0; width:100%; height:100%;
    clip-path:url(#heart-clip-lb);
    object-fit:cover;
  }
  .avatar-wrap .fallback{
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(160deg, var(--glow,#ff2d75), #7a0f31);
    color:#fff; font-weight:700; font-size:16px;
  }

  .info{ flex:1 1 auto; min-width:0; }
  .name{
    font-size:13px; font-weight:700; color:#fff;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    direction:ltr; text-align:right;
  }
  .row.side-left .name{ text-align:left; }
  .placeholder-text{ font-size:12px; color:#aaa; opacity:.7; }

  .count{
    flex:0 0 auto;
    min-width:34px;
    padding:4px 10px;
    border-radius:999px;
    background:var(--pink);
    color:#fff;
    font-weight:800;
    font-size:13px;
    text-align:center;
    transition:transform .25s ease;
  }
  .count.bump{ animation:bump .35s ease; }
  @keyframes bump{
    0%   { transform:scale(1); }
    40%  { transform:scale(1.35); }
    100% { transform:scale(1); }
  }

  /* ====== أنماط صاروخ الهدايا ====== */

  :root{
    --pink:#ff2d75;
    --rose:#ffb3c6;
    --gold:#ffd166;
    --violet:#c86bff;
    --ink:#150308;
  }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    /* خلفية شفافة بالكامل: ما في داعي لفلتر Chroma Key، الصفحة أصلًا
       بدون أي خلفية، وبتظهر فوق أي مشهد بـ OBS / TikTok Studio مباشرة.
       إذا حابب تجرب خلفية سادة وقت الاختبار بالمتصفح فقط، ضيف بالرابط:
       ?bg=black أو ?bg=00ff00 */
    background:transparent;
    font-family:-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  }

  #stage{ position:fixed; inset:0; pointer-events:none; overflow:hidden; }

  #status{
    position:fixed; top:14px; inset-inline-start:14px;
    padding:6px 14px; border-radius:999px;
    font-size:12px; color:#ffe1ea;
    background:rgba(20,4,10,.55);
    border:1px solid rgba(255,45,117,.35);
    opacity:0; transition:opacity .4s ease;
    pointer-events:none;
    direction:rtl;
    z-index:9999;
  }
  #status.show{ opacity:1; }
  #status .dot{
    display:inline-block; width:8px; height:8px; border-radius:50%;
    margin-inline-end:6px; background:#ff5252; vertical-align:middle;
  }
  #status.ok .dot{ background:#5cff9d; }

  /* =====================================================
     الصاروخ (يحمل صورة الهدية داخل قلب) وهو صاعد من الأسفل
     ===================================================== */
  .rocket{
    position:absolute;
    width:var(--size,72px); height:var(--size,72px);
    left:var(--x,50%);
    bottom:-16%;
    transform:translate(-50%,0) rotate(0deg);
    will-change:transform,bottom,left;
    filter:drop-shadow(0 0 12px var(--glow,#ff2d75));
    z-index:5;
  }
  .rocket.flying{
    animation: rocketFly var(--dur,3000ms) cubic-bezier(.22,.61,.36,1) forwards;
  }
  @keyframes rocketFly{
    0%   { bottom:-16%; transform:translate(-50%,0) rotate(-2deg); }
    10%  { transform:translate(-50%,0) rotate(4deg); }
    50%  { transform:translate(-50%,0) rotate(-3deg); }
    90%  { transform:translate(-50%,0) rotate(2deg); }
    100% { bottom:50%; transform:translate(-50%,50%) rotate(0deg); }
  }
  .rocket .heart-img, .rocket .heart-shine{
    position:absolute; inset:0; width:100%; height:100%;
    clip-path:url(#heart-clip);
    object-fit:cover;
  }
  .rocket .heart-img{ background:#3a1420; }
  .rocket .heart-shine{
    background:linear-gradient(160deg, rgba(255,255,255,.55), rgba(255,255,255,0) 45%);
    mix-blend-mode:screen;
  }
  .rocket .heart-ring{
    position:absolute; inset:-8%;
    clip-path:url(#heart-clip);
    background:linear-gradient(135deg, var(--glow,#ff2d75), transparent 70%);
    opacity:.6;
    z-index:-1;
  }
  .rocket.royal{ filter:drop-shadow(0 0 20px var(--gold)); z-index:6; }
  .rocket.royal .heart-ring{
    background:conic-gradient(from 0deg, var(--gold), #fff6d8, var(--gold), #b9791f, var(--gold));
    opacity:.85;
    animation: royalSpin 1.1s linear infinite;
  }
  @keyframes royalSpin{ from{ filter:hue-rotate(0deg);} to{ filter:hue-rotate(0deg);} }

  /* عادم / دخان خفيف خلف الصاروخ */
  .exhaust{
    position:absolute;
    width:12px; height:12px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.9), rgba(255,180,120,.35) 55%, transparent 75%);
    transform:translate(-50%,-50%);
    pointer-events:none;
    animation:exhaustFade .55s ease-out forwards;
    z-index:4;
  }
  @keyframes exhaustFade{
    0%  { opacity:.95; transform:translate(-50%,-50%) scale(1); }
    100%{ opacity:0;   transform:translate(-50%,-50%) scale(2.4); }
  }

  /* =====================================================
     الانفجار: صورة الهدية تتكرر وتتطاير + شرارات + نص
     ===================================================== */
  .boom{ position:absolute; left:0; top:0; pointer-events:none; }

  .boom-flash{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:10px; height:10px; border-radius:50%;
    background:radial-gradient(circle, #fff, var(--glow,#ff2d75) 40%, transparent 72%);
    animation:flashPop .5s ease-out forwards;
  }
  @keyframes flashPop{
    0%  { width:10px; height:10px; opacity:1; }
    55% { opacity:.95; }
    100%{ width:var(--flash,240px); height:var(--flash,240px); opacity:0; }
  }

  .boom-piece{
    position:absolute; left:50%; top:50%;
    width:var(--piece,56px); height:var(--piece,56px);
    margin:calc(var(--piece,56px) / -2);
    clip-path:url(#heart-clip);
    background-size:cover; background-position:center;
    filter:drop-shadow(0 0 8px var(--glow,#ff2d75));
    animation:pieceOut var(--pdur,900ms) cubic-bezier(.16,.84,.44,1) forwards;
  }
  @keyframes pieceOut{
    0%  { transform:translate(0,0) scale(.3) rotate(0deg); opacity:1; }
    100%{ transform:translate(var(--tx),var(--ty)) scale(var(--scl,.75)) rotate(var(--rot)); opacity:0; }
  }

  .spark{
    position:absolute; left:50%; top:50%;
    width:var(--s,5px); height:var(--s,5px);
    margin:calc(var(--s,5px) / -2);
    border-radius:50%;
    background:var(--c,#fff);
    animation:pieceOut var(--pdur,700ms) ease-out forwards;
  }

  .label{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-150%);
    padding:8px 18px; border-radius:999px;
    background:rgba(21,3,8,.62); color:#fff; font-weight:800; font-size:18px;
    white-space:nowrap; opacity:0;
    border:1px solid rgba(255,255,255,.22);
    animation:labelPop 1.7s ease-out forwards;
  }
  .label.royal{
    font-size:23px; letter-spacing:.02em;
    background:linear-gradient(135deg,#7a0f31,#2c0a13);
    border-color:var(--gold); color:#ffe9b8;
    box-shadow:0 0 26px #ffd16688;
  }
  @keyframes labelPop{
    0%  { opacity:0; transform:translate(-50%,-130%) scale(.6); }
    16% { opacity:1; transform:translate(-50%,-165%) scale(1.06); }
    26% { transform:translate(-50%,-160%) scale(1); }
    82% { opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-205%) scale(.92); }
  }

  /* موجة صدمة دائرية تتوسّع من مركز الانفجار */

.o-ar{display:grid;grid-template-columns:34px 1.2fr .6fr .7fr 1fr auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid #ffffff12}
.o-ar input,.o-ar select{margin:0!important}
.o-ar img.ti{width:30px;height:30px;object-fit:contain}
.o-ip{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.o-ip button{width:42px;height:42px;border-radius:10px;background:#1a1a1f;border:1px solid #ffffff22;color:var(--r);cursor:pointer}.o-ip button.on{border-color:var(--r);background:var(--dk2)}.o-ip svg{width:22px;height:22px}
.o-vp{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.o-vp video,.o-vp iframe{width:100%;height:100%;border:0;background:#000}
@media(max-width:760px){.o-sb{width:78px}.o-nv{font-size:10px}.o-ar{grid-template-columns:1fr 1fr}.o-cnt{display:none}}
/* ===== إضافات النسخة الجديدة ===== */
.o-mn{position:relative}
.o-mn>.o-tb,.o-mn>.o-pgs{position:relative;z-index:1}
#o-bg{position:absolute;inset:0;margin:auto;background:center/contain no-repeat;pointer-events:none;z-index:0;transition:opacity .4s,width .3s,height .3s}
.o-sbf{display:flex;flex-direction:column;gap:6px}
.o-sbf .o-sup{margin:0}
.o-lg{overflow:hidden}
.o-bn{direction:ltr;display:flex;flex-wrap:nowrap;justify-content:center;align-items:baseline;font-weight:900;font-size:11px;letter-spacing:1px;color:#fff;line-height:1.2;white-space:nowrap}
.o-bn span{display:inline-block;animation:bin .55s both;animation-delay:calc(var(--i)*.09s)}
.o-bn.lat span:first-child{font-size:1.75em;background:linear-gradient(var(--hi),var(--r));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 7px rgba(var(--rgb),.75))}
.o-bn.ar{direction:rtl;font-size:15px;letter-spacing:0}
.o-bn.ar span{background:linear-gradient(var(--hi),var(--r));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 7px rgba(var(--rgb),.6))}
.o-bn.s-type span{animation:bin .5s both,bg 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*.09s),calc(var(--n)*.09s + .6s + var(--i)*.18s)}
.o-bn.s-wave span{animation:bin .55s both,bw 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.09s),calc(.8s + var(--i)*.12s)}
.o-bn.s-glow span{animation:bin .55s both,bg 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*.09s),calc(var(--i)*.1s)}
.o-bn.s-none span{animation:none}
@keyframes bin{from{opacity:0;transform:translateY(-12px) scale(.6)}}
@keyframes bw{50%{transform:translateY(-3px);text-shadow:0 0 10px var(--r)}}
@keyframes bg{50%{text-shadow:0 0 12px var(--r),0 0 3px var(--hi)}}
.o-b.t{background:#1d1d23;border:1px solid rgba(var(--rgb),.45);box-shadow:none;color:var(--hi)}
.o-b.t.on{background:rgba(var(--rgb),.22)}
.o-lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#ddd;text-align:center;padding:20px}
.o-rd .o-lk{position:static;flex:1;border:1px dashed var(--bd);border-radius:14px}
.o-fabs{display:flex;gap:8px;flex:none}
/* ===== لوحة الإدارة ===== */
#o-adm{position:fixed;inset:0;z-index:250;background:#050507ee;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:14px}
#o-adm[hidden]{display:none}
.adm{width:min(1180px,100%);height:min(90vh,100%);display:grid;grid-template-columns:190px 1fr;background:#101013;border:1px solid rgba(var(--rgb),.4);border-radius:18px;overflow:hidden;box-shadow:0 0 60px rgba(var(--rgb),.18);text-align:right;color:#eee}
.adm *{box-sizing:border-box}
.adm-n{background:#0b0b0e;padding:14px 10px;display:flex;flex-direction:column;gap:5px;border-left:1px solid var(--bd);overflow:auto}
.adm-t{color:var(--hi);font-size:17px;padding:4px 8px 12px}
.adm-n button{background:none;border:0;color:#bbb;text-align:right;padding:12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13.5px;font-family:inherit}
.adm-n button:hover{background:#ffffff0a}
.adm-n button.on{background:rgba(var(--rgb),.18);color:#fff;box-shadow:inset 0 0 0 1px rgba(var(--rgb),.4)}
.adm-n .sp{flex:1}
.adm-m{overflow:auto;padding:22px 26px 50px}
.adm-m h2{margin:0 0 6px;color:var(--hi);font-size:21px}
.adm-m h3{margin:24px 0 8px;color:var(--hi);font-size:15px}
.adm-card{background:#16161b;border:1px solid #ffffff12;border-radius:12px;padding:12px 14px;margin:8px 0}
.adm-card.off{opacity:.55}
.adm-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.adm-r>input,.adm-r>select{flex:1;min-width:120px}
.adm-r .o-b{flex:none;padding:8px 12px}
.adm-c{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px 14px;margin:6px 0}
.af{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#aaa}
.af>span{font-weight:700;color:#ccc}
.af.w{grid-column:1/-1}
.adm input:not([type=checkbox]):not([type=range]):not([type=color]):not([type=file]),.adm select,.adm textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid #ffffff22;background:#1a1a1f;color:#fff;font-size:13px;font-family:inherit;margin:0}
.adm input[type=file]{width:100%;font-size:12px;color:#aaa}
.adm textarea{font-family:Consolas,monospace;font-size:12px;direction:ltr;text-align:left;min-height:170px;resize:vertical}
.adm label{font-size:12.5px;color:#ccc}
.adm-h{color:#7d7d88;font-size:11.5px;display:block;line-height:1.7}
.adm-ic{width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--r);flex:none;font-size:21px}
.adm-ic svg,.adm-ic img{width:27px;height:27px;object-fit:contain}
.adm-hd{cursor:pointer;display:flex;align-items:center;gap:10px}
.adm-hd b{font-size:14px;color:#fff}
.adm-bd{display:none;border-top:1px solid #ffffff10;margin-top:10px;padding-top:10px}
.adm-card.open>.adm-bd{display:block}
.adm-card.open>.adm-hd .car{transform:rotate(180deg)}
.car{transition:.2s;color:#888}
.bdg{font-size:10.5px;padding:2px 8px;border-radius:20px;background:#ffffff12;color:#bbb;white-space:nowrap}
.bdg.r{background:rgba(var(--rgb),.2);color:var(--hi)}.bdg.g{background:#22c55e22;color:#4ade80}.bdg.y{background:#f5a52422;color:#fbbf24}
.adm-grp{margin:18px 0 6px;display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:15px}
.adm-grp .adm-ic{width:30px;height:30px}
.adm-pal{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.adm-pal button{width:36px;height:36px;border-radius:50%;border:2px solid #ffffff33;cursor:pointer;padding:0}
.adm-pal button.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2)}
.adm-pal input[type=color]{width:44px;height:36px;border:0;background:none;padding:0;cursor:pointer}
.adm-chip{display:inline-flex;align-items:center;gap:6px;background:#1d1d23;border:1px solid #ffffff1a;border-radius:20px;padding:5px 12px;margin:3px;font-size:12.5px;cursor:pointer}
.adm-pick{max-height:250px;overflow:auto;border:1px solid #ffffff12;border-radius:10px;padding:8px 10px;background:#121216;margin-top:6px}
.adm-pick .g{font-weight:800;color:var(--hi);margin:8px 0 3px;display:flex;gap:8px;align-items:center;font-size:12.5px}
.adm-pick label{display:block;padding:3px 0}
.adm-code{font-family:Consolas,monospace;font-size:16px;letter-spacing:2px;color:#fff;background:#0c0c0f;border:1px dashed rgba(var(--rgb),.55);border-radius:8px;padding:5px 12px;cursor:pointer;direction:ltr}
.adm-ex{background:rgba(var(--rgb),.08);border:1px solid rgba(var(--rgb),.3);border-radius:12px;padding:10px 14px;font-size:12.5px;line-height:1.9;color:#ddd}
@media(max-width:760px){.adm{grid-template-columns:1fr;grid-template-rows:auto 1fr}.adm-n{flex-direction:row;overflow:auto;border-left:0;border-bottom:1px solid var(--bd)}.adm-t{display:none}}

card.empty{opacity:.55;border-style:dashed}\n.rank{position:absolute;top:8px;right:10px;width:26px;height:26px;border-radius:50%;background:#555;font-size:13px;font-weight:800;line-height:26px}\n.rank.r1{background:linear-gradient(135deg,#ffd166,#ff9f43)}.rank.r2{background:linear-gradient(135deg,#e6e6f0,#b9b9c9);color:#222}.rank.r3{background:linear-gradient(135deg,#e0a56a,#b97a45)}\n.av{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;border:3px solid var(--g,#ff2d75);box-shadow:0 0 14px var(--g,#ff2d75);overflow:hidden;background:#7a0f31;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}\n.av img{width:100%;height:100%;object-fit:cover}\n.nm{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-shadow:0 1px 4px #000}\n.ct{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:999px;background:var(--pink);font-weight:800;font-size:15px;box-shadow:0 0 12px #ff2d7599}\n.ct.bump{animation:bp .4s ease}\n@keyframes bp{40%{transform:scale(1.4)}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"stage\">\u003c/div>\n\u003cdiv id=\"bar\">\n  \u003cinput id=\"u\" placeholder=\"اسم مستخدم تيك توك (بدون @)\">\n  \u003cbutton id=\"go\">دخول\u003c/button>\n  \u003cbutton id=\"cp\" class=\"copy\">🔗 نسخ رابط شفاف\u003c/button>\n  \u003cspan id=\"st\">بانتظار اسم المستخدم\u003c/span>\n\u003c/div>\n\u003cscript>\n(function(){\n\"use strict\";\nvar P=new URLSearchParams(location.search);\nvar PORT=P.get(\"port\")||8765;              // نفس منفذ OVERLYASMARO_server.py\nvar COUNT=Math.max(1,Math.min(8,parseInt(P.get(\"count\"),10)||4));\nvar $=function(i){return document.getElementById(i)};\nif(P.has(\"transparent\")||location.hash===\"#transparent\")document.body.classList.add(\"transparent\");\n\nif(P.get(\"username\"))document.getElementById(\"bar\").style.display=\"none\";\nvar KEY=\"asmaro_lb_user\",user=(P.get(\"username\")||\"\").replace(/^@/,\"\").trim();\nif(!user){try{user=localStorage.getItem(KEY)||\"\"}catch(e){}}\n$(\"u\").value=user;\nfunction status(t){$(\"st\").textContent=t}\n\n// ---- البطاقات المعلّقة ----\nvar GL=[\"#ff2d75\",\"#ffd166\",\"#c86bff\",\"#4d8dff\",\"#ff7ab6\"];\nfunction glow(s){var h=0;for(var i=0;i\u003cs.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return GL[h%GL.length]}\nvar stage=$(\"stage\"),slots=[];\nfor(var i=0;i\u003cCOUNT;i++){\n  var w=document.createElement(\"div\");w.className=\"swing\";\n  w.style.setProperty(\"--d\",(3.4+i*0.55)+\"s\");w.style.setProperty(\"--dl\",(-i*0.9)+\"s\");\n  w.innerHTML='\u003cdiv class=\"rope l\">\u003c/div>\u003cdiv class=\"rope r\">\u003c/div>\u003cdiv class=\"pin\">\u003c/div>'+\n   '\u003cdiv class=\"card empty\">\u003cdiv class=\"rank\">'+(i+1)+'\u003c/div>\u003cdiv class=\"av\">♡\u003c/div>\u003cdiv class=\"nm\">بانتظار أحد...\u003c/div>\u003cdiv class=\"ct\">0\u003c/div>\u003c/div>';\n  stage.appendChild(w);\n  slots.push({el:w.querySelector(\".card\"),id:null,n:0});\n}\nfunction rc(i){return i==0?\"r1\":i==1?\"r2\":i==2?\"r3\":\"\"}\nfunction fill(s,i,p){\n  var c=s.el;c.classList.remove(\"empty\");\n  var r=c.querySelector(\".rank\");r.textContent=i+1;r.className=\"rank \"+rc(i);\n  var name=p.name||p.nickname||\"viewer\",id=p.id||name;\n  var av=c.querySelector(\".av\");av.style.setProperty(\"--g\",glow(id));\n  if(s.id!==id||!av.querySelector(\"img\")){\n    av.textContent=\"\";\n    if(p.avatar){var im=document.createElement(\"img\");im.referrerPolicy=\"no-referrer\";im.src=p.avatar;\n      im.onerror=function(){av.textContent=name.charAt(0).toUpperCase()};av.appendChild(im)}\n    else av.textContent=name.charAt(0).toUpperCase();\n  }\n  c.querySelector(\".nm\").textContent=\"@\"+name;\n  var ct=c.querySelector(\".ct\"),n=p.count||0;ct.textContent=\"❤ \"+n;\n  if(s.id===id&&s.n!==n){ct.classList.remove(\"bump\");void ct.offsetWidth;ct.classList.add(\"bump\")}\n  s.id=id;s.n=n;\n}\nfunction clear(s,i){\n  var c=s.el;c.classList.add(\"empty\");\n  c.querySelector(\".rank\").className=\"rank \"+rc(i);c.querySelector(\".rank\").textContent=i+1;\n  c.querySelector(\".av\").textContent=\"♡\";c.querySelector(\".nm\").textContent=\"بانتظار أحد...\";\n  c.querySelector(\".ct\").textContent=\"0\";s.id=null;s.n=0;\n}\nfunction update(top){\n  var l=(top||[]).slice(0,COUNT);\n  for(var i=0;i\u003cCOUNT;i++){if(l[i])fill(slots[i],i,l[i]);else clear(slots[i],i)}\n}\n\n// ---- الاتصال بالسيرفر ----\nvar ws=null,retry=null;\nfunction connect(){\n  clearTimeout(retry);\n  try{ws=new WebSocket(\"ws://localhost:\"+PORT)}catch(e){retry=setTimeout(connect,2500);return}\n  var mine=ws;\n  mine.onopen=function(){status(\"متصل بالسيرفر ✓\");login()};\n  mine.onclose=function(){if(ws===mine){status(\"السيرفر مطفي... بنعيد المحاولة\");retry=setTimeout(connect,2500)}};\n  mine.onerror=function(){try{mine.close()}catch(e){}};\n  mine.onmessage=function(ev){\n    var d;try{d=JSON.parse(ev.data)}catch(e){return}\n    if(d.type===\"leaderboard\")update(d.top);\n    else if(d.type===\"status\"){\n      var u=d.username||user,m={connected:\"متصل بلايف @\"+u+\" ✓\",connecting:\"جارٍ الاتصال بـ @\"+u+\"...\",waiting:\"@\"+u+\" مش مباشر، بنعيد المحاولة\",disconnected:\"انتهى البث أو انقطع\",error:\"خطأ بالاتصال، بنعيد المحاولة\"};\n      if(m[d.state])status(m[d.state]);\n    }\n  };\n}\nfunction login(){\n  if(user&&ws&&ws.readyState===1)ws.send(JSON.stringify({type:\"set_username\",username:user}));\n}\nfunction setUser(){\n  var v=$(\"u\").value.trim().replace(/^@/,\"\");if(!v)return;\n  user=v;try{localStorage.setItem(KEY,v)}catch(e){}\n  status(\"جارٍ الاتصال بـ @\"+v+\"...\");login();\n}\n$(\"go\").onclick=setUser;\n$(\"u\").onkeydown=function(e){if(e.key===\"Enter\")setUser()};\n\n// ---- نسخ الرابط الشفاف ----\n$(\"cp\").onclick=function(){\n  if(!user){status(\"اكتب اسم المستخدم أولاً\");return}\n  var u=new URL(location.href);u.search=\"\";u.hash=\"\";\n  u.searchParams.set(\"username\",user);u.searchParams.set(\"port\",PORT);\n  u.searchParams.set(\"count\",COUNT);u.searchParams.set(\"transparent\",\"1\");\n  var t=u.toString();\n  function done(ok){status(ok?\"تم نسخ الرابط ✓ ألصقه بـ Live Studio\":\"تعذّر النسخ\")}\n  function fb(){var a=document.createElement(\"textarea\");a.value=t;a.style.cssText=\"position:fixed;opacity:0\";document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand(\"copy\")}catch(e){}a.remove();done(ok)}\n  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){done(true)},fb);else fb();\n};\n\nconnect();\n\n// تجربة سريعة: اضغط T\nvar demo={},N=[\"sara_23\",\"mo.tiktok\",\"layla.live\",\"user_9981\",\"noor.n\",\"rami_x\"];\naddEventListener(\"keydown\",function(e){\n  if(e.key.toLowerCase()!==\"t\"||e.target.tagName===\"INPUT\")return;\n  var n=N[Math.floor(Math.random()*N.length)];\n  demo[n]=demo[n]||{id:n,name:n,avatar:\"\",count:0};demo[n].count+=1+Math.floor(Math.random()*3);\n  update(Object.values(demo).sort(function(a,b){return b.count-a.count}));\n});\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","py":"# -*- coding: utf-8 -*-\n\"\"\"\nOVERLYASMARO_server.py\n========================\nملف باثون واحد فقط، بيجمع كل السيرفرات القديمة يلي كانت عم تشتغل لحالها:\n  - tiktok_bridge.py                 (تأثير القلوب على اللايكات/الهدايا)\n  - tiktok_hearts_leaderboard.py     (لوحة الأكثر تفاعلاً - بالايكات)\n  - tiktok_gift_rocket.py            (صاروخ الهدايا)\n  - tiktok_top_supporters.py         (لوحة أفضل 8 داعمين - بقيمة الهدايا/الدايموند)\n  - tiktok_snake_bridge.py           (عالم الحيايا 3D - ساحة الثعابين)\n  - Ultimate TikTok Arena             (معركة التيك توك الخارقة - ساحة قتال\n                                       حية بالكبسات/المشاركات/الهدايا)\n\nهلأ الستة صاروا يشتغلوا من خادم WebSocket واحد بس، على منفذ واحد (PORT\nتحت)، وكل واجهات الـHTML (يلي هلأ صارت كمان بملف واحد اسمه\nOVERLYASMARO_studio.html) بتتصل بنفس هالخادم وبتاخد بس الرسائل يلي تخصها.\n\nالتثبيت:\n    pip install TikTokLive websockets\n\nالتشغيل:\n    python OVERLYASMARO_server.py [اسم_المستخدم]\n\n- إذا مررت اسم المستخدم من سطر الأوامر (أو كتبته لما يطلب منك) بيبلش\n  يراقب البث فورًا.\n- إذا تركته فاضي، ممكن ترسل اسم المستخدم لاحقًا من أي نافذة بصفحة\n  OVERLYASMARO_studio.html (بمجرد ما تكتبه بلوحة التحكم أو بأي من الواجهات\n  الخمسة وتفتحها، هي بترسله تلقائيًا للسيرفر).\n- تقدر تفتح أكثر من نافذة (تأثير القلوب + لوحة المتفاعلين + صاروخ\n  الهدايا + توب الداعمين + عالم الحيايا 3D) بنفس الوقت، وكلهم رح\n  يستمروا يشتغلوا سوا من دون ما توقف أي وحدة منهم، لأنهم كلهم عم\n  يتغذّوا من نفس الاتصال الوحيد بتيك توك.\n\nعن \"عالم الحيايا 3D\": هاي الواجهة الجديدة بتستقبل نفس أحداث اللايكات\nوالهدايا يلي بتغذّي باقي الواجهات، وبتترجمها لرسائل \"support\" (كل ما\nتوصل مجموعة لايكات لعتبة LIKE_THRESHOLD تتولد وحدة دعم، وكل هدية\nبتتحول قيمتها بالدايموند مباشرة لوحدة دعم) عشان تكبر حية الداعم بالساحة.\n\nملاحظة عن الهدايا المتتالية (Combo/Streak):\nتيك توك يرسل حدث GiftEvent عدة مرات أثناء إرسال هدية بشكل متتالي، والعدد\nالحقيقي (repeat_count) ما بيصير نهائي إلا بآخر حدث بالسلسلة\n(repeat_end = True). لهيك صاروخ الهدايا ولوحة توب الداعمين بينتظروا\nلهيك آخر حدث قبل ما يحسبوا القيمة، عشان ما يطلع عدد/مجموع غلط بمنتصف\nالإرسال.\n\nإذا واجهت انقطاعًا متكررًا رغم أن البث شغّال، هالسبب غالبًا يكون بسبب\nالحد المجاني لخادم التوقيع (Euler Stream) اللي تعتمد عليه مكتبة\nTikTokLive. الحل: احصل على مفتاح مجاني من https://www.eulerstream.com\nوالصقه بالمتغيّر SIGN_API_KEY تحت.\n\"\"\"\n\nimport asyncio\nimport json\nimport sys\nimport os\nimport re\nimport inspect\nimport secrets\nimport threading\nimport importlib.util\nimport http.server\nimport urllib.parse\nimport webbrowser\nfrom datetime import datetime, timezone\n\nimport websockets\nfrom TikTokLive import TikTokLiveClient\nfrom TikTokLive.client.web.web_settings import WebDefaults\nfrom TikTokLive.events import (\n    ConnectEvent, DisconnectEvent, LikeEvent, GiftEvent, CommentEvent, ShareEvent,\n)\n\n# ---------------------------------------------------------------------------\n# إعدادات بسيطة يمكنك تعديلها\n# ---------------------------------------------------------------------------\nPORT = 8765            # منفذ واحد لكل الواجهات الخمسة (نفس المكتوب بملف الـHTML)\nSIGN_API_KEY = \"\"      # اختياري: مفتاح eulerstream.com إن واجهت انقطاعًا متكررًا\nRECHECK_SECONDS = 15   # كل كم ثانية يتحقق إن كان البث بدأ (عندما يكون غير مباشر)\nSUPPORTERS_TOP_N = 8   # ثابت: أفضل 8 داعمين بلوحة الداعمين\nDEFAULT_LIKE_THRESHOLD = 10   # عدد اللايكات المتراكمة = وحدة دعم واحدة بساحة \"عالم الحيايا\" (تُستبدل بالقيمة يلي بترسلها الواجهة عند تسجيل الدخول)\n\n# افتح المتصفح تلقائيًا على صفحة التحكم عند تشغيل البرنامج (اضبطها False لو ما بدك)\nAUTO_OPEN_BROWSER = True\nHTTP_PORT = 8766   # المتجر بيفتح على http://localhost:8766 (وبيحفظ التعديلات ويبني النسخ الجديدة)\nHTML_FILE_NAME = \"OVERLYASMARO_studio.html\"   # لازم يكون بنفس مجلد هذا الملف (أو مجلد الـ exe)\n\nif SIGN_API_KEY:\n    WebDefaults.tiktok_sign_api_key = SIGN_API_KEY\n\n# ---------------------------------------------------------------------------\n# خادم WebSocket المحلي المشترك (تتصل فيه الواجهات الأربع)\n# ---------------------------------------------------------------------------\nCONNECTED_CLIENTS = set()\n\nLEADERBOARD = {}     # لوحة \"الأكثر تفاعلاً\" (لايكات) -> id: {id,name,avatar,count}\nSUPPORTERS = {}       # لوحة \"توب الداعمين\" (قيمة الهدايا التراكمية) -> id: {id,name,avatar,total}\n\ncurrent_username = None\nactive_task = None\nlike_threshold = DEFAULT_LIKE_THRESHOLD   # بتتحدّث من رسالة \"login\" يلي بترسلها واجهة عالم الحيايا\n\n\nasync def broadcast(payload: dict):\n    for _m in list(PLUGINS.values()):\n        asyncio.ensure_future(_run_plugin(_m, payload))\n    if not CONNECTED_CLIENTS:\n        return\n    message = json.dumps(payload, ensure_ascii=False)\n    await asyncio.gather(\n        *[c.send(message) for c in list(CONNECTED_CLIENTS)],\n        return_exceptions=True,\n    )\n\n\n# ---------------- لوحة الأكثر تفاعلاً (لايكات) ----------------\ndef top_list(limit: int = 12):\n    ranked = sorted(LEADERBOARD.values(), key=lambda u: u[\"count\"], reverse=True)\n    return ranked[:limit]\n\n\nasync def send_leaderboard(target=None):\n    payload = {\"type\": \"leaderboard\", \"top\": top_list(12)}\n    if target is not None:\n        try:\n            await target.send(json.dumps(payload, ensure_ascii=False))\n        except Exception:\n            pass\n    else:\n        await broadcast(payload)\n\n\n# ---------------- لوحة توب الداعمين (قيمة الهدايا) ----------------\ndef supporters_top_list(limit: int = SUPPORTERS_TOP_N):\n    ranked = sorted(SUPPORTERS.values(), key=lambda u: u[\"total\"], reverse=True)\n    # صفحة توب الداعمين ما بتعرض إلا \"id\" و\"avatar\" فقط (بدون اسم ولا رقم)\n    return [{\"id\": u[\"id\"], \"avatar\": u[\"avatar\"]} for u in ranked[:limit]]\n\n\nasync def send_supporters_leaderboard(target=None):\n    payload = {\"type\": \"supporters_leaderboard\", \"top\": supporters_top_list()}\n    if target is not None:\n        try:\n            await target.send(json.dumps(payload, ensure_ascii=False))\n        except Exception:\n            pass\n    else:\n        await broadcast(payload)\n\n\n# ---------------------------------------------------------------------------\n# استخراج بيانات المستخدم والهدية بشكل متوافق مع أكثر من إصدار للمكتبة\n# ---------------------------------------------------------------------------\ndef get_name(user) -> str:\n    try:\n        return user.nickname or user.unique_id or \"viewer\"\n    except Exception:\n        return \"viewer\"\n\n\ndef get_id(user) -> str:\n    try:\n        return user.unique_id or get_name(user)\n    except Exception:\n        return get_name(user)\n\n\ndef get_avatar(user) -> str:\n    \"\"\"صورة الملف الشخصي تبع الداعم نفسه (وليس صورة الهدية).\"\"\"\n    candidates = (\n        lambda u: u.avatar_thumb.url_list[-1],\n        lambda u: u.avatar_thumb.url_list[0],\n        lambda u: u.profile_picture.urls[-1],\n        lambda u: u.profile_picture.urls[0],\n    )\n    for get in candidates:\n        try:\n            url = get(user)\n            if url:\n                return url\n        except Exception:\n            continue\n    return \"\"\n\n\ndef get_gift_name(gift) -> str:\n    try:\n        val = getattr(gift, \"name\")\n        if val:\n            return val\n    except Exception:\n        pass\n    return \"gift\"\n\n\ndef get_gift_icon(gift) -> str:\n    candidates = (\n        lambda g: g.image.url_list[-1],\n        lambda g: g.image.url_list[0],\n        lambda g: g.icon.url_list[-1],\n    )\n    for get in candidates:\n        try:\n            url = get(gift)\n            if url:\n                return url\n        except Exception:\n            continue\n    return \"\"\n\n\ndef get_gift_diamonds(gift) -> int:\n    for attr in (\"diamond_count\", \"diamondCount\"):\n        try:\n            val = getattr(gift, attr)\n            if val is not None:\n                return int(val)\n        except Exception:\n            continue\n    return 0\n\n\ndef is_final_gift_event(event: GiftEvent) -> bool:\n    \"\"\"\n    True إذا كان هذا هو الحدث الأخير للهدية (يعني repeat_count صار نهائيًا\n    ويمكن الاعتماد عليه). الهدايا غير المتتالية (streakable=False) تُعتبر\n    نهائية دائمًا لأنها ما عندها مفهوم \"سلسلة\".\n    \"\"\"\n    gift = event.gift\n    streakable = None\n    for attr in (\"streakable\", \"combo\", \"is_combo\"):\n        try:\n            streakable = getattr(gift, attr)\n            if streakable is not None:\n                break\n        except Exception:\n            continue\n    if not streakable:\n        return True\n    try:\n        return bool(event.repeat_end)\n    except Exception:\n        return True\n\n\n# ---------------------------------------------------------------------------\n# منطق الاتصال بتيك توك (لحساب واحد بكل مرة، ويغذّي كل التأثيرات الأربعة)\n# ---------------------------------------------------------------------------\nasync def run_tiktok_client(username: str):\n    global LEADERBOARD, SUPPORTERS\n    LEADERBOARD = {}   # نفرّغ لوحة المتفاعلين مع كل حساب جديد\n    SUPPORTERS = {}     # نفرّغ لوحة توب الداعمين مع كل حساب جديد\n    client = TikTokLiveClient(unique_id=username)\n\n    @client.on(ConnectEvent)\n    async def on_connect(event: ConnectEvent):\n        print(f\"[+] تم الاتصال بلايف @{event.unique_id}\")\n        # نبعت uniqueId كمان (بالإضافة لـ username) لأن واجهة \"عالم الحيايا\"\n        # بتتوقع هالاسم تحديدًا بالحقل عشان تعرف إنو الاتصال الحقيقي صار\n        await broadcast({\n            \"type\": \"status\",\n            \"state\": \"connected\",\n            \"username\": event.unique_id,\n            \"uniqueId\": event.unique_id,\n        })\n\n    @client.on(DisconnectEvent)\n    async def on_disconnect(_event):\n        print(\"[-] انقطع الاتصال بالبث (أو انتهى اللايف).\")\n        await broadcast({\"type\": \"status\", \"state\": \"disconnected\"})\n\n    @client.on(LikeEvent)\n    async def on_like(event: LikeEvent):\n        user = event.user\n        uid = get_id(user)\n        count = getattr(event, \"count\", None) or 1\n\n        # 1) تأثير القلوب (وتُستخدم أيضًا من واجهة \"معركة التيك توك الخارقة\"\n        #    عشان تكبّر بطل كل مستخدم حسب عدد لايكاته)\n        await broadcast({\n            \"type\": \"heart\",\n            \"id\": uid,\n            \"nickname\": get_name(user),\n            \"avatar\": get_avatar(user),\n            \"count\": int(count),\n            \"ts\": datetime.now(timezone.utc).isoformat(),\n        })\n\n        # 2) تحديث لوحة المتفاعلين (لايكات)\n        entry = LEADERBOARD.get(uid)\n        if entry is None:\n            entry = {\"id\": uid, \"name\": get_name(user), \"avatar\": get_avatar(user), \"count\": 0}\n            LEADERBOARD[uid] = entry\n        prev_count = entry[\"count\"]\n        entry[\"count\"] += int(count)\n        entry[\"name\"] = get_name(user)\n        avatar = get_avatar(user)\n        if avatar:\n            entry[\"avatar\"] = avatar\n        await send_leaderboard()\n\n        # 3) عالم الحيايا 3D: كل ما يتجمّع عدد لايكات = عتبة LIKE_THRESHOLD،\n        #    بنبعت \"وحدة دعم\" وحدة عشان تكبر حية هالمستخدم بالساحة\n        threshold = max(1, int(like_threshold or DEFAULT_LIKE_THRESHOLD))\n        prev_units = prev_count // threshold\n        new_units = entry[\"count\"] // threshold\n        gained_units = new_units - prev_units\n        if gained_units > 0:\n            await broadcast({\n                \"type\": \"support\",\n                \"uniqueId\": uid,\n                \"nickname\": entry[\"name\"],\n                \"profilePic\": entry.get(\"avatar\", \"\"),\n                \"value\": int(gained_units),\n            })\n\n    @client.on(GiftEvent)\n    async def on_gift(event: GiftEvent):\n        user = event.user\n        gift = event.gift\n        uid = get_id(user)\n\n        # 1) نفس منطق tiktok_bridge.py القديم: أي هدية بتولّد كمان دفعة\n        #    قلوب إضافية (4) بتأثير القلوب، حتى لو صاروخ الهدايا مش مفتوح\n        await broadcast({\n            \"type\": \"heart\",\n            \"id\": uid,\n            \"nickname\": get_name(user),\n            \"avatar\": get_avatar(user),\n            \"count\": 4,\n            \"ts\": datetime.now(timezone.utc).isoformat(),\n        })\n\n        # 2) صاروخ الهدايا + لوحة توب الداعمين: ننتظر آخر حدث بالسلسلة\n        #    (streak) قبل ما نحسب القيمة النهائية\n        if not is_final_gift_event(event):\n            return\n\n        repeat_count = getattr(event, \"repeat_count\", None) or 1\n        diamonds = get_gift_diamonds(gift)\n        total_value = diamonds * int(repeat_count)\n        avatar = get_avatar(user)\n        icon = get_gift_icon(gift)\n\n        # --- صاروخ الهدايا (ونفس الحمولة تستخدمها واجهة \"معركة التيك توك\n        #     الخارقة\" لتكبير/تسليح بطل المُهدي حسب قيمة الهدية) ---\n        payload = {\n            \"type\": \"gift\",\n            \"id\": uid,\n            \"nickname\": get_name(user),\n            \"avatar\": avatar,       # صورة الداعم نفسه (تظهر بالصاروخ والانفجار)\n            \"giftId\": get_gift_name(gift),\n            \"icon\": icon,            # صورة الهدية (احتياطية فقط)\n            \"diamonds\": diamonds,\n            \"repeat\": int(repeat_count),\n            \"total\": total_value,\n            \"ts\": datetime.now(timezone.utc).isoformat(),\n        }\n        print(f\"[gift] @{payload['nickname']} -> {payload['giftId']} \"\n              f\"x{payload['repeat']} (قيمة إجمالية: {total_value})\")\n        await broadcast(payload)\n\n        # --- لوحة توب الداعمين (تراكمي منذ بداية تشغيل البرنامج) ---\n        entry = SUPPORTERS.get(uid)\n        if entry is None:\n            entry = {\"id\": uid, \"name\": get_name(user), \"avatar\": avatar, \"total\": 0}\n            SUPPORTERS[uid] = entry\n        entry[\"total\"] += total_value\n        entry[\"name\"] = get_name(user)\n        if avatar:\n            entry[\"avatar\"] = avatar\n\n        await send_supporters_leaderboard()\n        await broadcast({\n            \"type\": \"supporters_gift\",\n            \"id\": uid,\n            \"avatar\": entry[\"avatar\"],\n            \"icon\": icon,\n        })\n\n        # --- عالم الحيايا 3D: أي هدية بتتحول قيمتها بالدايموند مباشرة\n        #     لوحدة دعم تكبّر حية الداعم بالساحة ---\n        if total_value > 0:\n            await broadcast({\n                \"type\": \"support\",\n                \"uniqueId\": uid,\n                \"nickname\": entry[\"name\"],\n                \"profilePic\": entry.get(\"avatar\", avatar),\n                \"value\": int(total_value),\n            })\n\n    @client.on(CommentEvent)\n    async def on_comment(event: CommentEvent):\n        # تُستخدم فقط من واجهة \"معركة التيك توك الخارقة\" لعرض التعليقات\n        # بشريط الدردشة (بدون أي تأثير على باقي الواجهات)\n        user = event.user\n        uid = get_id(user)\n        comment_text = \"\"\n /* =====================================================================
   أداة مشتركة: تشيل الخلفية البيضاء/الصلبة من صور "الأيقونات" (صور
   الهدايا القادمة من تيك توك) قبل ما تنعرض، حتى تطلع الأيقونة لحالها
   شفافة من دون أي مربع أبيض حواليها. ما بنطبّقها على صور البروفايل
   (avatar) لأنها صور أشخاص حقيقية.
   ملاحظة مهمة: هاي الطريقة بتعتمد على قراءة بكسلات الصورة من داخل
   المتصفح (canvas)، وهاد بيشتغل بس إذا سيرفر تيك توك يلي مستضيف الصورة
   يسمح بالوصول لهيك (CORS). إذا ما سمح، بترجع الصورة الأصلية متل ما هي
   من دون أي تعديل (ما في طريقة تانية من المتصفح لتفاديه).
   ===================================================================== */
(function(){
  "use strict";
  const cache = new Map();
  window.ttCleanIcon = function(url, onReady){
    if(!url){ onReady(url); return; }
    if(cache.has(url)){ onReady(cache.get(url)); return; }

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function(){
      try{
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth || img.width;
        canvas.height = img.naturalHeight || img.height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const px = data.data;
        // أي بكسل قريب من الأبيض (أو من لون الزاوية العلوية اليسرى،
        // غالبًا هو لون الخلفية) منخليه شفاف بالكامل
        const bgR = px[0], bgG = px[1], bgB = px[2];
        for(let i=0;i<px.length;i+=4){
          const r=px[i], g=px[i+1], b=px[i+2];
          const nearWhite = r>235 && g>235 && b>235;
          const nearCorner = Math.abs(r-bgR)<18 && Math.abs(g-bgG)<18 && Math.abs(b-bgB)<18;
          if(nearWhite || nearCorner){ px[i+3] = 0; }
        }
        ctx.putImageData(data, 0, 0);
        const clean = canvas.toDataURL("image/png");
        cache.set(url, clean);
        onReady(clean);
      } catch(e){
        // الصورة "ملوّثة" (Cross-Origin) ومتصفحك مانع قراءة بكسلاتها:
        // منرجع الصورة الأصلية كما هي بدل ما نكسر العرض
        cache.set(url, url);
        onReady(url);
      }
    };
    img.onerror = function(){ onReady(url); };
    img.src = url;
  };
})();
</script>

<script type="text/plain" id="src-hearts">(function(){
  "use strict";

  const params = new URLSearchParams(location.search);
  const panel = document.getElementById("controller-panel");
  const usernameInput = document.getElementById("username-input");
  const copyBtn = document.getElementById("copy-btn");
  const copyFeedback = document.getElementById("copy-feedback");

  const targetUsername = params.get("username");

  // إذا تم فتح الرابط مع اسم المستخدم (داخل Live Studio)، نخفي اللوحة تماماً وتصبح الصفحة شفافة
  if (targetUsername) {
    panel.style.display = "none";
  }

  copyBtn.addEventListener("click", () => {
    let val = usernameInput.value.trim().replace("@", "");
    if (!val) {
      copyFeedback.textContent = "الرجاء إدخال اسم المستخدم أولاً!";
      return;
    }
    let generatedUrl = window.location.href.split('?')[0] + "?view=hearts&port=" + PORT + "&username=" + encodeURIComponent(val);
    
    navigator.clipboard.writeText(generatedUrl).then(() => {
      copyFeedback.textContent = "تم نسخ الرابط الشفاف بنجاح! ألصقه في Live Studio";
      setTimeout(() => { copyFeedback.textContent = ""; }, 4000);
    }).catch(err => {
      copyFeedback.textContent = "تعذر النسخ، نسخه يدوياً من المتصفح.";
    });
  });

  const PORT = params.get("port") || 8765;
  const stage = document.getElementById("stage");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("status-text");

  const GLOWS = ["#ff2d75", "#ffd166", "#c86bff", "#ff7ab6"];
  function glowFor(name){
    let h = 0;
    for(let i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) >>> 0; }
    return GLOWS[h % GLOWS.length];
  }

  function setStatus(text, ok){
    statusText.textContent = text;
    statusEl.classList.toggle("ok", !!ok);
    statusEl.classList.add("show");
    clearTimeout(setStatus._t);
    if(ok){
      setStatus._t = setTimeout(()=> statusEl.classList.remove("show"), 2200);
    }
  }

  const MAX_ON_SCREEN = 28;
  let onScreen = 0;

  function spawnHeart(nickname, avatarUrl){
    if(onScreen >= MAX_ON_SCREEN) return;
    onScreen++;

    const size = 95 + Math.random()*40;
    const x = 12 + Math.random()*76;
    const y = 14 + Math.random()*68;
    const glow = glowFor(nickname || "viewer");

    const burst = document.createElement("div");
    burst.className = "burst";
    burst.style.left = x + "%";
    burst.style.top = y + "%";
    burst.style.setProperty("--size", size + "px");
    burst.style.setProperty("--glow", glow);

    const heartWrap = document.createElement("div");
    heartWrap.className = "heart-wrap";

    const ring = document.createElement("div");
    ring.className = "heart-ring";

    const img = document.createElement("img");
    img.className = "heart-img";
    img.referrerPolicy = "no-referrer";
    img.src = avatarUrl || "";
    img.onerror = function(){
      this.onerror = null;
      this.style.background = `linear-gradient(160deg, ${glow}, #2a0d16)`;
      this.removeAttribute("src");
    };

    const shine = document.createElement("div");
    shine.className = "heart-shine";

    heartWrap.appendChild(ring);
    heartWrap.appendChild(img);
    heartWrap.appendChild(shine);

    const nick = document.createElement("div");
    nick.className = "nick";
    nick.textContent = "@" + (nickname || "viewer");

    burst.appendChild(spawnParticles(glow, "in"));
    burst.appendChild(heartWrap);
    burst.appendChild(nick);
    burst.appendChild(spawnParticles(glow, "out"));

    stage.appendChild(burst);

    setTimeout(() => {
      burst.remove();
      onScreen--;
    }, 2450);
  }

  function spawnParticles(color, phase){
    const wrap = document.createElement("div");
    const count = 9;
    for(let i=0;i<count;i++){
      const p = document.createElement("span");
      p.className = "particle " + phase;
      const angle = (Math.PI*2 * i / count) + (Math.random()*0.5 - 0.25);
      const dist = 40 + Math.random()*46;
      p.style.setProperty("--tx", Math.cos(angle)*dist + "px");
      p.style.setProperty("--ty", Math.sin(angle)*dist + "px");
      p.style.setProperty("--rot", (Math.random()*260-130) + "deg");
      p.style.setProperty("--p-size", (4 + Math.random()*5) + "px");
      p.style.setProperty("--p-round", Math.random() > .5 ? "50%" : "2px");
      p.style.setProperty("--p-color", Math.random() > .35 ? color : "#ffffff");
      wrap.appendChild(p);
    }
    return wrap;
  }

  const queue = [];
  let draining = false;
  function enqueue(nickname, avatar, times){
    for(let i=0;i<times;i++) queue.push({nickname, avatar});
    drain();
  }
  function drain(){
    if(draining) return;
    draining = true;
    (function step(){
      const item = queue.shift();
      if(!item){ draining = false; return; }
      spawnHeart(item.nickname, item.avatar);
      setTimeout(step, 90 + Math.random()*70);
    })();
  }

  function connect(){
    let ws;
    try{
      ws = new WebSocket(`ws://localhost:${PORT}`);
    } catch(e){
      setStatus("تعذر الاتصال بالسيرفر المحلي...", false);
      setTimeout(connect, 2500);
      return;
    }

    ws.onopen = () => {
      setStatus("متصل بالسيرفر المحلي ✓", true);
      // إذا تم فتح الصفحة برابط يحتوي على اسم المستخدم، نطلبه تلقائياً من السيرفر
      if(targetUsername){
        ws.send(JSON.stringify({ type: "set_username", username: targetUsername }));
      }
    };

    ws.onclose = () => {
      setStatus("انقطع الاتصال، إعادة المحاولة...", false);
      setTimeout(connect, 2500);
    };
    ws.onerror = () => ws.close();

    ws.onmessage = (evt) => {
      let data;
      try{ data = JSON.parse(evt.data); } catch(e){ return; }

      if(data.type === "status"){
        if(data.state === "connected"){
          setStatus("متصل باللايف @" + (data.username || ""), true);
        } else if(data.state === "disconnected"){
          setStatus("انتهى البث أو انقطع الاتصال", false);
        }
        return;
      }

      if(data.type === "heart"){
        const times = Math.max(1, Math.min(6, parseInt(data.count, 10) || 1));
        enqueue(data.nickname, data.avatar, times);
      }
    };
  }

  // إذا كنا في صفحة التحكم العامة (وليس داخل اللايف استوديو)، لا داعي للاتصال بالسيرفر المحلي
  if(targetUsername){
    connect();
  } else {
    statusEl.style.display = "none";
  }

  // معاينة سريعة بالضغط على زر T
  const DEMO_NAMES = ["sara_23","mo.tiktok","layla.live","user_9981","fan_of_you"];
  const DEMO_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'>
       <rect width='120' height='120' fill='#ff2d75'/>
       <circle cx='60' cy='45' r='22' fill='#ffe1ea'/>
       <ellipse cx='60' cy='100' rx='38' ry='30' fill='#ffe1ea'/>
     </svg>`
  );
  window.addEventListener("keydown", (e) => {
    if(e.key.toLowerCase() === "t"){
      const name = DEMO_NAMES[Math.floor(Math.random()*DEMO_NAMES.length)];
      enqueue(name, DEMO_AVATAR, 1 + Math.floor(Math.random()*3));
    }
  });
})();</script>
<script type="text/plain" id="src-leaderboard">(function(){
  "use strict";

  const params = new URLSearchParams(location.search);
  const panelCtrl = document.getElementById("controller-panel");
  const usernameInput = document.getElementById("username-input");
  const copyBtn = document.getElementById("copy-btn");
  const copyFeedback = document.getElementById("copy-feedback");

  const targetUsername = params.get("username");

  if (targetUsername) {
    panelCtrl.style.display = "none";
  }

  copyBtn.addEventListener("click", () => {
    let val = usernameInput.value.trim().replace("@", "");
    if (!val) {
      copyFeedback.textContent = "الرجاء إدخال اسم المستخدم أولاً!";
      return;
    }
    let generatedUrl = window.location.href.split('?')[0] + "?view=leaderboard&port=" + PORT + "&username=" + encodeURIComponent(val);
    
    navigator.clipboard.writeText(generatedUrl).then(() => {
      copyFeedback.textContent = "تم نسخ الرابط بنجاح! ألصقه في Live Studio";
      setTimeout(() => { copyFeedback.textContent = ""; }, 4000);
    }).catch(() => {
      copyFeedback.textContent = "تعذر النسخ، انسخه يدوياً.";
    });
  });

  const COUNT = Math.max(1, Math.min(12, parseInt(params.get("count"), 10) || 6));
  const SIDE = (params.get("side") === "left") ? "left" : "right";
  const PORT = params.get("port") || 8765;

  const panel = document.getElementById("panel");
  panel.classList.add("side-" + SIDE);

  const rowsEl = document.getElementById("rows");
  rowsEl.style.setProperty("--rows", COUNT);

  const GLOWS = ["#ff2d75", "#ffd166", "#c86bff", "#ff7ab6"];
  function glowFor(name){
    let h = 0;
    for(let i=0;i<name.length;i++){ h = (h*31 + name.charCodeAt(i)) >>> 0; }
    return GLOWS[h % GLOWS.length];
  }

  const slots = [];
  for(let i=0;i<COUNT;i++){
    const row = document.createElement("div");
    row.className = "row empty side-" + SIDE;
    row.style.top = (i * (74 + 10)) + "px";

    row.innerHTML = `
      <div class="rank">${i+1}</div>
      <div class="avatar-wrap"><div class="fallback">♡</div></div>
      <div class="info"><div class="name placeholder-text">بانتظار أحد...</div></div>
      <div class="count">0</div>
    `;
    rowsEl.appendChild(row);
    slots.push({ el: row, id: null, count: 0 });
  }

  function rankClass(i){
    if(i === 0) return "r1";
    if(i === 1) return "r2";
    if(i === 2) return "r3";
    return "";
  }

  function renderSlot(slot, index, person){
    const el = slot.el;
    el.classList.remove("empty");
    el.style.top = (index * (74 + 10)) + "px";

    const rankEl = el.querySelector(".rank");
    rankEl.textContent = index + 1;
    rankEl.className = "rank " + rankClass(index);

    const glow = glowFor(person.id || person.name || "viewer");
    el.querySelector(".avatar-wrap").style.setProperty("--glow", glow);

    const avatarWrap = el.querySelector(".avatar-wrap");
    let img = avatarWrap.querySelector("img");
    if(!img){
      avatarWrap.innerHTML = "";
      img = document.createElement("img");
      img.referrerPolicy = "no-referrer";
      img.onerror = function(){
        this.remove();
        const fb = document.createElement("div");
        fb.className = "fallback";
        fb.textContent = (person.name || "?").trim().charAt(0).toUpperCase() || "♡";
        avatarWrap.appendChild(fb);
      };
      avatarWrap.appendChild(img);
    }
    if(img.src !== person.avatar && person.avatar){
      img.src = person.avatar;
    }

    const nameEl = el.querySelector(".name");
    nameEl.classList.remove("placeholder-text");
    nameEl.textContent = "@" + (person.name || "viewer");

    const countEl = el.querySelector(".count");
    const newCount = person.count || 0;
    countEl.textContent = newCount;
    if(slot.count !== newCount && slot.id === (person.id || person.name)){
      countEl.classList.remove("bump");
      void countEl.offsetWidth;
      countEl.classList.add("bump");
    }
    slot.count = newCount;
    slot.id = person.id || person.name;
  }

  function resetSlotEmpty(slot, index){
    const el = slot.el;
    el.classList.add("empty");
    el.style.top = (index * (74 + 10)) + "px";
    el.querySelector(".rank").className = "rank " + rankClass(index);
    el.querySelector(".rank").textContent = index + 1;
    const avatarWrap = el.querySelector(".avatar-wrap");
    avatarWrap.innerHTML = '<div class="fallback">♡</div>';
    const nameEl = el.querySelector(".name");
    nameEl.classList.add("placeholder-text");
    nameEl.textContent = "بانتظار أحد...";
    el.querySelector(".count").textContent = "0";
    slot.id = null;
    slot.count = 0;
  }

  function updateLeaderboard(top){
    const list = (top || []).slice(0, COUNT);
    for(let i=0;i<COUNT;i++){
      const person = list[i];
      const slot = slots[i];
      if(person){
        renderSlot(slot, i, person);
      } else {
        resetSlotEmpty(slot, i);
      }
    }
  }

  function connect(){
    let ws;
    try{
      ws = new WebSocket(`ws://localhost:${PORT}`);
    } catch(e){
      setTimeout(connect, 2500);
      return;
    }

    ws.onopen = () => {
      if(targetUsername){
        ws.send(JSON.stringify({ type: "set_username", username: targetUsername }));
      }
    };

    ws.onclose = () => setTimeout(connect, 2500);
    ws.onerror = () => ws.close();
    ws.onmessage = (evt) => {
      let data;
      try{ data = JSON.parse(evt.data); } catch(e){ return; }
      if(data.type === "leaderboard"){
        updateLeaderboard(data.top);
      }
    };
  }

  if(targetUsername){
    connect();
  } else {
    panel.style.display = "none";
  }

  // تجربة سريعة بالضغط على T
  const DEMO_NAMES = ["sara_23","mo.tiktok","layla.live","user_9981","fan_of_you","noor.n","rami_x","dana.k"];
  const DEMO_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'>
       <rect width='120' height='120' fill='#ff2d75'/>
       <circle cx='60' cy='45' r='22' fill='#ffe1ea'/>
       <ellipse cx='60' cy='100' rx='38' ry='30' fill='#ffe1ea'/>
     </svg>`
  );
  let demoData = {};
  window.addEventListener("keydown", (e) => {
    if(e.key.toLowerCase() !== "t") return;
    const name = DEMO_NAMES[Math.floor(Math.random()*DEMO_NAMES.length)];
    if(!demoData[name]){
      demoData[name] = { id:name, name, avatar:DEMO_AVATAR, count:0 };
    }
    demoData[name].count += 1 + Math.floor(Math.random()*3);
    const top = Object.values(demoData).sort((a,b)=>b.count-a.count);
    updateLeaderboard(top);
  });
})();</script>
