        // REALISTIC PROCEDURAL TREE CREATOR
        function createRealisticTree(scale = 1.0) {
            const treeGroup = new THREE.Group();

            // تنويع خفيف بلون اللحاء بين شجرة وشجرة حتى ما يبينوا كلهم نسخة واحدة مكررة
            const barkTint = 0.85 + Math.random() * 0.3;
            const barkColor = new THREE.Color(0x3d2314).multiplyScalar(barkTint);

            // 1. Detailed Bark Trunk with Branches
            const trunkGeo = new THREE.CylinderGeometry(0.5 * scale, 0.85 * scale, 7 * scale, 10);
            const trunkMat = new THREE.MeshStandardMaterial({
                color: barkColor,
                roughness: 0.9,
                metalness: 0.1
            });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = (3.5 * scale);
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            treeGroup.add(trunk);

            // جذور بارزة بقاعدة الجذع تعطي إحساس أنه "مغروس" فعلياً بالأرض (مش طافي فوقها)
            const rootGeo = new THREE.ConeGeometry(1.1 * scale, 1.3 * scale, 9);
            const rootMesh = new THREE.Mesh(rootGeo, trunkMat);
            rootMesh.position.y = 0.55 * scale;
            rootMesh.scale.y = 0.55;
            rootMesh.castShadow = true;
            rootMesh.receiveShadow = true;
            treeGroup.add(rootMesh);

            // Primary Side Branches
            for (let b = 0; b < 3; b++) {
                const branchGeo = new THREE.CylinderGeometry(0.25 * scale, 0.4 * scale, 3 * scale, 7);
                const branch = new THREE.Mesh(branchGeo, trunkMat);
                branch.position.set(0, (3.5 + b * 0.8) * scale, 0);
                branch.rotation.z = (b % 2 === 0 ? 0.6 : -0.6);
                branch.rotation.y = (b * 2.1);
                branch.castShadow = true;
                treeGroup.add(branch);
            }

            // 2. Layered Volumetric Foliage Canopy (Organic Leaves Clusters)
            const leafColors = [0x15803d, 0x16a34a, 0x14532d, 0x166534, 0x22c55e];
            const clusterPositions = [
                { x: 0, y: 7 * scale, z: 0, r: 2.8 * scale },
                { x: 1.2 * scale, y: 6.2 * scale, z: 0.8 * scale, r: 2.2 * scale },
                { x: -1.2 * scale, y: 6.5 * scale, z: -0.8 * scale, r: 2.3 * scale },
                { x: 0.8 * scale, y: 7.8 * scale, z: -1.0 * scale, r: 2.0 * scale },
                { x: 0, y: 8.8 * scale, z: 0, r: 2.1 * scale }
            ];

            clusterPositions.forEach((cp, idx) => {
                const folGeo = new THREE.DodecahedronGeometry(cp.r, 1);
                const folMat = new THREE.MeshStandardMaterial({
                    color: leafColors[idx % leafColors.length],
                    roughness: 0.6,
                    metalness: 0.05
                });
                const foliage = new THREE.Mesh(folGeo, folMat);
                foliage.position.set(cp.x, cp.y, cp.z);
                foliage.scale.set(1, 0.85, 1);
                foliage.castShadow = true;
                foliage.receiveShadow = true;
                treeGroup.add(foliage);
            });

            return treeGroup;
        }

        // جدار حجري أحمر/أسود (طوب) يحيط بالخريطة بدل الأشجار العشوائية بالأطراف
        function createBrickTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // ملاط أسود بالخلفية
            ctx.fillStyle = '#0e0b0c';
            ctx.fillRect(0, 0, 256, 256);

            const brickW = 42, brickH = 20, gap = 4;
            const redShades = ['#7f1d1d', '#991b1b', '#b91c1c', '#6b1414'];
            let row = 0;
            for (let y = -brickH; y < 256 + brickH; y += brickH + gap) {
                const offset = (row % 2 === 0) ? 0 : -(brickW / 2);
                for (let x = offset - brickW; x < 256 + brickW; x += brickW + gap) {
                    ctx.fillStyle = redShades[Math.floor(Math.random() * redShades.length)];
                    ctx.fillRect(x, y, brickW, brickH);
                    // ظل خفيف تحت كل طوبة يعطي إحساس عمق
                    ctx.fillStyle = 'rgba(0,0,0,0.25)';
                    ctx.fillRect(x, y + brickH - 3, brickW, 3);
                }
                row++;
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function makeWallBox(w, h, d, repeatX, repeatY, brickTexBase) {
            const tex = brickTexBase.clone();
            tex.needsUpdate = true;
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(repeatX, repeatY);
            const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.92, metalness: 0.06 });
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = h / 2;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            return mesh;
        }

        // غطاء حجري أسود متواصل فوق الجدار (بدل مكعبات متفرقة كانت تبين طايرة بالهواء)
        function addWallCap(centerX, centerZ, length, axis, wallHeight, wallThickness) {
            const capH = 0.9;
            const capExtra = 0.5; // أعرض شوي من الجدار عشان يبين كإنه "حافة" حجرية حقيقية
            const mat = new THREE.MeshStandardMaterial({ color: 0x161418, roughness: 0.8, metalness: 0.1 });
            let geo;
            if (axis === 'x') {
                geo = new THREE.BoxGeometry(length + wallThickness * 2 + capExtra, capH, wallThickness + capExtra);
            } else {
                geo = new THREE.BoxGeometry(wallThickness + capExtra, capH, length + capExtra);
            }
            const cap = new THREE.Mesh(geo, mat);
            cap.position.set(centerX, wallHeight + capH / 2, centerZ);
            cap.castShadow = true;
            cap.receiveShadow = true;
            scene.add(cap);
        }

        // برج زاوية حجري (أسطوانة + قبعة مخروطية حمراء) بزوايا الخريطة الأربعة
        function createCornerTower(brickTexBase) {
            const group = new THREE.Group();
            const towerH = 9;
            const tex = brickTexBase.clone();
            tex.needsUpdate = true;
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(4, 3);
            const bodyGeo = new THREE.CylinderGeometry(2.6, 3.0, towerH, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = towerH / 2;
            body.castShadow = true; body.receiveShadow = true;
            group.add(body);

            const roofGeo = new THREE.ConeGeometry(3.2, 4, 16);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x7f1d1d, roughness: 0.6, metalness: 0.15 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = towerH + 2;
            roof.castShadow = true;
            group.add(roof);

            return group;
        }

        function buildWallBorder() {
            const wallHeight = 6.5;
            const wallThickness = 2.2;
            const half = ARENA_SIZE + 3; // مسافة الجدار عن حافة الأرض
            const span = half * 2;
            const brickTex = createBrickTexture();

            // الشمال والجنوب (على طول محور X)
            const northWall = makeWallBox(span + wallThickness * 2, wallHeight, wallThickness, span / 4, wallHeight / 3, brickTex);
            northWall.position.set(0, 0, -half - wallThickness / 2);
            scene.add(northWall);
            addWallCap(0, -half - wallThickness / 2, span, 'x', wallHeight, wallThickness);

            const southWall = makeWallBox(span + wallThickness * 2, wallHeight, wallThickness, span / 4, wallHeight / 3, brickTex);
            southWall.position.set(0, 0, half + wallThickness / 2);
            scene.add(southWall);
            addWallCap(0, half + wallThickness / 2, span, 'x', wallHeight, wallThickness);

            // الشرق والغرب (على طول محور Z)
            const eastWall = makeWallBox(wallThickness, wallHeight, span, wallHeight / 3, span / 4, brickTex);
            eastWall.position.set(half + wallThickness / 2, 0, 0);
            scene.add(eastWall);
            addWallCap(half + wallThickness / 2, 0, span, 'z', wallHeight, wallThickness);

            const westWall = makeWallBox(wallThickness, wallHeight, span, wallHeight / 3, span / 4, brickTex);
            westWall.position.set(-half - wallThickness / 2, 0, 0);
            scene.add(westWall);
            addWallCap(-half - wallThickness / 2, 0, span, 'z', wallHeight, wallThickness);

            // أبراج بالأركان الأربعة
            const corners = [[-half, -half], [half, -half], [half, half], [-half, half]];
            for (const [cx, cz] of corners) {
                const tower = createCornerTower(brickTex);
                tower.position.set(cx, 0, cz);
                scene.add(tower);
            }
        }

        // نسيج حشيش واضح وواقعي (تايل قابل للتكرار) — بديل عن حقل الحشيش الكثيف
        // اللي كان يبين "بقعة سودا مشوّشة" من بعيد. هالطريقة أنظف بكتير وأخف على الأداء.
        function createGrassTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // قاعدة أغنى بتدرجات خضراء متعددة (مش لون مسطّح بايخ)
            const grad = ctx.createRadialGradient(512, 512, 100, 512, 512, 760);
            grad.addColorStop(0, '#3fb659');
            grad.addColorStop(0.55, '#349f4c');
            grad.addColorStop(1, '#266f38');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 1024, 1024);

            // رقع كبيرة فاتحة/غامقة تعطي عمق وتنوع طبيعي (مروج وظلال غيوم)
            for (let i = 0; i < 90; i++) {
                const x = Math.random() * 1024, y = Math.random() * 1024, r = 50 + Math.random() * 150;
                ctx.beginPath();
                ctx.fillStyle = Math.random() < 0.5 ? 'rgba(21,128,61,0.28)' : 'rgba(163,230,53,0.16)';
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // بقع تراب/طين فاتحة صغيرة متناثرة تكسر رتابة اللون
            for (let i = 0; i < 55; i++) {
                const x = Math.random() * 1024, y = Math.random() * 1024, r = 8 + Math.random() * 22;
                ctx.beginPath();
                ctx.fillStyle = 'rgba(120,90,55,0.18)';
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }

            // خطوط شفرات العشب — طبقتين (غامقة تحت + فاتحة فوق) تعطي إحساس عمق وكثافة حقيقية
            ctx.lineCap = 'round';
            for (let i = 0; i < 14000; i++) {
                const x = Math.random() * 1024, y = Math.random() * 1024;
                const len = 6 + Math.random() * 11;
                const angle = Math.random() * Math.PI * 2;
                const bright = Math.random() < 0.45;
                const r = bright ? 90 + Math.random() * 60 : 15 + Math.random() * 30;
                const g = bright ? 190 + Math.random() * 55 : 95 + Math.random() * 80;
                const b = bright ? 60 + Math.random() * 40 : 35 + Math.random() * 35;
                ctx.strokeStyle = `rgba(${r},${g},${b},0.8)`;
                ctx.lineWidth = 1 + Math.random() * 1.6;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + Math.cos(angle) * len, y + Math.sin(angle) * len);
                ctx.stroke();
            }

            // بريق ندى خفيف جداً (نقاط ضوء صغيرة متناثرة) يعطي لمعة حياة للعشب
            for (let i = 0; i < 400; i++) {
                const x = Math.random() * 1024, y = Math.random() * 1024;
                ctx.beginPath();
                ctx.fillStyle = 'rgba(255,255,255,0.10)';
                ctx.arc(x, y, 0.8 + Math.random() * 1.1, 0, Math.PI * 2);
                ctx.fill();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.anisotropy = 8;
            return tex;
        }

        function buildEnvironment() {
            const size = ARENA_SIZE * 2;

            // أرضية حشيش واضحة وواقعية (تايل نظيف بدل الحقل الكثيف اللي كان يبين أسود)
            const grassTex = createGrassTexture();
            grassTex.repeat.set(size / 9, size / 9);

            const floorGeo = new THREE.PlaneGeometry(size, size);
            const floorMat = new THREE.MeshStandardMaterial({
                map: grassTex,
                color: 0xffffff,
                roughness: 0.88,
                metalness: 0.02
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // جدار حجري أحمر/أسود يحيط بكامل الخريطة (بدل الأشجار العشوائية اللي كانت بالأطراف)
            buildWallBorder();

            // A FEW SCATTERED TREES IN THE MIDDLE OF THE MAP (sparse, not blocking gameplay entirely)
            const interiorTreeCount = 14;
            let placed = 0, attempts = 0;
            while (placed < interiorTreeCount && attempts < interiorTreeCount * 8) {
                attempts++;
                const x = (Math.random() - 0.5) * (ARENA_SIZE * 1.3);
                const z = (Math.random() - 0.5) * (ARENA_SIZE * 1.3);
                // تجنب التكدّس قرب المركز تماماً حتى يضل في مساحة لعب مفتوحة
                if (Math.hypot(x, z) < 18) continue;
                // تجنب تراكب الأشجار فوق بعض (كانت أحياناً تطلع متلاصقة بشكل غلط)
                let tooClose = false;
                for (const ob of obstacles) {
                    if (Math.hypot(x - ob.x, z - ob.z) < 9) { tooClose = true; break; }
                }
                if (tooClose) continue;
                const scale = 0.9 + Math.random() * 0.5;
                const tree = createRealisticTree(scale);
                tree.position.set(x, 0, z);
                tree.rotation.y = Math.random() * Math.PI * 2;
                scene.add(tree);
                obstacles.push({ x, z, radius: 2.2 * scale });
                placed++;
            }

            // FLOWERS SCATTERED ACROSS THE GROUND (روعة اللون بين الحشيش)
            const flowerColors = [0xef4444, 0xf472b6, 0xfacc15, 0xa855f7, 0xf8fafc, 0x60a5fa];
            const flowerCount = 260;
            for (let i = 0; i < flowerCount; i++) {
                const x = (Math.random() - 0.5) * (ARENA_SIZE * 1.85);
                const z = (Math.random() - 0.5) * (ARENA_SIZE * 1.85);
                const flower = createFlower(flowerColors[Math.floor(Math.random() * flowerColors.length)]);
                flower.position.set(x, 0, z);
                flower.rotation.y = Math.random() * Math.PI * 2;
                flower.scale.setScalar(0.8 + Math.random() * 0.6);
                scene.add(flower);
            }
        }

        function createFruitMesh(type) {
            const group = new THREE.Group();

            if (type === 'apple') {
                const bodyGeo = new THREE.SphereGeometry(0.75, 16, 16);
                bodyGeo.scale(1, 0.9, 1);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.2, metalness: 0.1 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.65;
                body.castShadow = true;
                group.add(body);

                const stemGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.4);
                const stemMat = new THREE.MeshStandardMaterial({ color: 0x78350f });
                const stem = new THREE.Mesh(stemGeo, stemMat);
                stem.position.set(0, 1.3, 0);
                stem.rotation.z = 0.2;
                group.add(stem);

            } else if (type === 'carrot') {
                const bodyGeo = new THREE.ConeGeometry(0.45, 1.6, 12);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.3 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.rotation.z = Math.PI / 2.3;
                body.position.set(0, 0.35, 0);
                body.castShadow = true;
                group.add(body);

            } else if (type === 'banana') {
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(-0.5, 0.2, 0),
                    new THREE.Vector3(0, 0.05, 0),
                    new THREE.Vector3(0.5, 0.35, 0)
                ]);
                const tubeGeo = new THREE.TubeGeometry(curve, 12, 0.25, 8, false);
                const tubeMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.3 });
                const banana = new THREE.Mesh(tubeGeo, tubeMat);
                banana.castShadow = true;
                group.add(banana);

            } else if (type === 'pineapple') {
                const bodyGeo = new THREE.CylinderGeometry(0.55, 0.55, 1.2, 12);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.6;
                body.castShadow = true;
                group.add(body);

                for (let i = 0; i < 4; i++) {
                    const crownGeo = new THREE.ConeGeometry(0.18, 0.6, 4);
                    const crownMat = new THREE.MeshStandardMaterial({ color: 0x16a34a });
                    const crown = new THREE.Mesh(crownGeo, crownMat);
                    crown.position.set((Math.random() - 0.5) * 0.15, 1.3, (Math.random() - 0.5) * 0.15);
                    group.add(crown);
                }

            } else if (type === 'melon') {
                const bodyGeo = new THREE.SphereGeometry(0.85, 16, 16);
                bodyGeo.scale(1.2, 0.85, 0.85);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x15803d, roughness: 0.35 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.65;
                body.castShadow = true;
                group.add(body);

            } else {
                // STARFRUIT
                const bodyGeo = new THREE.TorusKnotGeometry(0.42, 0.18, 28, 8);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.2, metalness: 0.3 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.55;
                body.castShadow = true;
                group.add(body);
            }

            return group;
        }

        function spawnFruit(x, z, customType = null) {
            const types = ['apple', 'carrot', 'banana', 'pineapple', 'melon', 'star'];
            const type = customType || types[Math.floor(Math.random() * types.length)];

            const fruitMesh = createFruitMesh(type);
            fruitMesh.position.set(x, 0.0, z); // Positioned nicely ON THE GROUND plane
            fruitMesh.rotation.y = Math.random() * Math.PI * 2;

            scene.add(fruitMesh);

            const fruitObj = {
                type: type,
                mesh: fruitMesh,
                pos: new THREE.Vector3(x, 0.6, z),
                consumed: false,
                rotSpeed: 0.3 + Math.random() * 0.8
            };

            fruits.push(fruitObj);
            fruitStats[type] = (fruitStats[type] || 0) + 1;
            updateFruitCountersUI();
            return fruitObj;
        }

        function populateFruitField() {
            for (let i = 0; i < INITIAL_FOOD_COUNT; i++) {
                const x = (Math.random() - 0.5) * (ARENA_SIZE * 1.8);
                const z = (Math.random() - 0.5) * (ARENA_SIZE * 1.8);
                spawnFruit(x, z);
            }
        }

        function updateFruitCountersUI() {
            // شلنا شريط عدادات الفواكه من الواجهة بناء على الطلب - الفواكه نفسها ظاهرة بقلب الأرض.
        }

        class Snake {
            constructor(id, name, palette, options = {}) {
                this.id = id;
                this.name = name;
                this.palette = palette;
                this.eatenCount = 0;
                this.isDead = false;

                // --- TikTok Supporter Data ---
                this.ownerId = options.ownerId || null;       // uniqueId تبع الداعم على تيك توك
                this.photoURL = options.photoURL || null;     // صورة الداعم تنحط مكان راس الحية
                this.isSoldier = !!options.isSoldier;          // حية صغيرة "جندي" تابعة لداعم
                this.isBoss = !!options.isBoss;                 // داعم كبير (150+) بيصير قائد ضخم
                this.supportValue = options.supportValue || 0;
                this.scaleBoost = options.isBoss ? 1.6 : options.isSoldier ? 0.6 : 1;
                this.invulnerableTimer = 0;
                this.shieldTimer = 0;
                this.avatarSprite = null;
                this.avatarRing = null;
                this.baseAvatarScale = 3.5;

                const spawnScale = options.isSoldier ? (14 + Math.random() * 10) : (ARENA_SIZE * 1.4);
                const x = (Math.random() - 0.5) * spawnScale;
                const z = (Math.random() - 0.5) * spawnScale;
                this.headPos = new THREE.Vector3(x, 1.0, z);

                this.angle = Math.random() * Math.PI * 2;
                this.targetAngle = this.angle;
                this.speed = options.isSoldier ? 0.5 : 0.42;

                this.segmentSpacing = 1.15;
                this.initialLength = options.isSoldier ? (4 + Math.floor(Math.random() * 3))
                                    : options.isBoss ? (26 + Math.floor(Math.random() * 8))
                                    : (12 + Math.floor(Math.random() * 6));
                this.segments = [];

                for (let i = 0; i < this.initialLength; i++) {
                    const pos = this.headPos.clone().sub(
                        new THREE.Vector3(Math.cos(this.angle), 0, Math.sin(this.angle)).multiplyScalar(i * this.segmentSpacing)
                    );
                    this.segments.push(pos);
                }

                this.changeDirTimer = 0;
                this.targetFruit = null;

                this.build3DMesh();
            }

            build3DMesh() {
                this.group = new THREE.Group();

                // رؤوس أكبر بكتير حتى تبين صورة الداعم بوضوح (كانت صغيرة وما بتبين)
                let headGeo;
                if (this.palette.type === SNAKE_TYPES.COBRA) {
                    headGeo = new THREE.SphereGeometry(1.7, 18, 18);
                    headGeo.scale(1.3, 0.8, 1.4); // Cobra wide hood
                } else if (this.palette.type === SNAKE_TYPES.DRAGON) {
                    headGeo = new THREE.ConeGeometry(1.35, 2.7, 5);
                    headGeo.rotateX(Math.PI / 2);
                } else {
                    headGeo = new THREE.SphereGeometry(1.6, 16, 16);
                }

                const headMat = new THREE.MeshStandardMaterial({
                    color: this.palette.head,
                    roughness: 0.25,
                    metalness: 0.35
                });
                this.headMesh = new THREE.Mesh(headGeo, headMat);
                this.headMesh.castShadow = true;
                this.group.add(this.headMesh);

                // Cute Expressive Eyes
                const eyeGeo = new THREE.SphereGeometry(0.4, 10, 10);
                const eyeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.1 });
                const pupilGeo = new THREE.SphereGeometry(0.2, 8, 8);
                const pupilMat = new THREE.MeshBasicMaterial({ color: 0x090d16 });

                const eyeLeft = new THREE.Mesh(eyeGeo, eyeMat);
                const pupilLeft = new THREE.Mesh(pupilGeo, pupilMat);
                pupilLeft.position.set(0, 0, 0.24);
                eyeLeft.add(pupilLeft);
                eyeLeft.position.set(0.75, 0.42, 0.85);

                const eyeRight = new THREE.Mesh(eyeGeo, eyeMat);
                const pupilRight = new THREE.Mesh(pupilGeo, pupilMat);
                pupilRight.position.set(0, 0, 0.24);
                eyeRight.add(pupilRight);
                eyeRight.position.set(-0.75, 0.42, 0.85);

                this.headMesh.add(eyeLeft);
                this.headMesh.add(eyeRight);

                // 📸 صورة الداعم تكون هي راس الحية نفسها (بدل شكل الراس العادي)
                // (بمجرد ما تنحمّل الصورة بنجاح؛ إذا فشل التحميل بيضل الراس الملون العادي ظاهر كخيار احتياطي)
                if (this.photoURL) {
                    headMat.transparent = true; // جاهز لإخفاء الراس فور نجاح تحميل الصورة

                    // حلقة وصورة أكبر بكتير حتى صورة الداعم تبين بوضوح تام على راس الحية
                    const ringColor = this.isBoss ? 0xffcf40 : this.palette.glow;
                    const ringGeo = new THREE.RingGeometry(1.55, 1.9, 28);
                    const ringMat = new THREE.MeshBasicMaterial({ color: ringColor, side: THREE.DoubleSide });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.position.set(0, 0, 0.95);
                    ring.visible = false;
                    this.headMesh.add(ring);

                    const spriteMat = new THREE.SpriteMaterial({ color: 0xffffff });
                    const sprite = new THREE.Sprite(spriteMat);
                    sprite.scale.set(3.5, 3.5, 3.5);
                    sprite.position.set(0, 0, 0.98);
                    sprite.visible = false;
                    this.headMesh.add(sprite);

                    loadCircularAvatarTexture(this.photoURL, (tex) => {
                        if (!tex) return; // فشل التحميل (مثلاً بسبب حماية CORS) -> بيضل الراس الملون ظاهر
                        headMat.opacity = 0;
                        headMat.depthWrite = false;
                        eyeLeft.visible = false;
                        eyeRight.visible = false;
                        spriteMat.map = tex;
                        spriteMat.needsUpdate = true;
                        sprite.visible = true;
                        ring.visible = true;
                    });

                    this.avatarSprite = sprite;
                    this.avatarRing = ring;

                    // اسم الداعم واضح فوق صورته دايماً (مش كبير عالخريطة)
                    const nameSprite = createNameLabelSprite(this.name, this.palette.glow);
                    nameSprite.position.set(0, 2.9, 0.4);
                    this.headMesh.add(nameSprite);
                    this.nameSprite = nameSprite;
                }

                // درع حماية شفاف (يظهر فقط أثناء تفعيل الدرع من دعم كبير)
                const shieldGeo = new THREE.SphereGeometry(2.6, 20, 20);
                const shieldMat = new THREE.MeshBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.28, side: THREE.DoubleSide });
                this.shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
                this.shieldMesh.visible = false;
                this.headMesh.add(this.shieldMesh);

                if (this.isBoss) {
                    this.headMesh.scale.multiplyScalar(1.6);
                    const crownGeo = new THREE.ConeGeometry(0.5, 0.8, 6);
                    const crownMat = new THREE.MeshStandardMaterial({ color: 0xffcf40, metalness: 0.6, roughness: 0.2, emissive: 0xffcf40, emissiveIntensity: 0.3 });
                    const crown = new THREE.Mesh(crownGeo, crownMat);
                    crown.position.set(0, 1.6, 0.3);
                    this.headMesh.add(crown);
                }

                // Body Pattern Segments
                this.bodyGeo = new THREE.SphereGeometry(1.35, 14, 14);
                this.matPrimary = new THREE.MeshStandardMaterial({ color: this.palette.body1, roughness: 0.28, metalness: 0.25, emissive: new THREE.Color(this.palette.glow), emissiveIntensity: 0.18 });
                this.matSecondary = new THREE.MeshStandardMaterial({ color: this.palette.body2, roughness: 0.28, metalness: 0.25, emissive: new THREE.Color(this.palette.glow), emissiveIntensity: 0.1 });

                this.segmentMeshes = [];
                for (let i = 1; i < this.segments.length; i++) {
                    this.addSegmentMesh(i);
                }

                scene.add(this.group);
            }

            addSegmentMesh(index) {
                const mat = (index % 2 === 0) ? this.matPrimary : this.matSecondary;
                const mesh = new THREE.Mesh(this.bodyGeo, mat);
                mesh.castShadow = true;

                const boost = this.scaleBoost || 1;
                const scale = Math.max(0.62, 1 - (index / (this.segments.length * 2.4))) * boost;
                mesh.scale.set(scale, scale, scale);
                mesh.position.copy(this.segments[index]);

                this.group.add(mesh);
                this.segmentMeshes.push(mesh);
            }

            grow(amount = 2) {
                for (let i = 0; i < amount; i++) {
                    const lastPos = this.segments[this.segments.length - 1].clone();
                    this.segments.push(lastPos);
                    this.addSegmentMesh(this.segments.length - 1);
                }
                // كل ما تطول الحية بتعرّض شوي كمان (مش بس تطول وتضل رفيعة) — نمو أوضح وأبين للعين
                this.scaleBoost = Math.min(3.2, (this.scaleBoost || 1) + amount * 0.0035);
                const boost = this.scaleBoost || 1;
                for (let i = 0; i < this.segmentMeshes.length; i++) {
                    const idx = i + 1;
                    const scale = Math.max(0.62, 1 - (idx / (this.segments.length * 2.4))) * boost;
                    this.segmentMeshes[i].scale.set(scale, scale, scale);
                }
                this.updateAvatarVisualScale();
            }

            boostScale(extra) {
                this.scaleBoost = (this.scaleBoost || 1) + extra;
                const boost = this.scaleBoost;
                for (let i = 0; i < this.segmentMeshes.length; i++) {
                    const idx = i + 1;
                    const base = Math.max(0.62, 1 - (idx / (this.segments.length * 2.4)));
                    this.segmentMeshes[i].scale.set(base * boost, base * boost, base * boost);
                }
                this.updateAvatarVisualScale();
            }

            shrink(amount) {
                for (let i = 0; i < amount; i++) {
                    if (this.segments.length <= 3) break; // ما تصير أصغر من الحد الأدنى
                    this.segments.pop();
                    const mesh = this.segmentMeshes.pop();
                    if (mesh) this.group.remove(mesh);
                }
                const boost = this.scaleBoost || 1;
                for (let i = 0; i < this.segmentMeshes.length; i++) {
                    const idx = i + 1;
                    const scale = Math.max(0.62, 1 - (idx / (this.segments.length * 2.4))) * boost;
                    this.segmentMeshes[i].scale.set(scale, scale, scale);
                }
                this.updateAvatarVisualScale();
            }

            // صورة الداعم بتكبر تدريجياً كل ما تكبر حيته (عشان تضل بينة وما تختفي بقلب الجسم/الأرض)
            updateAvatarVisualScale() {
                if (!this.avatarSprite) return;
                const growthFactor = 1 + Math.min(2.2, (this.segments.length - this.initialLength) / 55);
                const s = this.baseAvatarScale * growthFactor;
                this.avatarSprite.scale.set(s, s, s);
                if (this.avatarRing) this.avatarRing.scale.setScalar(growthFactor);
                if (this.nameSprite) {
                    const ns = 1 + Math.min(1.4, (this.segments.length - this.initialLength) / 90);
                    this.nameSprite.scale.set(4.6 * ns, 1.15 * ns, 1);
                    this.nameSprite.position.y = 2.2 + (s * 0.42);
                }
                if (this.shieldMesh) {
                    this.shieldMesh.scale.setScalar(growthFactor * 1.05);
                }
            }

            updateAI(delta) {
                if (this.isDead) return;

                if (this.shieldTimer > 0) {
                    this.shieldTimer -= delta;
                    if (this.shieldMesh) {
                        this.shieldMesh.visible = true;
                        this.shieldMesh.material.opacity = 0.2 + Math.sin(Date.now() * 0.006) * 0.08;
                    }
                } else if (this.shieldMesh && this.shieldMesh.visible) {
                    this.shieldMesh.visible = false;
                }

                this.changeDirTimer -= delta;

                // 1. Square Boundary Wall Avoidance (earlier trigger = smoother, smarter turns)
                const margin = ARENA_SIZE - 16;
                if (Math.abs(this.headPos.x) > margin || Math.abs(this.headPos.z) > margin) {
                    this.targetAngle = Math.atan2(-this.headPos.z, -this.headPos.x);
                }
                // 2. Avoid OTHER Snakes (Only avoid external snakes, ignore self)
                else if (this.avoidOtherSnakes()) {
                    // Handled inside helper
                }
                // 3. Smart Fruit Search (+ predator hunting when much bigger than a nearby snake)
                else if (this.changeDirTimer <= 0 || !this.targetFruit || this.targetFruit.consumed) {
                    this.changeDirTimer = 1.8 + Math.random() * 2.2;

                    // سلوك افتراس ذكي: إذا الحية كبيرة كفاية وفي فريسة أصغر بوضوح وقريبة، تلاحقها أحياناً
                    let prey = null;
                    if (this.segments.length > 14 && Math.random() < 0.35) {
                        let minD = 38;
                        for (let other of snakes) {
                            if (other.id === this.id || other.isDead) continue;
                            if (other.segments.length * 1.5 < this.segments.length) {
                                const d = this.headPos.distanceTo(other.headPos);
                                if (d < minD) { minD = d; prey = other; }
                            }
                        }
                    }

                    if (prey) {
                        this.targetFruit = null;
                        const dx = prey.headPos.x - this.headPos.x;
                        const dz = prey.headPos.z - this.headPos.z;
                        this.targetAngle = Math.atan2(dz, dx);
                        this.changeDirTimer = 0.9; // تحديث أسرع أثناء المطاردة
                    } else {
                        let closest = null;
                        let minDist = 45;
                        for (let f of fruits) {
                            if (!f.consumed) {
                                let d = this.headPos.distanceTo(f.pos);
                                if (d < minDist) {
                                    minDist = d;
                                    closest = f;
                                }
                            }
                        }

                        if (closest) {
                            this.targetFruit = closest;
                            const dx = closest.pos.x - this.headPos.x;
                            const dz = closest.pos.z - this.headPos.z;
                            this.targetAngle = Math.atan2(dz, dx);
                        } else {
                            this.targetAngle += (Math.random() - 0.5) * 0.85;
                        }
                    }
                }

                // Interpolate Rotation
                let angleDiff = this.targetAngle - this.angle;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                this.angle += angleDiff * 0.05 * (simSpeed * 60 * delta);

                // Forward Movement
                const moveDist = this.speed * simSpeed * (delta * 60);
                this.headPos.x += Math.cos(this.angle) * moveDist;
                this.headPos.z += Math.sin(this.angle) * moveDist;
                this.segments[0].copy(this.headPos);

                // Segment Follow Chain
                for (let i = 1; i < this.segments.length; i++) {
                    const prev = this.segments[i - 1];
                    const curr = this.segments[i];
                    const dist = curr.distanceTo(prev);

                    if (dist > this.segmentSpacing) {
                        const dir = new THREE.Vector3().subVectors(prev, curr).normalize();
                        curr.copy(prev).sub(dir.multiplyScalar(this.segmentSpacing));
                    }
                }

                // Render Transforms
                this.headMesh.position.copy(this.headPos);
                this.headMesh.rotation.y = -this.angle + Math.PI / 2;

                // 🛠️ تثبيت ارتفاع الراس/صورة الداعم فوق سطح الأرض دايماً —
                // قبل هيك كانت الصورة تكبر بس مكانها ما كان يرتفع، فكانت تبين وكأنها غاطسة بقلب الأرض.
                let headLift = 1.7 * (this.headMesh.scale.x || 1);
                if (this.avatarSprite && this.avatarSprite.visible) {
                    headLift = Math.max(headLift, (this.avatarSprite.scale.y / 2) + 0.2);
                }
                this.headMesh.position.y = headLift;

                for (let i = 0; i < this.segmentMeshes.length; i++) {
                    const mesh = this.segmentMeshes[i];
                    mesh.position.copy(this.segments[i + 1]);
                    // نفس الشي لحلقات الجسم: كل ما كبرت الحلقة منرفعها شوي حتى تضل طافية عالعشب
                    const segScale = mesh.scale.y || 1;
                    mesh.position.y = (1.35 * segScale) * 0.78;
                }
            }

            avoidOtherSnakes() {
                // تفحّص أكثر من نقطة قدام الراس (قريبة/متوسطة/بعيدة) لتفادي أذكى وأهدى
                const lookDists = [4, 8, 13];
                let threatX = 0, threatZ = 0, threatFound = false;

                for (const dist of lookDists) {
                    const probe = this.headPos.clone().add(
                        new THREE.Vector3(Math.cos(this.angle), 0, Math.sin(this.angle)).multiplyScalar(dist)
                    );

                    // تفادي الحيايا التانية فقط (تجاهل جسمها هي بالكامل)
                    for (let other of snakes) {
                        if (other.id === this.id || other.isDead) continue;
                        for (let seg of other.segments) {
                            const d = probe.distanceTo(seg);
                            const safeDist = 4.4 + (dist * 0.15);
                            if (d < safeDist) {
                                threatX += (probe.x - seg.x); threatZ += (probe.z - seg.z);
                                threatFound = true;
                            }
                        }
                    }

                    // تفادي العوائق (أشجار/صخور) بالخريطة
                    for (let ob of obstacles) {
                        const dx = probe.x - ob.x, dz = probe.z - ob.z;
                        const d = Math.hypot(dx, dz);
                        if (d < ob.radius + 2.4) {
                            threatX += dx; threatZ += dz;
                            threatFound = true;
                        }
                    }
                }

                if (threatFound) {
                    // بدل الانعطاف الثابت 90 درجة، منوجه بعيد عن اتجاه التهديد فعلياً (تفادي أذكى)
                    let avoidAngle = Math.atan2(threatZ, threatX);
                    if (Math.hypot(threatX, threatZ) < 0.001) avoidAngle = this.angle + Math.PI * 0.5;
                    this.targetAngle = avoidAngle;
                    this.changeDirTimer = 0.5;
                    return true;
                }
                return false;
            }

            destroy() {
                this.isDead = true;
                scene.remove(this.group);

                // 💥 انفجار حماسي عند الموت (صوت + جسيمات + موجة صدمية)
                createDeathParticles(this.headPos, this.palette.glow, true);
                sfxExplosion();

                // Scatter Fruits upon death
                for (let i = 0; i < this.segments.length; i += 3) {
                    spawnFruit(this.segments[i].x, this.segments[i].z);
                }
            }
        }

        function createDeathParticles(pos, colorHex, big = false) {
            const pCount = big ? 60 : 30;
            const pGeo = new THREE.SphereGeometry(big ? 0.4 : 0.3, 8, 8);
            const mainColor = new THREE.Color(colorHex);
            const pMatMain = new THREE.MeshBasicMaterial({ color: mainColor });
            const pMatBright = new THREE.MeshBasicMaterial({ color: 0xfff4c2 });

            for (let i = 0; i < pCount; i++) {
                const p = new THREE.Mesh(pGeo, i % 4 === 0 ? pMatBright : pMatMain);
                p.position.copy(pos);
                scene.add(p);

                const speed = big ? (1.1 + Math.random() * 1.4) : (0.8);
                particles.push({
                    mesh: p,
                    vel: new THREE.Vector3(
                        (Math.random() - 0.5) * speed,
                        Math.random() * speed + 0.25,
                        (Math.random() - 0.5) * speed
                    ),
                    life: 1.0
                });
            }

            // موجة صدمية دائرية متوسّعة (إحساس انفجار حقيقي)
            if (big) {
                const ringGeo = new THREE.RingGeometry(0.3, 0.6, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: mainColor, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.copy(pos);
                ring.rotation.x = -Math.PI / 2;
                scene.add(ring);
                shockwaves.push({ mesh: ring, life: 1.0 });
            }
        }

        let shockwaves = [];

        function updateParticles(delta) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= delta * 1.5;
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                } else {
                    p.mesh.position.addScaledVector(p.vel, delta * 30);
                    p.mesh.scale.setScalar(p.life);
                }
            }

            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const s = shockwaves[i];
                s.life -= delta * 1.8;
                if (s.life <= 0) {
                    scene.remove(s.mesh);
                    shockwaves.splice(i, 1);
                } else {
                    const scale = 1 + (1 - s.life) * 14;
                    s.mesh.scale.set(scale, scale, scale);
                    s.mesh.material.opacity = s.life * 0.8;
                }
            }
        }

        /* =========================================================
           GIFT WEAPON EFFECTS — ليزر مثبت على الجسم / صور داعمين تدور
           بقلب الخريطة وتخبط الحيايا وتدمجها / وابل صواريخ للدعم الكبير
           ========================================================= */

        // ينقص نقاط من حية هدف (يحترم الدرع) — بيرجع true إذا فعلاً انخصم شي
        function damageSnake(target, amount, hitPos, attackerColor) {
            if (!target || target.isDead) return false;
            if (target.shieldTimer > 0) {
                // الدرع بيبعد الضربة بدون خسارة
                createHitSpark(hitPos || target.headPos, 0x60a5fa, true);
                return false;
            }
            createHitSpark(hitPos || target.headPos, attackerColor || 0xff4d4d, false);
            sfxHit();
            target.shrink(amount);
            if (target.segments.length <= 3) {
                triggerBannerEvent(`💢 ${target.name} تدمجت بالكامل!`);
                target.destroy();
                if (target === targetSnake) targetSnake = null;
            }
            return true;
        }

        // شرارة/ومضة صغيرة خفيفة عند كل ضربة (أخف من انفجار الموت)
        function createHitSpark(pos, colorHex, blocked) {
            const geo = new THREE.SphereGeometry(blocked ? 0.5 : 0.32, 8, 8);
            const mat = new THREE.MeshBasicMaterial({ color: colorHex });
            for (let i = 0; i < (blocked ? 6 : 8); i++) {
                const p = new THREE.Mesh(geo, mat);
                p.position.copy(pos);
                scene.add(p);
                particles.push({
                    mesh: p,
                    vel: new THREE.Vector3((Math.random() - 0.5) * 0.7, Math.random() * 0.5 + 0.1, (Math.random() - 0.5) * 0.7),
                    life: 0.6
                });
            }
        }

        // خط ليزر مؤقت بين نقطتين (يختفي بسرعة)
        function spawnBeamLine(from, to, colorHex) {
            const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
            const mat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.95, linewidth: 2 });
            const line = new THREE.Line(geo, mat);
            scene.add(line);
            effects.push({ type: 'beamFade', mesh: line, life: 0.22 });
        }

        // كرة/صورة داعم صغيرة تدور وتخبط الحيايا (تستخدم لصور الدعم الطايرة بقلب الخريطة)
        function makeOrbSprite(photoURL, glowColor, withBlades) {
            const group = new THREE.Group();
            const ringGeo = new THREE.RingGeometry(1.15, 1.4, 24);
            const ringMat = new THREE.MeshBasicMaterial({ color: glowColor, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            group.add(ring);

            const spriteMat = new THREE.SpriteMaterial({ color: 0xffffff });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(2.4, 2.4, 2.4);
            sprite.position.y = 0.4;
            group.add(sprite);

            loadCircularAvatarTexture(photoURL, (tex) => {
                if (tex) { spriteMat.map = tex; spriteMat.needsUpdate = true; }
                else { spriteMat.color = new THREE.Color(glowColor); }
            });

            if (withBlades) {
                const bladeMat = new THREE.MeshBasicMaterial({ color: glowColor });
                group.__blades = [];
                for (let i = 0; i < 9; i++) {
                    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.08, 0.12), bladeMat);
                    const ang = (i / 9) * Math.PI * 2;
                    blade.position.set(Math.cos(ang) * 2.1, 0.4, Math.sin(ang) * 2.1);
                    blade.rotation.y = ang;
                    group.add(blade);
                    group.__blades.push(blade);
                }
            }
            return group;
        }

        // 🔫 سلاح ليزر مثبت على الحية (مش نقطة عشوائية) — بيضرب أقرب الأعداء عن بعد بشكل دوري
        function spawnLaserWeapon(snake, duration, damagePerHit, tickRate, range) {
            if (!snake || snake.isDead) return;
            const gunGeo = new THREE.ConeGeometry(0.35, 1.4, 6);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, emissive: 0xf59e0b, emissiveIntensity: 0.7, metalness: 0.6, roughness: 0.2 });
            const gun = new THREE.Mesh(gunGeo, gunMat);
            gun.rotation.x = Math.PI / 2;
            gun.position.set(0, 1.4, -0.6);
            snake.headMesh.add(gun);
            triggerBannerEvent(`⚔️ ${snake.name} تسلّح بمدفع ليزر لمدة ${Math.round(duration)} ثانية!`);
            effects.push({ type: 'laser', owner: snake, gunMesh: gun, life: duration, tick: 0, damagePerHit, tickRate, range });
        }

        // 🖼️ صور داعمين تطلع وتمشي/تدور بقلب الخريطة وتخبط الحيايا (بدون ما تضرب صاحبها)
        function spawnOrbiters(snake, count, duration, damagePerHit, withBlades) {
            if (!snake || snake.isDead) return;
            for (let i = 0; i < count; i++) {
                const mesh = makeOrbSprite(snake.photoURL, snake.palette.glow, withBlades);
                mesh.position.copy(snake.headPos);
                mesh.position.y = 1.6;
                scene.add(mesh);
                effects.push({
                    type: 'orbiter', owner: snake, mesh,
                    life: duration, tick: 0, damagePerHit,
                    angle: Math.random() * Math.PI * 2,
                    radius: 10 + Math.random() * 16,
                    angularSpeed: 0.6 + Math.random() * 0.5,
                    center: snake.headPos.clone(),
                    withBlades
                });
            }
        }

        // 🚀 صاروخ واحد يطير من الحية، يوقف بالجو شوي، وبيرجع يخبط حية عشوائية
        function launchSingleRocket(snake, damagePerHit) {
            if (!snake || snake.isDead) return;
            const geo = new THREE.ConeGeometry(0.45, 2.0, 8);
            const mat = new THREE.MeshStandardMaterial({ color: 0xfde68a, emissive: 0xf59e0b, emissiveIntensity: 0.9, metalness: 0.4, roughness: 0.3 });
            const rocket = new THREE.Mesh(geo, mat);
            rocket.position.copy(snake.headPos);
            rocket.position.y = 1.2;
            scene.add(rocket);
            sfxRocket();
            const others = snakes.filter(s => !s.isDead && s.id !== snake.id);
            const target = others.length ? others[Math.floor(Math.random() * others.length)] : null;
            effects.push({
                type: 'rocket', owner: snake, mesh: rocket, life: 3.2, phase: 'up',
                startPos: snake.headPos.clone(), target, damagePerHit
            });
        }

        function spawnRocketVolley(snake, count, spacingSec, damagePerHit) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => launchSingleRocket(snake, damagePerHit), i * spacingSec * 1000);
            }
        }

        function updateEffects(delta) {
            for (let i = effects.length - 1; i >= 0; i--) {
                const e = effects[i];
                e.life -= delta;

                if (e.type === 'beamFade') {
                    if (e.life <= 0) { scene.remove(e.mesh); effects.splice(i, 1); }
                    else e.mesh.material.opacity = Math.max(0, e.life / 0.22);
                    continue;
                }

                if (e.life <= 0 || !e.owner || e.owner.isDead) {
                    if (e.type === 'laser' && e.gunMesh && e.owner) e.owner.headMesh.remove(e.gunMesh);
                    if (e.mesh) scene.remove(e.mesh);
                    effects.splice(i, 1);
                    continue;
                }

                if (e.type === 'laser') {
                    e.tick -= delta;
                    if (e.tick <= 0) {
                        e.tick = e.tickRate;
                        let closest = null, minD = e.range;
                        for (const s of snakes) {
                            if (s.isDead || s.id === e.owner.id) continue;
                            const d = e.owner.headPos.distanceTo(s.headPos);
                            if (d < minD) { minD = d; closest = s; }
                        }
                        if (closest) {
                            const from = e.owner.headPos.clone(); from.y += 1.4;
                            const to = closest.headPos.clone(); to.y += 1.0;
                            spawnBeamLine(from, to, 0xfacc15);
                            damageSnake(closest, e.damagePerHit, closest.headPos, 0xfacc15);
                        }
                    }
                } else if (e.type === 'orbiter') {
                    e.angle += e.angularSpeed * delta;
                    e.center.lerp(e.owner.headPos, 0.01);
                    e.mesh.position.x = e.center.x + Math.cos(e.angle) * e.radius;
                    e.mesh.position.z = e.center.z + Math.sin(e.angle) * e.radius;
                    e.mesh.position.y = 1.6 + Math.sin(Date.now() * 0.003 + e.angle) * 0.4;
                    e.mesh.rotation.y += delta * 2;
                    if (e.mesh.__blades) {
                        for (const b of e.mesh.__blades) b.rotation.y += delta * 3;
                    }
                    e.tick -= delta;
                    if (e.tick <= 0) {
                        e.tick = 0.4;
                        for (const s of snakes) {
                            if (s.isDead || s.id === e.owner.id) continue;
                            if (e.mesh.position.distanceTo(s.headPos) < 2.6) {
                                damageSnake(s, e.damagePerHit, s.headPos, e.owner.palette.glow ? new THREE.Color(e.owner.palette.glow).getHex() : 0xff4d4d);
                                break;
                            }
                            for (const seg of s.segments) {
                                if (e.mesh.position.distanceTo(seg) < 2.2) {
                                    damageSnake(s, e.damagePerHit, seg, 0xff4d4d);
                                    break;
                                }
                            }
                        }
                    }
                } else if (e.type === 'rocket') {
                    if (e.phase === 'up') {
                        e.mesh.position.y += delta * 14;
                        e.mesh.rotation.x = Math.PI;
                        if (e.mesh.position.y > 22) e.phase = 'down';
                    } else {
                        if (e.target && !e.target.isDead) {
                            const dir = e.target.headPos.clone().sub(e.mesh.position);
                            const dist = dir.length();
                            dir.normalize();
                            e.mesh.position.addScaledVector(dir, delta * 32);
                            e.mesh.lookAt(e.target.headPos);
                            if (dist < 2.5) {
                                createDeathParticles(e.mesh.position, 0xf59e0b, true);
                                sfxExplosion();
                                damageSnake(e.target, e.damagePerHit, e.mesh.position, 0xf59e0b);
                                if (e.owner && !e.owner.isDead) e.owner.grow(Math.round(e.damagePerHit * 0.3));
                                scene.remove(e.mesh);
                                effects.splice(i, 1);
                                continue;
                            }
                        } else {
                            e.mesh.position.y -= delta * 10;
                            if (e.mesh.position.y <= 0.5) {
                                scene.remove(e.mesh);
                                effects.splice(i, 1);
                                continue;
                            }
                        }
                    }
                }
            }
        }

        // الحية الأكبر بتقدر تفترس نص جسم الأصغر منها بس (مش تقتلها كلها) - لازم تكون أكبر فعلاً لتقدر تاكل
        function handleHalfEat(big, small, hitIndex) {
            const eaten = Math.max(1, Math.ceil(small.segments.length / 2));
            createDeathParticles(small.segments[hitIndex] || small.headPos, small.palette.glow);
            sfxBite();
            small.shrink(eaten);
            big.grow(Math.max(1, Math.floor(eaten * 0.7)));
            if (big.ownerId) recordScore(big.ownerId, big.name, big.photoURL, big.segments.length);

            if (small.segments.length <= 3) {
                triggerBannerEvent(`🍽️ ${big.name} افترست ${small.name} بالكامل!`);
                small.destroy();
                if (small === targetSnake) targetSnake = null;
            } else {
                triggerBannerEvent(`🍽️ ${big.name} أكلت نص جسم ${small.name}!`);
                small.invulnerableTimer = 0.6; // حماية قصيرة حتى ما تنقتل مرتين بنفس اللحظة
            }
        }

        function spawnSnake(options = {}) {
            const palette = options.palette || SNAKE_PALETTES[snakes.length % SNAKE_PALETTES.length];
            const name = options.name || `${palette.name} #${snakeIdCounter++}`;
            const snake = new Snake(snakeIdCounter++, name, palette, options);
            snakes.push(snake);
            if (!options.silent) triggerBannerEvent(`🐍 ظهرت حية جديدة: ${name}`);
            return snake;
        }

        /* =========================================================
           TIKTOK SUPPORT HANDLING — قيمة الهدية بتحدد كيف تكبر/تتكاثر حية الداعم
           ========================================================= */
        function handleSupport(uniqueId, nickname, avatarUrl, value) {
            let snake = supporterSnakes[uniqueId];
            if (!snake || snake.isDead) {
                const palette = SNAKE_PALETTES[Object.keys(supporterSnakes).length % SNAKE_PALETTES.length];
                snake = spawnSnake({ ownerId: uniqueId, photoURL: avatarUrl, name: nickname || "داعم", palette, silent: true });
                supporterSnakes[uniqueId] = snake;
                supporterSoldiers[uniqueId] = supporterSoldiers[uniqueId] || [];
                triggerBannerEvent(`✨ ${nickname || "داعم جديد"} انضم للخريطة!`);
            }

            snake.supportValue += value;

            if (value >= 500) {
                // دعم أسطوري: تكبير هائل + موكب كبير من صور الداعم بأطواق دوارة + وابل صواريخ
                snake.isBoss = true;
                snake.grow(5000);
                snake.boostScale(1.5);
                snake.shieldTimer = Math.max(snake.shieldTimer, 90);
                spawnOrbiters(snake, 20, 40, 25, true);
                spawnRocketVolley(snake, 5, 3, 300);
                spawnSoldiers(uniqueId, nickname, avatarUrl, 20, snake.palette);
                triggerBannerEvent(`🌟👑 ${nickname || "داعم"} أسطورة الجولة! دعم ضخم جداً!`);
            } else if (value >= 150) {
                // بوس كبير: درع دقيقتين + مدفع ليزر مستمر + وابل 20 صاروخ + جنود يتكاثروا
                snake.isBoss = true;
                snake.grow(1000);
                snake.boostScale(1.1);
                snake.shieldTimer = Math.max(snake.shieldTimer, 120);
                spawnLaserWeapon(snake, 120, 1, 0.3, 30);
                spawnRocketVolley(snake, 20, 4, 150);
                spawnSoldiers(uniqueId, nickname, avatarUrl, 20, snake.palette);
                triggerBannerEvent(`👑🛡️ ${nickname || "داعم"} صار قائد مدرّع بدرع وسلاح لمدة دقيقتين!`);
            } else if (value >= 100) {
                // دعم كبير جداً: صاروخ يطير ويرجع يخبط عدو + موكب صور مرافقة
                snake.grow(1000);
                snake.boostScale(0.6);
                launchSingleRocket(snake, 150);
                spawnOrbiters(snake, 10, 40, 5, true);
                spawnSoldiers(uniqueId, nickname, avatarUrl, 10, snake.palette);
                triggerBannerEvent(`🚀 ${nickname || "داعم"} أطلق صاروخ وكبّر حيته ألف نقطة!`);
            } else if (value >= 50) {
                // دعم كبير: تكبير + كرات دوارة بأطواق تخبط وتدمج الحيايا المحيطة
                snake.boostScale(0.5);
                snake.grow(100);
                spawnOrbiters(snake, 4, 30, 10, true);
                spawnSoldiers(uniqueId, nickname, avatarUrl, 5, snake.palette);
                triggerBannerEvent(`💎 ${nickname || "داعم"} كبّر حيته بشكل ضخم!`);
            } else if (value >= 30) {
                // دعم متوسط-كبير: مدفع ليزر + 4 صور دوارة بشفرات
                snake.boostScale(0.25);
                snake.grow(100);
                spawnLaserWeapon(snake, 10, 1, 0.35, 26);
                spawnOrbiters(snake, 4, 30, 5, true);
            } else if (value >= 20) {
                // دعم متوسط: مدفع ليزر + صورتين دوارتين
                snake.grow(100);
                spawnLaserWeapon(snake, 10, 1, 0.4, 24);
                spawnOrbiters(snake, 2, 20, 5, false);
            } else if (value >= 10) {
                // دعم صغير-متوسط: مدفع ليزر عن بعد لمدة 10 ثواني + جنود صغار
                snake.grow(100);
                spawnLaserWeapon(snake, 10, 1, 0.4, 22);
                spawnSoldiers(uniqueId, nickname, avatarUrl, 5, snake.palette);
            } else {
                // هدية صغيرة أو لايكات (متل الوردة) -> كل وحدة = عشر نقاط تكبير
                snake.grow(Math.max(1, Math.round(value)) * 10);
            }

            // كل شي بيدعمه الشخص بيكبر جنوده الموجودين معه شوي كمان
            const soldiers = supporterSoldiers[uniqueId] || [];
            for (const s of soldiers) { if (!s.isDead) s.grow(1); }

            recordScore(uniqueId, snake.name, snake.photoURL, snake.segments.length);
        }

        function spawnSoldiers(uniqueId, nickname, avatarUrl, count, palette) {
            supporterSoldiers[uniqueId] = supporterSoldiers[uniqueId] || [];
            for (let i = 0; i < count; i++) {
                const soldier = spawnSnake({
                    ownerId: uniqueId, photoURL: avatarUrl, isSoldier: true,
                    name: `${nickname || "داعم"} 🐣`, palette, silent: true
                });
                supporterSoldiers[uniqueId].push(soldier);
            }
        }

        function initSnakes() {
            // إذا اتصلنا فعلياً بالتيك توك اللايف، ما منحط حيايا عشوائية —
            // الخريطة بتصير فقط لحيايا الداعمين/المكبسين الحقيقيين.
            if (liveModeActive) return;
            for (let i = 0; i < INITIAL_SNAKE_COUNT; i++) {
                spawnSnake();
            }
        }

        /* =========================================================
           MANUAL CAMERA CONTROL — سحب الماوس = دوران، عجلة الماوس = زوم،
           WASD = تحريك نقطة التركيز (فوق أي وضعية تتبع تلقائي شغالة)
           ========================================================= */
        let manualYaw = 0;
        let manualPitch = 0;
        let manualZoomOffset = 0;
        let manualPan = new THREE.Vector3(0, 0, 0);
        const keysPressed = {};

        function setupManualCameraControls() {
            let isDragging = false;
            let lastX = 0, lastY = 0;
            let dragDistance = 0;

            window.addEventListener('mousedown', (e) => {
                if (e.target.closest('.glass-panel')) return;
                isDragging = true;
                dragDistance = 0;
                lastX = e.clientX; lastY = e.clientY;
            });
            window.addEventListener('mouseup', () => { isDragging = false; });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - lastX, dy = e.clientY - lastY;
                lastX = e.clientX; lastY = e.clientY;
                dragDistance += Math.abs(dx) + Math.abs(dy);
                manualYaw -= dx * 0.006;
                manualPitch = THREE.MathUtils.clamp(manualPitch - dy * 0.004, -0.45, 0.85);
            });
            window.__wasDragged = () => dragDistance > 6;

            window.addEventListener('wheel', (e) => {
                if (e.target.closest('.glass-panel')) return;
                manualZoomOffset = THREE.MathUtils.clamp(manualZoomOffset + e.deltaY * 0.045, -18, 90);
            }, { passive: true });

            window.addEventListener('keydown', (e) => {
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                keysPressed[e.key.toLowerCase()] = true;
            });
            window.addEventListener('keyup', (e) => {
                keysPressed[e.key.toLowerCase()] = false;
            });
        }

        function updateManualPan(delta) {
            const forward = new THREE.Vector3(-Math.sin(manualYaw), 0, -Math.cos(manualYaw));
            const right = new THREE.Vector3(forward.z, 0, -forward.x);
            const panSpeed = 26 * delta;

            const anyPanKey = keysPressed['w'] || keysPressed['s'] || keysPressed['d'] || keysPressed['a'];

            if (keysPressed['w']) manualPan.addScaledVector(forward, panSpeed);
            if (keysPressed['s']) manualPan.addScaledVector(forward, -panSpeed);
            if (keysPressed['d']) manualPan.addScaledVector(right, panSpeed);
            if (keysPressed['a']) manualPan.addScaledVector(right, -panSpeed);

            const maxPan = ARENA_SIZE * 0.9;
            manualPan.x = THREE.MathUtils.clamp(manualPan.x, -maxPan, maxPan);
            manualPan.z = THREE.MathUtils.clamp(manualPan.z, -maxPan, maxPan);

            // لما نكون عم نتبع حية (LEADER/MANUAL) وما في ضغط WASD حالياً، منرجع الإزاحة تدريجياً للصفر
            // حتى تتبع الكاميرا يضل ثابت وسليم بعد ما المستخدم يبطل يحرّك يدوياً (كان عم يبين "مكسور")
            if (!anyPanKey && cameraMode !== 'OVERVIEW') {
                manualPan.lerp(new THREE.Vector3(0, 0, 0), Math.min(1, delta * 1.2));
            }
        }

        function updateCameraAndFocus(delta) {
            if (snakes.length === 0) return;

            updateManualPan(delta);

            const sortedSnakes = [...snakes].filter(s => !s.isDead).sort((a, b) => b.segments.length - a.segments.length);
            if (sortedSnakes.length === 0) return;

            if (cameraMode === 'LEADER') {
                targetSnake = sortedSnakes[0];
            } else if (cameraMode === 'MANUAL' && (!targetSnake || targetSnake.isDead)) {
                targetSnake = sortedSnakes[0];
            }

            let desiredLookAt;
            if (cameraMode === 'OVERVIEW') {
                desiredLookAt = new THREE.Vector3(0, 0, 0).add(manualPan);
                targetCamDistance = 150;
            } else if (targetSnake && !targetSnake.isDead) {
                desiredLookAt = targetSnake.headPos.clone().add(manualPan);

                // DYNAMIC ZOOM حسب طول الحية — بس قريب افتراضياً حتى نشوف التفاصيل والصورة
                const snakeLength = targetSnake.segments.length;
                const baseDist = 13;
                targetCamDistance = baseDist + (snakeLength * 0.5);
                targetCamDistance = THREE.MathUtils.clamp(targetCamDistance, 11, 95);
            } else {
                desiredLookAt = currentCamLookAt.clone();
            }

            currentCamLookAt.lerp(desiredLookAt, 0.08);
            currentCamDistance = THREE.MathUtils.lerp(currentCamDistance, targetCamDistance, 0.06);

            // إحداثيات كروية حول نقطة التركيز — يدوران (drag) بيغيّر الزاوية، والعجلة بتغيّر البعد
            const effectiveDistance = Math.max(6, currentCamDistance + manualZoomOffset);
            const pitch = 0.75 + manualPitch; // ميل الكاميرا الأساسي + تعديل المستخدم
            const horizontal = effectiveDistance * Math.cos(pitch);
            const vertical = effectiveDistance * Math.sin(pitch);

            camTargetPos.x = currentCamLookAt.x + Math.sin(manualYaw) * horizontal;
            camTargetPos.z = currentCamLookAt.z + Math.cos(manualYaw) * horizontal;
            camTargetPos.y = currentCamLookAt.y + vertical;

            camera.position.lerp(camTargetPos, 0.09);
            camera.lookAt(currentCamLookAt);

            updateUI(sortedSnakes);
        }

        function updateUI(sortedSnakes) {
            const lbContainer = document.getElementById('leaderboard-list');
            lbContainer.innerHTML = '';

            sortedSnakes.slice(0, 6).forEach((s, rank) => {
                const item = document.createElement('div');
                item.className = `flex justify-between items-center p-1.5 rounded-xl ${s === targetSnake ? 'bg-emerald-900/50 border border-emerald-500/50' : 'bg-slate-900/50'}`;
                const avatarHTML = s.photoURL
                    ? `<span class="w-6 h-6 rounded-full border border-white/25 flex-shrink-0 bg-cover bg-center" style="background-image:url(${s.photoURL})"></span>`
                    : `<span class="w-3 h-3 rounded-full border border-white/20 flex-shrink-0" style="background-color: ${s.palette.glow}"></span>`;
                item.innerHTML = `
                    <div class="flex items-center space-x-2 space-x-reverse overflow-hidden">
                        <span class="font-bold text-gray-400 w-4">${rank + 1}.</span>
                        ${avatarHTML}
                        <span class="font-bold truncate text-white">${s.name}</span>
                    </div>
                    <div class="font-extrabold text-amber-300">
                        ${s.segments.length} <span class="text-[10px] text-gray-400 font-normal">نقطة</span>
                    </div>
                `;
                lbContainer.appendChild(item);
            });

        }

        function formatTime(totalSeconds) {
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function tickGameTimer() {
            if (gameTimeUp) return;
            timeRemainingSec -= 1;
            if (timeRemainingSec <= 0) {
                timeRemainingSec = 0;
                gameTimeUp = true;
                triggerBannerEvent("⏱️ انتهى وقت الجولة! ملوك الأرض بيضلوا محفوظين فوق 👑");
                showEndScreen();
            }
            const timerEl = document.getElementById('timer-text');
            if (timerEl) timerEl.innerText = formatTime(timeRemainingSec);
        }

        // شاشة نهاية الجولة: أقوى 3 ملوك بشكل بوديوم (منصة تتويج) فخم
        // المركز 1 ذهبي، المركز 2 أحمر، المركز 3 أزرق — حسب الطلب

                { h: 'h-56', medal: '🥇', ring: 'border-yellow-300', glow: 'shadow-[0_0_45px_rgba(250,204,21,0.7)]', bar: 'from-yellow-500/70 to-yellow-900/70 border-yellow-300/70', text: 'text-yellow-300', size: 'w-32 h-32', img: 'w-32 h-32' },
                { h: 'h-32', medal: '🥉', ring: 'border-blue-400', glow: 'shadow-[0_0_30px_rgba(96,165,250,0.55)]', bar: 'from-blue-600/60 to-blue-950/70 border-blue-400/60', text: 'text-blue-300', size: 'w-24 h-24', img: 'w-24 h-24' }
