  const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
  const audioCtx = AudioCtxClass ? new AudioCtxClass() : null;

  function b64ToArrayBuffer(b64){
    const binary = atob(b64);
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for(let i=0;i<len;i++){ bytes[i] = binary.charCodeAt(i); }
    return bytes.buffer;
  }

  let whooshBuffer = null;
  let boomBuffer = null;

  function decodeSound(b64, onDone){
    if(!audioCtx) return;
    try{
      audioCtx.decodeAudioData(b64ToArrayBuffer(b64), onDone, ()=>{});
    } catch(e){ /* تجاهل */ }
  }
  decodeSound(WHOOSH_B64, (buf)=> { whooshBuffer = buf; });
  decodeSound(BOOM_B64,   (buf)=> { boomBuffer   = buf; });

  function playBuffer(buffer, volume){
    if(!audioCtx || !buffer) return;
    try{
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      const gain = audioCtx.createGain();
      gain.gain.value = (typeof volume === "number") ? volume : 1;
      src.connect(gain).connect(audioCtx.destination);
      src.start(0);
    } catch(e){ /* تجاهل */ }
  }
  function playWhoosh(volume){ playBuffer(whooshBuffer, volume); }
  function playBoom(volume){ playBuffer(boomBuffer, volume); }

  // كل المتصفحات (خصوصًا كروم) بتمنع تشغيل أي صوت قبل أول تفاعل حقيقي من
  // المستخدم بالصفحة. لهيك بنحاول نفعّل الصوت فورًا مع أول ضغطة/لمسة/نقرة
  // بأي مكان بالصفحة، ومنعرض كمان زر صغير تحت بيختفي أوتوماتيكيًا بعد أول
  // تفعيل. إذا حطيت الصفحة بـ OBS / TikTok Studio، اضغط مرة وحدة جوّا
  // المعاينة (Interact) حتى يتفعّل الصوت لبقية الجلسة.
  const unlockBtn = document.getElementById("unlock-audio");
  let audioUnlocked = false;
  function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    if(audioCtx && audioCtx.state === "suspended"){ audioCtx.resume(); }
    if(unlockBtn){ unlockBtn.classList.add("hidden"); }
  }
  ["pointerdown","keydown","touchstart"].forEach(function(evt){
    document.addEventListener(evt, unlockAudio, {once:true});
  });
  if(unlockBtn){ unlockBtn.addEventListener("click", unlockAudio); }

  /* =====================================================================
     زر نسخ رابط الصفحة: بتضغط عليه وبينسخ رابط هاي الصفحة نفسها عالحافظة،
     منشان تقدر تلصقه فورًا بخانة "Browser Source" بستوديو TikTok / OBS
     ===================================================================== */
  (function setupCopyLink(){
    const btn = document.getElementById("copy-link");
    const label = document.getElementById("copy-link-text");
    if(!btn || !label) return;
    const originalText = label.textContent;

    function showCopied(ok){
      label.textContent = ok ? "تم نسخ الرابط \u2713" : "تعذّر النسخ، انسخه يدويًا";
      btn.classList.toggle("copied", !!ok);
      clearTimeout(showCopied._t);
      showCopied._t = setTimeout(function(){
        label.textContent = originalText;
        btn.classList.remove("copied");
      }, 1800);
    }

    function fallbackCopy(text){
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try{ ok = document.execCommand("copy"); } catch(e){ ok = false; }
      document.body.removeChild(ta);
      return ok;
    }

    btn.addEventListener("click", function(){
      const url = location.href;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(
          function(){ showCopied(true); },
          function(){ showCopied(fallbackCopy(url)); }
        );
      } else {
        showCopied(fallbackCopy(url));
      }
    });
  })();

  /* =====================================================================
     الحالة (نقطة الاتصال أعلى يسار الشاشة)
     ===================================================================== */
  const stage = document.getElementById("stage");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("status-text");
  function setStatus(text, ok){
    statusText.textContent = text;
    statusEl.classList.toggle("ok", !!ok);
    statusEl.classList.add("show");
    clearTimeout(setStatus._t);
    if(ok){ setStatus._t = setTimeout(()=> statusEl.classList.remove("show"), 2200); }
  }

  /* =====================================================================
     بناء عنصر "قلب" يحمل صورة (يُستخدم للصاروخ نفسه ولقطع الانفجار)
     ===================================================================== */
  function makeHeartImg(src, cls){
    const img = document.createElement("img");
    img.className = cls || "heart-img";
    img.referrerPolicy = "no-referrer";
    img.src = src || FALLBACK_ICON;
    img.onerror = function(){
      this.onerror = null;
      this.src = FALLBACK_ICON;
    };
    return img;
  }

  /* =====================================================================
     الانفجار: نفس صورة الهدية بتتكرر وتتطاير بكل الاتجاهات + شرر + نص
     ===================================================================== */
  function explode(xPercent, opts){
    const isRoyal = !!opts.royal;
    const glow = opts.glow;
    const avatar = opts.avatar;

    // اهتزاز خفيف بكل المشهد لإحساس أقوى بالانفجار (يشتغل مع كل صاروخ)
    stage.classList.remove("shake");
    void stage.offsetWidth; // إعادة تشغيل الأنيميشن حتى لو انفجرت صواريخ متتالية بسرعة
    stage.classList.add("shake");

    // وميض سريع بكل الشاشة، فقط للهدايا يلي فيها نص/بانر (شكرًا / الملكي)
    if(opts.label){
      const screenFlash = document.createElement("div");
      screenFlash.className = "flash-screen";
      document.body.appendChild(screenFlash);
      setTimeout(()=> screenFlash.remove(), 400);
    }

    const boom = document.createElement("div");
    boom.className = "boom";
    boom.style.left = xPercent + "%";
    boom.style.top = "50%";
    boom.style.setProperty("--glow", glow);

    const wave = document.createElement("div");
    wave.className = "shockwave";
    wave.style.setProperty("--wave", (isRoyal ? 520 : 340) + "px");
    boom.appendChild(wave);

    if(isRoyal){
      const rays = document.createElement("div");
      rays.className = "rays";
      boom.appendChild(rays);
    }

    const flash = document.createElement("div");
    flash.className = "boom-flash";
    flash.style.setProperty("--flash", (isRoyal ? 420 : 260) + "px");
    boom.appendChild(flash);

    // نسخ من صورة الداعم نفسها تتطاير للخارج بشكل جميل (تسلسل/تكرار الصورة)
    const pieces = isRoyal ? 22 : 16;
    for(let i=0;i<pieces;i++){
      const wrap = document.createElement("div");
      wrap.className = "boom-piece";
      const size = (isRoyal ? 50 : 36) + Math.random()*(isRoyal?28:20);
      wrap.style.setProperty("--piece", size + "px");
      const angle = (Math.PI*2 * i / pieces) + (Math.random()*0.35 - 0.17);
      const dist = (isRoyal ? 180 : 120) + Math.random()*(isRoyal?130:80);
      wrap.style.setProperty("--tx", Math.cos(angle)*dist + "px");
      wrap.style.setProperty("--ty", Math.sin(angle)*dist + "px");
      wrap.style.setProperty("--rot", (Math.random()*300-150) + "deg");
      wrap.style.setProperty("--scl", (0.55 + Math.random()*0.55).toFixed(2));
      wrap.style.setProperty("--pdur", (800 + Math.random()*400) + "ms");
      wrap.style.backgroundImage = `url("${avatar}")`;
      boom.appendChild(wrap);
    }

    // شرر/بريق إضافي لإحساس أغنى بالانفجار
    const sparkCount = isRoyal ? 34 : 20;
    for(let i=0;i<sparkCount;i++){
      const sp = document.createElement("span");
      sp.className = "spark";
      const angle = Math.random()*Math.PI*2;
      const dist = (isRoyal?200:130) + Math.random()*(isRoyal?160:100);
      sp.style.setProperty("--tx", Math.cos(angle)*dist + "px");
      sp.style.setProperty("--ty", Math.sin(angle)*dist + "px");
      sp.style.setProperty("--rot", (Math.random()*300-150) + "deg");
      sp.style.setProperty("--s", (3 + Math.random()*4) + "px");
      sp.style.setProperty("--pdur", (600 + Math.random()*400) + "ms");
      sp.style.setProperty("--c", (isRoyal ? (Math.random()>.4?"#ffd166":"#fff6d8") : (Math.random()>.4?glow:"#fff")));
      boom.appendChild(sp);
    }

    if(opts.label){
      const label = document.createElement("div");
      label.className = "label" + (isRoyal ? " royal" : "");
      label.textContent = opts.label;
      boom.appendChild(label);
    }

    stage.appendChild(boom);
    setTimeout(()=> boom.remove(), isRoyal ? 2100 : 1750);

    playBoom(isRoyal ? 1 : 0.95);
  }

  /* =====================================================================
     صاروخ واحد: يطلع من الأسفل بصوت الانطلاق، وعند وصوله لمنتصف
     الشاشة (بعد 3 ثواني بالضبط) بينفجر بصوت الانفجار
     ===================================================================== */
  function launchRocket(opts){
    const isRoyal = !!opts.royal;
    const size = isRoyal ? (130 + Math.random()*20) : (64 + Math.random()*30);
    const xPercent = opts.x != null ? opts.x : (16 + Math.random()*68);
    const glow = opts.glow || glowFor(opts.seed);

    const rocket = document.createElement("div");
    rocket.className = "rocket" + (isRoyal ? " royal" : "");
    rocket.style.setProperty("--size", size + "px");
    rocket.style.setProperty("--x", xPercent + "%");
    rocket.style.setProperty("--glow", glow);
    rocket.style.setProperty("--dur", FLIGHT_DURATION_MS + "ms");

    const ring = document.createElement("div");
    ring.className = "heart-ring";
    const img = makeHeartImg(opts.avatar, "heart-img");
    const shine = document.createElement("div");
    shine.className = "heart-shine";

    rocket.appendChild(ring);
    rocket.appendChild(img);
    rocket.appendChild(shine);
    stage.appendChild(rocket);

    // عادم/دخان خفيف خلف الصاروخ أثناء صعوده
    const exhaustTimer = setInterval(()=>{
      const rect = rocket.getBoundingClientRect();
      const puff = document.createElement("span");
      puff.className = "exhaust";
      puff.style.left = (rect.left + rect.width/2) + "px";
      puff.style.top  = (rect.top  + rect.height*0.92) + "px";
      stage.appendChild(puff);
      setTimeout(()=> puff.remove(), 600);
    }, 70);

    requestAnimationFrame(()=>{
      rocket.classList.add("flying");
      playWhoosh(isRoyal ? 1 : 0.9);
    });

    setTimeout(()=>{
      clearInterval(exhaustTimer);
      rocket.remove();
      explode(xPercent, {
        royal: isRoyal,
        glow, avatar: opts.avatar,
        label: opts.label
      });
    }, FLIGHT_DURATION_MS);
  }

  /* =====================================================================
     استقبال هدية من البرنامج (dot py) وتحديد المستوى المناسب
     ===================================================================== */
  let rocketsInFlight = 0;

  function handleGift(data){
    // بنفضّل صورة الملف الشخصي تبع الداعم (avatar)، وإذا ما وصلت
    // منستخدم صورة الهدية (icon) كبديل، وإذا ما في هيك ولا هيك منستخدم
    // القلب الافتراضي.
    const avatar = data.avatar || data.icon || FALLBACK_ICON;
    const nickname = data.nickname || "viewer";
    const glow = glowFor(nickname);
    const repeat = Math.max(1, parseInt(data.repeat, 10) || 1);
    const diamonds = Math.max(0, parseInt(data.diamonds, 10) || 0);
    const total = data.total != null ? Number(data.total) : diamonds * repeat;

    if(total >= TIER3_MIN_VALUE){
      // المستوى الملكي: صاروخ واحد كبير وفخم + بانر "تسجيل دخول الملوك"
      launchRocket({
        avatar, glow, royal:true,
        seed: nickname,
        label: "\u{1F451} تسجيل دخول الملوك: @" + nickname
      });
      return;
    }

    if(total >= TIER2_MIN_VALUE){
      // صورة واحدة بس، بتنفجر وبيكتب "شكرا @الاسم"
      launchRocket({
        avatar, glow,
        seed: nickname,
        label: "شكرًا لك @" + nickname + " \u2764"
      });
      return;
    }

    // المستوى العادي: صاروخ لكل عدد من الهدية (وردة×7 = 7 صواريخ...)
    const count = Math.min(repeat, MAX_ROCKETS_PER_GIFT);
    for(let i=0;i<count;i++){
      setTimeout(()=>{
        launchRocket({ avatar, glow, seed: nickname + i, x: 12 + Math.random()*76 });
      }, i * LAUNCH_STAGGER_MS);
    }
  }

  /* =====================================================================
     الاتصال بالبرنامج (tiktok_gift_rocket.py) عبر WebSocket
     ===================================================================== */
  function connect(){
    let ws;
    try{
      ws = new WebSocket(`ws://localhost:${PORT}`);
    } catch(e){
      setStatus("تعذر إنشاء الاتصال، سيُعاد المحاولة...", false);
      setTimeout(connect, 2000);
      return;
    }
    ws.onopen  = () => {
      setStatus("متصل ببرنامج الربط \u2713", true);
      if(targetUsername){
        ws.send(JSON.stringify({ type: "set_username", username: targetUsername }));
      }
    };
    ws.onclose = () => { setStatus("انقطع الاتصال، جارٍ إعادة المحاولة...", false); setTimeout(connect, 2000); };
    ws.onerror = () => ws.close();
    ws.onmessage = (evt) => {
      let data;
      try{ data = JSON.parse(evt.data); } catch(e){ return; }

      if(data.type === "status"){
        if(data.state === "connected"){
          setStatus("متصل باللايف @" + (data.username || ""), true);
        } else if(data.state === "disconnected"){
          setStatus("انتهى البث المباشر أو انقطع الاتصال به", false);
        }
        return;
      }

      if(data.type === "gift"){
        handleGift(data);
      }
    };
  }
  connect();

  /* =====================================================================
     تجربة سريعة بدون بث حقيقي:
       اضغط 1  -> هدية عادية (وردة واحدة)
       اضغط 7  -> هدية عادية × 7 (7 صواريخ)
       اضغط 2  -> هدية بقيمة 100 (صورة واحدة + شكرًا)
       اضغط 3  -> هدية ملكية فوق 100 (تأثير اللولبة الفخم)
     ===================================================================== */
  const DEMO_NAMES = ["sara_23","mo.tiktok","layla.live","user_9981","fan_of_you"];
  function demoName(){ return DEMO_NAMES[Math.floor(Math.random()*DEMO_NAMES.length)]; }
  window.addEventListener("keydown", (e) => {
    if(e.key === "1"){
      handleGift({ nickname: demoName(), avatar: FALLBACK_ICON, diamonds: 1, repeat: 1 });
    } else if(e.key === "7"){
      handleGift({ nickname: demoName(), avatar: FALLBACK_ICON, diamonds: 1, repeat: 7 });
    } else if(e.key === "2"){
      handleGift({ nickname: demoName(), avatar: FALLBACK_ICON, diamonds: 100, repeat: 1 });
    } else if(e.key === "3"){
      handleGift({ nickname: demoName(), avatar: FALLBACK_ICON, diamonds: 200, repeat: 1 });
    }
  });
})();</script>
<script type="text/plain" id="src-supporters">(function(){
  "use strict";

  const params = new URLSearchParams(location.search);
  const panelCtrl = document.getElementById("controller-panel");
  const usernameInput = document.getElementById("username-input");
  const copyBtn = document.getElementById("copy-btn");
  const copyFeedback = document.getElementById("copy-feedback");
  const targetUsername = params.get("username");

  if (targetUsername) { panelCtrl.style.display = "none"; }

  const PORT = params.get("port") || 8765;
  const SIDE = (params.get("side") === "left") ? "left" : "right";
  const RANK_COUNT = 8; // ثابت: أفضل 8 داعمين

  copyBtn.addEventListener("click", () => {
    let val = usernameInput.value.trim().replace("@", "");
    if (!val) {
      copyFeedback.textContent = "الرجاء إدخال اسم المستخدم أولاً!";
      return;
    }
    let generatedUrl = window.location.href.split('?')[0] + "?view=supporters&port=" + PORT + "&username=" + encodeURIComponent(val);
    navigator.clipboard.writeText(generatedUrl).then(() => {
      copyFeedback.textContent = "تم نسخ الرابط بنجاح! ألصقه في Live Studio";
      setTimeout(() => { copyFeedback.textContent = ""; }, 4000);
    }).catch(() => {
      copyFeedback.textContent = "تعذر النسخ، انسخه يدوياً.";
    });
  });

  const RANK_COLORS = {
    1:"#ffd166", 2:"#ff4d4d", 3:"#3aa0ff", 4:"#b26bff",
    5:"#fff176", 6:"#b9793f", 7:"#2fd6c0", 8:"#c9ced6"
  };

  const FALLBACK_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'>
       <rect width='120' height='120' fill='#e8e8ee'/>
       <circle cx='60' cy='45' r='22' fill='#ffffff'/>
       <ellipse cx='60' cy='100' rx='38' ry='30' fill='#ffffff'/>
     </svg>`
  );
  const FALLBACK_GIFT_ICON = "data:image/svg+xml;utf8," + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'>
       <rect width='60' height='60' fill='#ff2d75'/>
       <text x='30' y='42' font-size='30' text-anchor='middle' fill='#fff'>&#10084;</text>
     </svg>`
  );

  const CROWN_SVG = `
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="gCrownS" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff6d8"/><stop offset="0.5" stop-color="#ffd166"/><stop offset="1" stop-color="#c98a1f"/>
      </linearGradient></defs>
      <path fill="url(#gCrownS)" stroke="#9c6a12" stroke-width="2"
        d="M10 78 L18 34 L34 54 L50 22 L66 54 L82 34 L90 78 Z"/>
      <rect x="8" y="78" width="84" height="10" rx="3" fill="url(#gCrownS)" stroke="#9c6a12" stroke-width="2"/>
      <circle cx="50" cy="20" r="6" fill="#fff6d8" stroke="#9c6a12" stroke-width="2"/>
      <circle cx="18" cy="32" r="4" fill="#fff6d8" stroke="#9c6a12" stroke-width="2"/>
      <circle cx="82" cy="32" r="4" fill="#fff6d8" stroke="#9c6a12" stroke-width="2"/>
    </svg>`;
  const CRYSTAL_SVG = `
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="gCrystalS" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#bfe6ff"/><stop offset="1" stop-color="#6fb8e6"/>
      </linearGradient></defs>
      <polygon fill="url(#gCrystalS)" stroke="#4a90b8" stroke-width="2" points="50,6 78,32 64,90 36,90 22,32"/>
      <polygon fill="#ffffff" opacity="0.55" points="50,6 62,32 38,32"/>
      <polygon fill="#ffffff" opacity="0.35" points="36,90 50,50 64,90"/>
    </svg>`;
  const BOLT_SVG = `
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs><linearGradient id="gBoltS" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fffdea"/><stop offset="0.5" stop-color="#ffe14d"/><stop offset="1" stop-color="#ffb300"/>
      </linearGradient></defs>
      <polygon fill="url(#gBoltS)" stroke="#c98600" stroke-width="2" points="58,4 20,56 44,56 34,96 82,40 56,40"/>
    </svg>`;

  const panel = document.getElementById("sup-panel");
  panel.classList.add("side-" + SIDE);

  const slots = [];
  for(let rank=1; rank<=RANK_COUNT; rank++){
    const slot = document.createElement("div");
    slot.className = "sup-slot empty side-" + SIDE;
    slot.dataset.rank = rank;
    slot.style.setProperty("--c", RANK_COLORS[rank]);

    const ring = document.createElement("div");
    ring.className = "sup-ring";
    slot.appendChild(ring);

    if(rank === 3){
      const ripple = document.createElement("div");
      ripple.className = "sup-ripple";
      ripple.innerHTML = "<span></span><span></span><span></span>";
      slot.appendChild(ripple);
    }
    if(rank === 5){
      const tw = document.createElement("div");
      tw.className = "sup-twinkles";
      tw.innerHTML = "<span></span><span></span><span></span><span></span>";
      slot.appendChild(tw);
    }

    const avatarWrap = document.createElement("div");
    avatarWrap.className = "sup-avatar-wrap";
    const img = document.createElement("img");
    img.className = "sup-avatar";
    img.referrerPolicy = "no-referrer";
    img.onerror = function(){ this.src = FALLBACK_AVATAR; };
    avatarWrap.appendChild(img);
    slot.appendChild(avatarWrap);

    if(rank === 1){
      const deco = document.createElement("div");
      deco.className = "sup-deco crown"; deco.innerHTML = CROWN_SVG; slot.appendChild(deco);
    } else if(rank === 2){
      const deco = document.createElement("div");
      deco.className = "sup-deco crystal"; deco.innerHTML = CRYSTAL_SVG; slot.appendChild(deco);
    } else if(rank === 3){
      const deco = document.createElement("div");
      deco.className = "sup-deco bolt"; deco.innerHTML = BOLT_SVG; slot.appendChild(deco);
    }

    panel.appendChild(slot);
    slots.push({ el: slot, img, id: null });
  }

  function swapAvatar(slotObj, person){
    const el = slotObj.el;
    const img = slotObj.img;
    if(!person){
      el.classList.add("empty");
      img.classList.remove("show");
      slotObj.id = null;
      return;
    }
    el.classList.remove("empty");
    if(slotObj.id === (person.id || person.avatar)){
      if(img.src !== person.avatar){ img.src = person.avatar || FALLBACK_AVATAR; }
      return;
    }
    img.classList.remove("show");
    setTimeout(()=>{
      img.src = person.avatar || FALLBACK_AVATAR;
      requestAnimationFrame(()=> img.classList.add("show"));
    }, 180);
    slotObj.id = person.id || person.avatar;
  }

  function updateLeaderboard(top){
    const list = (top || []).slice(0, RANK_COUNT);
    for(let i=0;i<RANK_COUNT;i++){ swapAvatar(slots[i], list[i] || null); }
  }

  function burstOnSlot(slotObj, giftIcon, color){
    const el = slotObj.el;
    const avatarWrap = el.querySelector(".sup-avatar-wrap");
    avatarWrap.classList.remove("pop");
    void avatarWrap.offsetWidth;
    avatarWrap.classList.add("pop");

    const wrap = document.createElement("div");
    wrap.className = "sup-mini-burst";
    const ringEl = document.createElement("div");
    ringEl.className = "sup-mini-ring";
    ringEl.style.setProperty("--c", color);
    wrap.appendChild(ringEl);

    // نشيل الخلفية البيضاء من صورة الهدية قبل ما نطيّرها كقطع صغيرة
    window.ttCleanIcon(giftIcon || FALLBACK_GIFT_ICON, function(cleanUrl){
      const pieces = 6;
      for(let i=0;i<pieces;i++){
        const p = document.createElement("div");
        p.className = "sup-mini-piece";
        const angle = (Math.PI*2*i/pieces) + (Math.random()*.3-.15);
        const dist = 34 + Math.random()*22;
        p.style.setProperty("--mx", Math.cos(angle)*dist + "px");
        p.style.setProperty("--my", Math.sin(angle)*dist + "px");
        p.style.setProperty("--mp", (14 + Math.random()*10) + "px");
        p.style.setProperty("--mdur", (550 + Math.random()*250) + "ms");
        p.style.backgroundImage = `url("${cleanUrl}")`;
        wrap.appendChild(p);
      }
    });

    el.appendChild(wrap);
    setTimeout(()=> wrap.remove(), 900);
  }

  function handleGiftPing(data){
    const targetId = data.id || data.avatar;
    for(let i=0;i<RANK_COUNT;i++){
      if(slots[i].id === targetId){
        burstOnSlot(slots[i], data.icon, RANK_COLORS[i+1]);
        break;
      }
    }
  }

  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("status-text");
  function setStatus(text, ok){
    statusText.textContent = text;
    statusEl.classList.toggle("ok", !!ok);
    statusEl.classList.add("show");
  }

  function connect(){
    let ws;
    try{ ws = new WebSocket(`ws://localhost:${PORT}`); }
    catch(e){ setTimeout(connect, 2000); return; }
    ws.onopen = () => {
      setStatus("متصل ببرنامج الربط \u2713", true);
      if(targetUsername){ ws.send(JSON.stringify({ type: "set_username", username: targetUsername })); }
    };
    ws.onclose = () => { setStatus("انقطع الاتصال، جارٍ إعادة المحاولة...", false); setTimeout(connect, 2000); };
    ws.onerror = () => ws.close();
    ws.onmessage = (evt) => {
      let data;
      try{ data = JSON.parse(evt.data); } catch(e){ return; }
      if(data.type === "status"){
        if(data.state === "connected"){ setStatus("متصل بلايف @" + (data.username||""), true); }
        else if(data.state === "disconnected"){ setStatus("انتهى البث المباشر أو انقطع الاتصال به", false); }
        return;
      }
      if(data.type === "supporters_leaderboard"){ updateLeaderboard(data.top); }
      else if(data.type === "supporters_gift"){ handleGiftPing(data); }
    };
  }

  if(targetUsername){ connect(); } else { panelCtrl.style.display = "block"; }

  // تجربة سريعة بدون بث حقيقي: اضغط T لإضافة دعم عشوائي لشخص عشوائي
  const DEMO_NAMES = ["sara_23","mo.tiktok","layla.live","user_9981","fan_of_you","noor.n","rami_x","dana.k","lina.m","omar_9"];
  function demoAvatar(seed){
    const hue = (seed.charCodeAt(0)*37) % 360;
    return "data:image/svg+xml;utf8," + encodeURIComponent(
      `<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'>
         <rect width='120' height='120' fill='hsl(${hue},70%,55%)'/>
         <circle cx='60' cy='45' r='22' fill='#fff'/>
         <ellipse cx='60' cy='100' rx='38' ry='30' fill='#fff'/>
       </svg>`
    );
  }
  const demoTotals = {};
  window.addEventListener("keydown", (e)=>{
    if(e.key.toLowerCase() !== "t") return;
    const name = DEMO_NAMES[Math.floor(Math.random()*DEMO_NAMES.length)];
    if(!demoTotals[name]) demoTotals[name] = 0;
    demoTotals[name] += 1 + Math.floor(Math.random()*15);
    const top = Object.keys(demoTotals)
      .map(n => ({ id:n, avatar:demoAvatar(n), total:demoTotals[n] }))
      .sort((a,b)=> b.total - a.total)
      .slice(0, RANK_COUNT);
    updateLeaderboard(top);
    handleGiftPing({ id:name, avatar:demoAvatar(name), icon: FALLBACK_GIFT_ICON });
  });
})();</script>

<script type="text/plain" id="src-snake-game">
        // --- CONSTANTS & ARENA CONFIGURATION ---
        const ARENA_SIZE = 130; // Half-width of the square grid (-130 to +130)
        const INITIAL_FOOD_COUNT = 160;
        const INITIAL_SNAKE_COUNT = 8;

        const SNAKE_TYPES = {
            COBRA: 'كوبرا ملكية',
            PYTHON: 'باثون الذهب الشاهق',
            DRAGON: 'تنين النيون الأسطوري',
            BEADED: 'أفعى الجواهر المرجانية'
        };

        const SNAKE_PALETTES = [
            { type: SNAKE_TYPES.COBRA, name: "كوبرا الزمرد الملكية", head: 0x059669, body1: 0x10b981, body2: 0xa7f3d0, glow: "#10b981" },

            { type: SNAKE_TYPES.BEADED, name: "أفعى المرجان الفاخرة", head: 0xe11d48, body1: 0xf43f5e, body2: 0xfecdd3, glow: "#f43f5e" },
            { type: SNAKE_TYPES.COBRA, name: "كوبرا البنفسج الساحرة", head: 0x7c3aed, body1: 0x8b5cf6, body2: 0xddd6fe, glow: "#8b5cf6" },
            { type: SNAKE_TYPES.PYTHON, name: "باثون الياقوت الأزرق", head: 0x1d4ed8, body1: 0x3b82f6, body2: 0xbfdbfe, glow: "#3b82f6" },
            { type: SNAKE_TYPES.DRAGON, name: "تنين الموز الذهبي", head: 0xca8a04, body1: 0xeab308, body2: 0xfef08a, glow: "#eab308" },
            { type: SNAKE_TYPES.COBRA, name: "كوبرا الفحم السوداء", head: 0x1e293b, body1: 0x334155, body2: 0x94a3b8, glow: "#64748b" },
            { type: SNAKE_TYPES.PYTHON, name: "باثون الفضة اللامعة", head: 0x64748b, body1: 0x94a3b8, body2: 0xe2e8f0, glow: "#cbd5e1" }
        ];

        // --- GLOBAL ENGINE VARIABLES ---
        let scene, camera, renderer;
        let snakes = [];
        let fruits = [];
        let particles = [];
        let grassMesh;
        let obstacles = []; // {x, z, radius} - أشجار وصخور بقلب الخريطة تتفاداها الحيايا
        const textureLoader = new THREE.TextureLoader();
        textureLoader.crossOrigin = "anonymous";

        // بيحمّل صورة الداعم ويقصّها دائرية (عشان تصير هي شكل راس الحية بالضبط)
        function loadCircularAvatarTexture(url, onReady) {
            if (!url) { onReady(null); return; }
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = () => {
                try {
                    const size = 160;
                    const canvas = document.createElement('canvas');
                    canvas.width = size; canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(size / 2, size / 2, size / 2 - 3, 0, Math.PI * 2);
                    ctx.closePath();
                    ctx.clip();
                    const scale = Math.max(size / img.width, size / img.height);
                    const w = img.width * scale, h = img.height * scale;
                    ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
                    ctx.restore();
                    ctx.beginPath();
                    ctx.arc(size / 2, size / 2, size / 2 - 3, 0, Math.PI * 2);
                    ctx.lineWidth = 6;
                    ctx.strokeStyle = '#ffffff';
                    ctx.stroke();
                    const tex = new THREE.CanvasTexture(canvas);
                    onReady(tex);
                } catch (e) {
                    // احتمال حماية CORS من سيرفر الصورة -> ما فينا نقصّها، نرجع فارغ (بيضل الراس الملون)
                    onReady(null);
                }
            };
            img.onerror = () => onReady(null);
            img.src = url;
        }
        let effects = []; // تأثيرات الهدايا النشطة: أسلحة ليزر / كرات مرافقة / صواريخ

        // نص فوق صورة الداعم (اسمه) — واضح بس مش كبير عالخريطة
        function createNameLabelSprite(text, glowColor) {
            const canvas = document.createElement('canvas');
            const W = 512, H = 128;
            canvas.width = W; canvas.height = H;
            const ctx = canvas.getContext('2d');
            ctx.font = '900 62px Cairo, Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const label = (text || 'داعم').slice(0, 16);
            // ظل خلفي غامق حتى يضل الاسم واضح فوق أي خلفية
            ctx.lineWidth = 12;
            ctx.strokeStyle = 'rgba(0,0,0,0.85)';
            ctx.strokeText(label, W / 2, H / 2);
            const grad = ctx.createLinearGradient(0, 0, W, 0);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(1, glowColor || '#fde68a');
            ctx.fillStyle = grad;
            ctx.fillText(label, W / 2, H / 2);
            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(4.6, 1.15, 1);
            sprite.renderOrder = 999;
            return sprite;
        }

        let supporterSnakes = {}; // uniqueId -> الحية الرئيسية تبعو
        let supporterSoldiers = {}; // uniqueId -> [حيايا الجنود الصغار]
        let hallOfFame = {}; // uniqueId -> {nickname, photo, bestScore} — ملوك الأرض (بيضل مسجل لحد ما نسكر)

        // 🔴 لايف حقيقي: لما تيك توك يتصل فعلياً منوقف إضافة الحيايا العشوائية
        // ونخلي الخريطة فقط لحيايا الداعمين/المكبسين الحقيقيين.
        let liveModeActive = false;

        // ⏱️ عداد الوقت (بالثواني) — منعدّله من شاشة الإعدادات (بالدقائق) قبل بدء الجولة
        let GAME_DURATION_SECONDS = 10 * 60; // قيمة افتراضية، بتتغير حسب اختيار المستخدم
        let timeRemainingSec = GAME_DURATION_SECONDS;
        let gameTimeUp = false;

        // إعدادات البث المباشر المختارة بشاشة تسجيل الدخول
        let TIKTOK_USERNAME = '';
        let LIKE_THRESHOLD = 10; // كم لايك = وحدة تكبير وحدة

        /* =========================================================
           SOUND — أكل هادئ وخفيف (مش مزعج) + عضة عند الافتراس
           ========================================================= */
        const sfxCtx = new (window.AudioContext || window.webkitAudioContext)();
        let lastEatSoundTime = 0;
        function sfxEat() {
            const now = performance.now();
            if (now - lastEatSoundTime < 90) return; // تحديد سرعة التشغيل حتى ما يصير إزعاج لما ياكلوا كثير مرة وحدة
            lastEatSoundTime = now;
            const t0 = sfxCtx.currentTime;

            // نغمة "عملة" صاعدة حلوة وحماسية (متل ألعاب الأركيد) بدل نغمة باهتة
            const baseFreq = 780 + Math.random() * 80;
            const notes = [baseFreq, baseFreq * 1.335, baseFreq * 1.68];
            notes.forEach((freq, i) => {
                const start = t0 + i * 0.052;
                const o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
                o.type = 'square';
                o.frequency.setValueAtTime(freq, start);
                g.gain.setValueAtTime(0.0001, start);
                g.gain.linearRampToValueAtTime(0.075, start + 0.008);
                g.gain.exponentialRampToValueAtTime(0.0001, start + 0.13);
                o.connect(g).connect(sfxCtx.destination);
                o.start(start); o.stop(start + 0.14);
            });
            // شرارة "شنك" معدنية خفيفة فوق النغمة تعطي إحساس جائزة حقيقية
            const sparkle = sfxCtx.createOscillator(), sparkleG = sfxCtx.createGain();
            sparkle.type = 'sine';
            sparkle.frequency.setValueAtTime(baseFreq * 2.5, t0 + 0.1);
            sparkleG.gain.setValueAtTime(0.0001, t0 + 0.1);
            sparkleG.gain.linearRampToValueAtTime(0.05, t0 + 0.11);
            sparkleG.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
            sparkle.connect(sparkleG).connect(sfxCtx.destination);
            sparkle.start(t0 + 0.1); sparkle.stop(t0 + 0.23);
        }

        // ⚡ صوت "خبطة" خفيفة لما سلاح/كرة داعم يضرب حية (نقص نقاط، مش موت كامل)
        let lastHitSoundTime = 0;
        function sfxHit() {
            const now = performance.now();
            if (now - lastHitSoundTime < 70) return;
            lastHitSoundTime = now;
            const t0 = sfxCtx.currentTime;
            const o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(340, t0);
            o.frequency.exponentialRampToValueAtTime(120, t0 + 0.1);
            g.gain.setValueAtTime(0.13, t0);
            g.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.11);
            o.connect(g).connect(sfxCtx.destination);
            o.start(t0); o.stop(t0 + 0.12);
        }

        // 🚀 صوت إطلاق صاروخ (وشوشة صاعدة + دفعة هواء)
        function sfxRocket() {
            const t0 = sfxCtx.currentTime;
            const len = Math.floor(sfxCtx.sampleRate * 0.3);
            const buf = sfxCtx.createBuffer(1, len, sfxCtx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) * 0.8;
            const src = sfxCtx.createBufferSource(); src.buffer = buf;
            const hp = sfxCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 400;
            const g = sfxCtx.createGain(); g.gain.setValueAtTime(0.16, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.32);
            src.connect(hp).connect(g).connect(sfxCtx.destination);
            src.start(t0); src.stop(t0 + 0.32);

            const o = sfxCtx.createOscillator(), og = sfxCtx.createGain();
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(180, t0);
            o.frequency.exponentialRampToValueAtTime(520, t0 + 0.28);
            og.gain.setValueAtTime(0.001, t0);
            og.gain.linearRampToValueAtTime(0.08, t0 + 0.05);
            og.gain.exponentialRampToValueAtTime(0.0005, t0 + 0.3);
            o.connect(og).connect(sfxCtx.destination);
            o.start(t0); o.stop(t0 + 0.3);
        }
        function sfxBite() {
            const t0 = sfxCtx.currentTime;
            const len = Math.floor(sfxCtx.sampleRate * 0.18);
            const buf = sfxCtx.createBuffer(1, len, sfxCtx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
            const src = sfxCtx.createBufferSource(); src.buffer = buf;
            const bp = sfxCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 1.1;
            const g = sfxCtx.createGain(); g.gain.setValueAtTime(0.22, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.18);
            src.connect(bp).connect(g).connect(sfxCtx.destination);
            src.start(t0); src.stop(t0 + 0.19);

            // ضربة "طقّة" منخفضة تعطي وزن أكبر للعضة
            const o = sfxCtx.createOscillator(), og = sfxCtx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(160, t0);
            o.frequency.exponentialRampToValueAtTime(60, t0 + 0.12);
            og.gain.setValueAtTime(0.25, t0);
            og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.14);
            o.connect(og).connect(sfxCtx.destination);
            o.start(t0); o.stop(t0 + 0.15);
        }

        // 💥 صوت "انفجار" حماسي لما تموت حية (مضاعف الطبقات: دوي منخفض + ضجيج بارد + طقطقة حادة)
        function sfxExplosion() {
            const t0 = sfxCtx.currentTime;

            // دوي منخفض (boom)
            const boom = sfxCtx.createOscillator(), boomG = sfxCtx.createGain();
            boom.type = 'sine';
            boom.frequency.setValueAtTime(120, t0);
            boom.frequency.exponentialRampToValueAtTime(28, t0 + 0.35);
            boomG.gain.setValueAtTime(0.4, t0);
            boomG.gain.exponentialRampToValueAtTime(0.001, t0 + 0.5);
            boom.connect(boomG).connect(sfxCtx.destination);
            boom.start(t0); boom.stop(t0 + 0.5);

            // ضجيج انفجاري (noise burst) بفلتر يفتح تدريجياً
            const len = Math.floor(sfxCtx.sampleRate * 0.45);
            const buf = sfxCtx.createBuffer(1, len, sfxCtx.sampleRate);
            const d = buf.getChannelData(0);
            for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.4);
            const src = sfxCtx.createBufferSource(); src.buffer = buf;
            const lp = sfxCtx.createBiquadFilter(); lp.type = 'lowpass';
            lp.frequency.setValueAtTime(2800, t0);
            lp.frequency.exponentialRampToValueAtTime(300, t0 + 0.4);
            const ng = sfxCtx.createGain(); ng.gain.setValueAtTime(0.35, t0); ng.gain.exponentialRampToValueAtTime(0.001, t0 + 0.45);
            src.connect(lp).connect(ng).connect(sfxCtx.destination);
            src.start(t0); src.stop(t0 + 0.45);

            // طقّة معدنية حادة تعطي إحساس "بووم" مثير باللحظة الأولى
            const crack = sfxCtx.createOscillator(), crackG = sfxCtx.createGain();
            crack.type = 'square';
            crack.frequency.setValueAtTime(500, t0);
            crack.frequency.exponentialRampToValueAtTime(90, t0 + 0.08);
            crackG.gain.setValueAtTime(0.15, t0);
            crackG.gain.exponentialRampToValueAtTime(0.001, t0 + 0.09);
            crack.connect(crackG).connect(sfxCtx.destination);
            crack.start(t0); crack.stop(t0 + 0.1);
        }

        /* =========================================================
           HALL OF FAME — ملوك الحلقة (أعلى سكور سجله كل داعم، بيضل ثابت)
           ========================================================= */
        const HOF_STORAGE_KEY = 'hoyat_hallOfFame_v1';
        function saveHallOfFame() {
            try { localStorage.setItem(HOF_STORAGE_KEY, JSON.stringify(hallOfFame)); } catch (e) {}
        }
        function loadHallOfFame() {
            try {
                const raw = localStorage.getItem(HOF_STORAGE_KEY);
                if (raw) hallOfFame = JSON.parse(raw) || {};
            } catch (e) {}
        }

        function recordScore(uniqueId, nickname, photo, score) {
            if (!uniqueId) return;
            const cur = hallOfFame[uniqueId];
            if (!cur || score > cur.bestScore) {
                const oldBest = cur ? cur.bestScore : 0;

                // شوف مين كان قدام هالشخص بالترتيب وهلق تخطاه (لإعلان "صار ملك الأرض")
                const rivals = Object.entries(hallOfFame)
                    .filter(([id]) => id !== uniqueId)
                    .sort((a, b) => a[1].bestScore - b[1].bestScore);
                const overtaken = rivals.find(([, r]) => oldBest < r.bestScore && score >= r.bestScore);

                hallOfFame[uniqueId] = {
                    nickname: nickname || (cur && cur.nickname) || 'داعم',
                    photo: photo || (cur && cur.photo) || null,
                    bestScore: score
                };
                updateHallOfFameUI();
                saveHallOfFame();

                if (overtaken) {
                    triggerBannerEvent(`👑 ${nickname || 'داعم'} تخطى ${overtaken[1].nickname} بترتيب ملوك الأرض!`);
                }
            }
        }

            const scoreColor = ['text-yellow-300', 'text-red-300', 'text-blue-300', 'text-slate-300'];

        let clock = new THREE.Clock();

        // GENERATE A NICE GRADIENT SKY (outside/around the map should look inviting)
        function createSkyTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 8; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 256);
            grad.addColorStop(0, '#0b1e3d');
            grad.addColorStop(0.35, '#123a63');
            grad.addColorStop(0.65, '#1c5f7a');
            grad.addColorStop(1, '#2f8f6b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 8, 256);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace || tex.colorSpace;

        }

        // PROCEDURAL ROCK (white / red / black variants for the map border)
        function createRock(scale = 1.0, colorHex = 0xffffff) {
            const geo = new THREE.IcosahedronGeometry(1 * scale, 0);
            // slightly deform vertices for an organic rock look
            const posAttr = geo.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                const jitter = 0.82 + Math.random() * 0.36;
                posAttr.setXYZ(i, posAttr.getX(i) * jitter, posAttr.getY(i) * jitter * 0.75, posAttr.getZ(i) * jitter);
            }
            geo.computeVertexNormals();
            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.95, metalness: 0.05, flatShading: true });
            const rock = new THREE.Mesh(geo, mat);
            rock.position.y = 0.45 * scale;
            rock.rotation.y = Math.random() * Math.PI * 2;
            rock.castShadow = true;
            rock.receiveShadow = true;
            return rock;
        }

        // SMALL FLOWER CLUSTER (stem + bloom) for ground decoration
        function createFlower(colorHex) {
            const group = new THREE.Group();
            const stemGeo = new THREE.CylinderGeometry(0.03, 0.04, 0.55, 5);
            const stemMat = new THREE.MeshStandardMaterial({ color: 0x2f6b2f, roughness: 0.8 });
            const stem = new THREE.Mesh(stemGeo, stemMat);
            stem.position.y = 0.27;

            const bloomMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.5, emissive: colorHex, emissiveIntensity: 0.12 });
            for (let p = 0; p < 5; p++) {
                const petal = new THREE.Mesh(bloomGeo, bloomMat);
                const ang = (p / 5) * Math.PI * 2;
                petal.position.set(Math.cos(ang) * 0.14, 0.56, Math.sin(ang) * 0.14);

            const centerMat = new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.4 });

            group.add(center);
            return group;
