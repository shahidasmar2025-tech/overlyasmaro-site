        // 🎉 مفرقعات/كونفيتي بسيطة فوق شاشة نهاية الجولة احتفالاً بالفايزين
        let confettiRAF = null;
        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const ctx = canvas.getContext('2d');
            const colors = ['#facc15', '#f87171', '#60a5fa', '#34d399', '#f472b6', '#ffffff'];
            const pieces = [];
            for (let i = 0; i < 160; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: -20 - Math.random() * canvas.height * 0.5,
                    size: 4 + Math.random() * 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedY: 2 + Math.random() * 3.5,
                    speedX: (Math.random() - 0.5) * 2,
                    rot: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.3
                });
            }
            let elapsed = 0;
            if (confettiRAF) cancelAnimationFrame(confettiRAF);
            function frame() {
                elapsed += 16;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (const p of pieces) {
                    p.y += p.speedY;
                    p.x += p.speedX;
                    p.rot += p.rotSpeed;
                    if (p.y > canvas.height + 20) p.y = -20;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.5);
                    ctx.restore();
                }
                if (elapsed < 6000 && !document.getElementById('end-screen').classList.contains('hidden')) {
                    confettiRAF = requestAnimationFrame(frame);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            frame();
        }

        // 🔄 جولة جديدة بدون إعادة تحميل الصفحة: بيصفّي الحيايا/الهدايا الحالية وبيرجع
        // الأرض فاضية من جديد، بس بيخلي ملوك الأرض محفوظين وبيخلي الاتصال بالبث شغال —
        // مش رح يطلعك عالشاشة يلي بتكتب فيها اسم حساب التيك توك مرة ثانية.
        function clearArenaForNewRound() {
            for (const s of snakes) { try { scene.remove(s.group); } catch (e) {} }
            snakes = [];
            supporterSnakes = {};
            supporterSoldiers = {};

            for (const e of effects) {
                if (e.gunMesh && e.owner) { try { e.owner.headMesh.remove(e.gunMesh); } catch (err) {} }
                if (e.mesh) { try { scene.remove(e.mesh); } catch (err) {} }
            }
            effects = [];

            for (const f of fruits) { if (f.mesh) { try { scene.remove(f.mesh); } catch (e) {} } }
            fruits = [];

            targetSnake = null;
            cameraMode = 'LEADER';
            gameTimeUp = false;
            timeRemainingSec = GAME_DURATION_SECONDS;
            const timerEl = document.getElementById('timer-text');
            if (timerEl) timerEl.innerText = formatTime(timeRemainingSec);

            populateFruitField();
            initSnakes(); // بما إنه liveModeActive صارت true، الخريطة بتضل فاضية لحد ما توصل هدايا/لايكات جديدة

            document.getElementById('end-screen').classList.add('hidden');
            triggerBannerEvent('🌍 جولة جديدة! الأرض رجعت فاضية بس ملوك الأرض 👑 محفوظين فوق.');
        }

        function triggerBannerEvent(msg) {
            const banner = document.getElementById('event-banner');
            const bannerText = document.getElementById('event-text');
            bannerText.innerText = msg;

            banner.classList.remove('-translate-y-full', 'opacity-0');
            banner.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                banner.classList.remove('translate-y-0', 'opacity-100');
                banner.classList.add('-translate-y-full', 'opacity-0');
            }, 3000);
        }

        function checkCollisions(delta) {
            // Animate Fruits Rotation
            for (let f of fruits) {
                if (!f.consumed) {
                    f.mesh.rotation.y += f.rotSpeed * delta;
                }
            }

            for (let i = 0; i < snakes.length; i++) {
                const s1 = snakes[i];
                if (s1.isDead) continue;
                if (s1.invulnerableTimer > 0) s1.invulnerableTimer -= delta;

                // Eating Fruits
                for (let f of fruits) {
                    if (!f.consumed && s1.headPos.distanceTo(f.pos) < 2.6) {
                        f.consumed = true;
                        scene.remove(f.mesh);
                        s1.eatenCount += 1;
                        s1.grow(f.type === 'star' ? 4 : 2);
                        sfxEat();
                        if (s1.ownerId) recordScore(s1.ownerId, s1.name, s1.photoURL, s1.segments.length);
                    }
                }

                // Boundary Collision Check
                if (Math.abs(s1.headPos.x) > ARENA_SIZE || Math.abs(s1.headPos.z) > ARENA_SIZE) {
                    s1.destroy();
                    if (s1 === targetSnake) targetSnake = null;
                    continue;
                }

                // Enemy Body Collision — الأكبر بتقدر تاكل نص الأصغر (مش كلها)، الأصغر إذا صدم الأكبر بيموت
                for (let j = 0; j < snakes.length; j++) {
                    const s2 = snakes[j];
                    if (s2.isDead || (s2.invulnerableTimer > 0) || (s2.shieldTimer > 0)) continue;

                    // CRITICAL: DO NOT CHECK COLLISION AGAINST OWN BODY!
                    if (s1.id === s2.id) continue; // PASSTHROUGH SELF FREELY!

                    for (let k = 0; k < s2.segments.length; k++) {
                        if (s1.headPos.distanceTo(s2.segments[k]) < 1.9) {
                            if (s1.segments.length > s2.segments.length) {
                                // s1 أكبر -> بتفترس نص جسم s2 بس، ما بتقتلها كلها
                                handleHalfEat(s1, s2, k);
                            } else if (s1.shieldTimer <= 0) {
                                // s1 مش أكبر -> بتموت هي (إلا إذا كانت محمية بدرع)
                                triggerBannerEvent(`⚡ ${s1.name} اصطدم بجسم أكبر منه (${s2.name}) ومات!`);
                                s1.destroy();
                                if (s1 === targetSnake) targetSnake = null;
                            }
                            break;
                        }
                    }
                    if (s1.isDead) break;
                }
            }

            // Cleanup Consumed Fruits & Maintain Environment
            fruits = fruits.filter(f => !f.consumed);
            while (fruits.length < INITIAL_FOOD_COUNT) {
                const x = (Math.random() - 0.5) * (ARENA_SIZE * 1.8);
                const z = (Math.random() - 0.5) * (ARENA_SIZE * 1.8);
                spawnFruit(x, z);
            }

            // Maintain Active Snakes (بس لما ما نكون على لايف حقيقي)
            snakes = snakes.filter(s => !s.isDead);
            if (!liveModeActive) {
                while (snakes.length < INITIAL_SNAKE_COUNT) {
                    spawnSnake();
                }
            }
        }

        function setupInteractions() {
            const btnCamMode = document.getElementById('btn-cam-mode');
            const camModeText = document.getElementById('cam-mode-text');

            btnCamMode.addEventListener('click', () => {
                if (cameraMode === 'LEADER') {
                    cameraMode = 'OVERVIEW';
                    camModeText.innerText = "نظرة شاملة (الخريطة)";
                } else {
                    cameraMode = 'LEADER';
                    camModeText.innerText = "تتبع المتصدر (زوم ذكي)";
                }
            });

            document.getElementById('btn-add-snakes').addEventListener('click', () => {
                spawnSnake();
            });

            document.getElementById('btn-spawn-fruits').addEventListener('click', () => {
                for (let i = 0; i < 20; i++) {
                    const x = (Math.random() - 0.5) * (ARENA_SIZE * 1.5);
                    const z = (Math.random() - 0.5) * (ARENA_SIZE * 1.5);
                    spawnFruit(x, z);
                }
                triggerBannerEvent("🍎 مطر فواكه طازجة في الخريطة!");
            });

            const btnPause = document.getElementById('btn-pause');
            const pauseIcon = document.getElementById('pause-icon');
            btnPause.addEventListener('click', () => {
                isPaused = !isPaused;
                pauseIcon.className = isPaused ? "fa-solid fa-play" : "fa-solid fa-pause";
            });

            document.getElementById('speed-slider').addEventListener('input', (e) => {
                simSpeed = parseFloat(e.target.value);
            });

            // Click snake to focus
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            window.addEventListener('click', (e) => {
                if (e.target.closest('.glass-panel')) return;
                if (window.__wasDragged && window.__wasDragged()) return; // كان سحب كاميرا مش كبسة اختيار

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(scene.children, true);

                for (let hit of intersects) {
                    for (let s of snakes) {
                        if (s.group === hit.object.parent || s.headMesh === hit.object) {
                            targetSnake = s;
                            cameraMode = 'MANUAL';
                            camModeText.innerText = `تتبع: ${s.name}`;
                            triggerBannerEvent(`🎥 تتبع مباشر: ${s.name}`);
                            return;
                        }
                    }
                }
            });
        }

        /* =========================================================
           KEYBOARD TEST SHORTCUTS (تجربة بدون تيك توك)
           ========================================================= */
        function setupTestShortcuts() {
            let testCounter = 1;
            document.addEventListener('keydown', (e) => {
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
                const k = e.key;
                const uid = 'test_' + (testCounter++);
                if (k === '1') handleSupport(uid, 'مستخدم تجربة', null, 1);
                else if (k === '2') handleSupport(uid, 'مستخدم تجربة', null, 10);
                else if (k === '3') handleSupport(uid, 'مستخدم تجربة', null, 30);
                else if (k === '4') handleSupport(uid, 'داعم كبير 👑', null, 150);
            });
        }

        /* =========================================================
           TIKTOK BRIDGE (WebSocket -> tiktok_snake_bridge.py)
           ========================================================= */
        let ws = null;
        function connectTikTokBridge() {
            const STUDIO_PORT = (typeof STUDIO_TARGET_PORT !== 'undefined' && STUDIO_TARGET_PORT) ? STUDIO_TARGET_PORT : 8765;
            try { ws = new WebSocket('ws://localhost:' + STUDIO_PORT); } catch (e) { retryBridge(); return; }
            ws.onopen = () => {
                document.getElementById('conn-dot').classList.add('on');
                document.getElementById('conn-text').innerText = 'متصل بالسيرفر، جاري الاتصال بالبث...';
                // نبعت اسم المستخدم وإعدادات اللايك للبرنامج (tiktok_snake_bridge.py) —
                // هيك ما في داعي تكتب شي بالترمينال، كل شي من هون.
                if (TIKTOK_USERNAME) {
                    ws.send(JSON.stringify({
                        type: 'login',
                        username: TIKTOK_USERNAME,
                        likeThreshold: LIKE_THRESHOLD
                    }));
                }
            };
            ws.onclose = () => {
                document.getElementById('conn-dot').classList.remove('on');
                document.getElementById('conn-text').innerText = 'غير متصل بتيك توك';
                retryBridge();
            };
            ws.onerror = () => { try { ws.close(); } catch (e) {} };
            ws.onmessage = (ev) => {
                let msg; try { msg = JSON.parse(ev.data); } catch (e) { return; }
                if (msg.type === 'status' && msg.uniqueId) {
                    document.getElementById('conn-text').innerText = 'متصل: @' + msg.uniqueId;
                    if (!liveModeActive) {
                        liveModeActive = true;
                        // امسح الحيايا العشوائية (تجريبية) الموجودة من قبل الاتصال —
                        // من هلق وطول اللايف، الخريطة فقط لحيايا الداعمين/المكبسين الحقيقيين.
                        for (const s of snakes) {
                            if (!s.ownerId) { s.isDead = true; scene.remove(s.group); }
                        }
                        snakes = snakes.filter(s => !s.isDead);
                        triggerBannerEvent('🔴 بدأ اللايف الحقيقي! الخريطة هلق للداعمين والمكبسين بس');
                    }
                } else if (msg.type === 'support') {
                    handleSupport(msg.uniqueId, msg.nickname, msg.profilePic, msg.value || 1);
                }
            };
        }
        function retryBridge() { setTimeout(connectTikTokBridge, 3000); }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);

            if (!isPaused) {
                // Sway Grass Mesh
                if (grassMesh) {
                    grassMesh.rotation.y = Math.sin(Date.now() * 0.0008) * 0.012;
                }

                // Update Snake AI & Movement
                for (let snake of snakes) {
                    snake.updateAI(delta);
                }

                // Check Collisions
                checkCollisions(delta);

                // Update Particle Animations
                updateParticles(delta);
                updateEffects(delta);
            }

            // Camera Tracking & Dynamic Auto-Zoom
            updateCameraAndFocus(delta);

            renderer.render(scene, camera);
        }

        // منبلش اللعبة الفعلية فقط بعد ما المستخدم يعبي شاشة الإعدادات ويضغط "ابدأ اللعبة"
        function startGame() {
            const usernameInput = document.getElementById('in-username').value.trim();
            if (!usernameInput) {
                document.getElementById('in-username').focus();
                document.getElementById('login-note').innerText = '⚠️ لازم تكتب اسم مستخدم التيك توك الأول!';
                document.getElementById('login-note').classList.add('text-red-400');
                return;
            }
            const likeThreshold = parseInt(document.getElementById('in-like-threshold').value, 10) || 10;
            const durationMin = parseFloat(document.getElementById('in-duration').value) || 10;

            TIKTOK_USERNAME = usernameInput.replace(/^@/, '');
            LIKE_THRESHOLD = likeThreshold;
            GAME_DURATION_SECONDS = Math.max(60, Math.round(durationMin * 60));
            timeRemainingSec = GAME_DURATION_SECONDS;

            document.getElementById('login-screen').classList.add('hidden');

            init3D();
            populateFruitField();
            initSnakes();
            setupTestShortcuts();
            setupManualCameraControls();
            connectTikTokBridge();
            document.getElementById('timer-text').innerText = formatTime(timeRemainingSec);
            setInterval(tickGameTimer, 1000);
            animate();
        }

        function initSnakeUI() {
            loadHallOfFame();
            updateHallOfFameUI();
            document.getElementById('btn-start-game').addEventListener('click', startGame);
            document.getElementById('in-username').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') startGame();
            });
            document.getElementById('btn-restart').addEventListener('click', () => {
                clearArenaForNewRound();
            });
            // إذا وصل اسم مستخدم جاهز من رابط لوحة التحكم (hub)، نعبّيه مسبقًا
            if (typeof STUDIO_TARGET_USERNAME !== 'undefined' && STUDIO_TARGET_USERNAME) {
                const el = document.getElementById('in-username');
                if (el) el.value = STUDIO_TARGET_USERNAME;
            }
        }

        // تشتغل فورًا لأن المكتبات (Three.js) صارت محمّلة قبل ما ينفّذ هذا الكود أصلاً
        initSnakeUI();
    
</script>
<script type="text/plain" id="src-snake">(function(){
  var params = new URLSearchParams(location.search);
  var STUDIO_TARGET_PORT = params.get('port') || 8765;
  var STUDIO_TARGET_USERNAME = params.get('username') || '';

  function loadCss(href){
    if(document.querySelector('link[href="'+href+'"]')) return;
    var l = document.createElement('link');
    l.rel = 'stylesheet'; l.href = href;
    document.head.appendChild(l);
  }
  function loadScript(src){
    return new Promise(function(resolve, reject){
      if(document.querySelector('script[src="'+src+'"]')){ resolve(); return; }
      var s = document.createElement('script');
      s.src = src; s.onload = function(){ resolve(); };
      s.onerror = function(){ reject(new Error('تعذر تحميل: '+src)); };
      document.head.appendChild(s);
    });
  }
  function loadDeps(){
    loadCss('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css');
    loadCss('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
    var chain = Promise.resolve();
    if(typeof window.tailwind === 'undefined'){
      chain = chain.then(function(){ return loadScript('https://cdn.tailwindcss.com'); });
    }
    if(typeof window.THREE === 'undefined'){
      chain = chain.then(function(){ return loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'); });
    }
    return chain;
  }

  var noteEl = document.getElementById('login-note');
  loadDeps().then(function(){
    var code = document.getElementById('src-snake-game').textContent;
    var runGame = new Function('STUDIO_TARGET_PORT', 'STUDIO_TARGET_USERNAME', code);
    runGame(STUDIO_TARGET_PORT, STUDIO_TARGET_USERNAME);
  }).catch(function(err){
    if(noteEl){
      noteEl.textContent = 'تعذّر تحميل مكتبات اللعبة (تأكد من الاتصال بالإنترنت): ' + err.message;
      noteEl.classList.add('text-red-400');
    }
    console.error(err);
  });
})();

</script>

const SND_ELEMENTS = {};
Object.keys(SND_B64).forEach(k=>{
    const a = new Audio(SND_B64[k]);
    a.preload = 'auto';
    SND_ELEMENTS[k] = a;
});
function playFile(key, vol){
    const base = SND_ELEMENTS[key];
    if (!base) return;
    try{
        const node = base.cloneNode(true);
        node.volume = (vol==null?0.55:vol);
        node.play().catch(()=>{});
    }catch(e){}
}

function beep(opts){
    if (AudioCtx.state === 'suspended') AudioCtx.resume();
    const osc = AudioCtx.createOscillator();
    const gain = AudioCtx.createGain();
    osc.type = opts.type || 'sine';
    osc.connect(gain); gain.connect(AudioCtx.destination);
    const now = AudioCtx.currentTime;
    osc.frequency.setValueAtTime(opts.f1, now);
    osc.frequency[opts.exp ? 'exponentialRampToValueAtTime' : 'linearRampToValueAtTime'](opts.f2, now + opts.dur);
    gain.gain.setValueAtTime(opts.vol || 0.25, now);
    gain.gain.linearRampToValueAtTime(0.0001, now + opts.dur);
    osc.start(now); osc.stop(now + opts.dur + 0.02);
}

let lastPunchAt = 0;
function playSound(type){
    try{
        if (type === 'like') beep({type:'sine', f1:500, f2:750, dur:0.06, vol:0.12});
        else if (type === 'grow') beep({type:'sine', f1:220, f2:440, dur:0.12, vol:0.18});
        else if (type === 'coin') beep({type:'triangle', f1:300, f2:900, dur:0.15, vol:0.22});
        else if (type === 'blade') playFile('sword', 0.5);                 // صوت السيف الحقيقي لضربات الشفرات
        else if (type === 'gun') beep({type:'square', f1:900, f2:400, dur:0.05, vol:0.12});
        else if (type === 'launch') beep({type:'sawtooth', f1:150, f2:650, dur:0.4, vol:0.3});
        else if (type === 'explode') playFile('explosion', 0.65);          // صوت الانفجار الحقيقي (صواريخ + موت)
        else if (type === 'merge') playFile('explosion', 0.7);
        else if (type === 'punch'){                                        // صوت الاحتكاك/الاصطدام الحقيقي (بحد أقصى)
            const now = performance.now();
            if (now - lastPunchAt > 220){ lastPunchAt = now; playFile('punch', 0.35); }
        }
        else if (type === 'ultimate') beep({type:'sawtooth', f1:100, f2:1200, dur:0.7, vol:0.35});
        else if (type === 'victory') beep({type:'triangle', f1:400, f2:1100, dur:0.9, vol:0.3});
        else if (type === 'tick') beep({type:'sine', f1:900, f2:900, dur:0.05, vol:0.1});
    }catch(e){}
}

/* ---------------- الإعدادات ---------------- */
let CONFIG = { likeThreshold: 10, roundMinutes: 5, vipThreshold: 150, username: '' };
function loadConfig(){
    try{ Object.assign(CONFIG, JSON.parse(localStorage.getItem('ttArenaConfigV2') || '{}')); }catch(e){}
}
function saveConfig(){ localStorage.setItem('ttArenaConfigV2', JSON.stringify(CONFIG)); }

/* ---------------- عناصر DOM ---------------- */
const $ = (id)=>document.getElementById(id);
const gate = $('arenaGate'), shell = $('arenaShell');
const canvas = $('battleCanvas'), ctx = canvas.getContext('2d');
const liveStatusEl = $('liveStatus');

function resizeCanvas(){
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resizeCanvas);

/* ---------------- شاشة الدخول ---------------- */
$('gateLikeThreshold').addEventListener('change', function(){
    $('gateCustomWrap').style.display = (this.value === 'custom') ? 'block' : 'none';
});

function startFromGate(){
    const uname = $('gateUsername').value.trim().replace(/^@/, '');
    if (!uname){ $('gateNote').textContent = 'الرجاء إدخال اسم المستخدم أولاً!'; return; }
    const sel = $('gateLikeThreshold').value;
    CONFIG.likeThreshold = (sel === 'custom') ? (parseInt($('gateLikeCustom').value)||10) : parseInt(sel);
    CONFIG.roundMinutes = parseInt($('gateRoundMinutes').value) || 5;
    CONFIG.vipThreshold = parseInt($('gateVip').value) || 150;
    CONFIG.username = uname;
    saveConfig();
    gate.style.display = 'none';
    shell.classList.add('show');
    resizeCanvas();
    $('cfgLike').value = CONFIG.likeThreshold;
    $('cfgRound').value = CONFIG.roundMinutes;
    $('cfgVip').value = CONFIG.vipThreshold;
    $('cfgUsername').value = CONFIG.username;
    renderTimerIdle();
    connectWS(uname);
    requestAnimationFrame(loop);
}
$('gateStart').addEventListener('click', startFromGate);
$('gateUsername').addEventListener('keydown', (e)=>{ if(e.key==='Enter') startFromGate(); });

/* ---------------- WebSocket ---------------- */
const urlParams = new URLSearchParams(location.search);
const ARENA_PORT = urlParams.get('port') || 8765;
let ws, wsTimer = null;

function setStatus(t){ liveStatusEl.textContent = t; }

function sendSetUsername(u){
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type:'set_username', username:u}));
}

function connectWS(usernameToSend){
    try{ ws = new WebSocket('ws://localhost:' + ARENA_PORT); }
    catch(e){ setStatus('تعذّر الاتصال بالسيرفر المحلي، إعادة المحاولة...'); wsTimer = setTimeout(()=>connectWS(usernameToSend),2000); return; }

    ws.onopen = ()=>{ setStatus('متصل بالسيرفر المحلي ✓ — جاري تشغيل البث...'); if(usernameToSend) sendSetUsername(usernameToSend); };
    ws.onclose = ()=>{ setStatus('انقطع الاتصال بالسيرفر، إعادة المحاولة...'); clearTimeout(wsTimer); wsTimer=setTimeout(()=>connectWS(CONFIG.username),2000); };
    ws.onerror = ()=>{ try{ws.close();}catch(e){} };
    ws.onmessage = onWSMessage;
}

function onWSMessage(evt){
    let data; try{ data = JSON.parse(evt.data); }catch(e){ return; }

    if (data.type === 'status'){
        const map = {
            connected:   'متصل باللايف @'+(data.username||'')+' ✓',
            waiting:     'بانتظار بدء بث @'+(data.username||'')+'...',
            connecting:  'جاري الاتصال بـ @'+(data.username||'')+'...',
            disconnected:'انتهى البث أو انقطع الاتصال',
            error:       'حدث خطأ بالاتصال، سيُعاد المحاولة...'
        };
        setStatus(map[data.state] || '...');
        return;
    }

    const uid = data.id || data.nickname;
    if (!uid) return;

    if (data.type === 'heart'){
        handleLike(uid, data.nickname, data.avatar, data.count||1);
    } else if (data.type === 'gift'){
        handleGift(uid, data.nickname, data.avatar, data.total||0);
    } else if (data.type === 'comment'){
        addChat(data.nickname, data.comment);
    } else if (data.type === 'share'){
        handleShare(uid, data.nickname, data.avatar);
    }
}

/* ---------------- عالم اللعبة ---------------- */
const defaultAvatar = 'https://ui-avatars.com/api/?background=random&name=';
function makeImg(src, name){
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = src || (defaultAvatar + encodeURIComponent(name||'?'));
    img.onerror = ()=>{ img.src = defaultAvatar + encodeURIComponent(name||'?'); };
    return img;
}

let fighters = {};      // id -> fighter
let bullets = [];
let rockets = [];
let orbitBlades = [];   // شفرات تدور حول صاحبها
let flyingBlades = [];  // شفرات تطير حرة بكل الساحة
let particles = [];
let shatterPieces = []; // شظايا الصور المنفجرة
let chatLines = [];

function teamOf(e){ return e.isSoldier ? (e.ownerId || e.id) : e.id; }

const BASE_RADIUS = 26;
const MAX_POWER = 300; // الحد الأقصى للحجم الأساسي (القوة المتراكمة)

function newFighter(id, name, avatarUrl){
    return {
        id, name: name || 'ضيف', avatar: makeImg(avatarUrl, name),
        x: 60 + Math.random()*(canvas.width-120 || 700),
        y: 60 + Math.random()*(canvas.height-120 || 400),
        vx: (Math.random()-0.5)*1.4, vy: (Math.random()-0.5)*1.4,
        power: BASE_RADIUS, boostMul: 1, boostUntil: 0,
        hp: 100, maxHp: 100,
        score: 0, coins: 0, likes: 0, stage: 0,
        alive: true, isSoldier:false, ownerId:null, soldiers:[],
        gun:{active:false,until:0,timer:0},
        rocketCD: 0,
        flashUntil: 0, fleeUntil:0,
        spawnAt: performance.now()
    };
}
function newSoldier(owner){
    const s = {
        id: owner.id+'-s'+Math.random().toString(36).slice(2,7),
        name: owner.name, avatar: owner.avatar,
        x: owner.x + (Math.random()-0.5)*60, y: owner.y + (Math.random()-0.5)*60,
        vx:(Math.random()-0.5)*1.6, vy:(Math.random()-0.5)*1.6,
        power: 13, boostMul:1, boostUntil:0,
        hp: 40, maxHp: 40, score:0,
        alive:true, isSoldier:true, ownerId: owner.id, soldiers:[],
        gun:{active:false,until:0,timer:0}, rocketCD:0,
        flashUntil:0, fleeUntil:0, spawnAt: performance.now()
    };
    owner.soldiers.push(s.id);
    fighters[s.id] = s;
    return s;
}

/* إذا كان الشخص ميتًا سابقًا ورجع كبس/دعم، يُنشأ من جديد بحجمه الطبيعي مع دورة ظهور */
function getOrCreateFighter(id, name, avatarUrl){
    let f = fighters[id];
    if (!f || !f.alive){
        f = newFighter(id, name, avatarUrl);
        fighters[id] = f;
        return f;
    }
    if (name) f.name = name;
    return f;
}

function sizeFromPower(e){
    const p = Math.min(MAX_POWER, e.power);
    return Math.min(150, BASE_RADIUS + p*0.55) * (e.boostUntil > performance.now() ? e.boostMul : 1);
}
/* نصف القطر الظاهر: يتقلص مع فقدان الهيل تدريجيًا حتى الموت */
function radiusOf(e){
    const full = sizeFromPower(e);
    const hpFrac = Math.max(0, Math.min(1, e.hp / e.maxHp));
    const shrink = 0.35 + 0.65*hpFrac;
    return Math.max(6, full * shrink);
}

/* ---------- اللايكات (التكبيس) ---------- */
function handleLike(uid, name, avatar, count){
    const f = getOrCreateFighter(uid, name, avatar);
    f.likes += count;
    const th = Math.max(1, CONFIG.likeThreshold);
    let grown = false;
    while (f.likes >= th){
        f.likes -= th;
        f.stage += 1;
        f.power = Math.min(MAX_POWER, f.power + 6);
        f.maxHp += 10; f.hp = Math.min(f.maxHp, f.hp + 10);
        f.score += 3;
        grown = true;
        bumpSoldiers(f, 0.3);
    }
    if (grown){ playSound('like'); spawnPulse(f); }
}

function handleShare(uid, name, avatar){
    const f = getOrCreateFighter(uid, name, avatar);
    f.power = Math.min(MAX_POWER, f.power + 2);
    f.maxHp += 4; f.hp += 4; f.score += 5;
    playSound('grow');
}

/* ---------- الهدايا (العملات) ---------- */
function handleGift(uid, name, avatar, coinsTotal){
    if (coinsTotal <= 0) return;
    const f = getOrCreateFighter(uid, name, avatar);
    const prev = f.coins;
    f.coins += coinsTotal;

    // كل عملة: تكبير + هيل
    f.power = Math.min(MAX_POWER, f.power + coinsTotal*3);
    f.maxHp += coinsTotal*30; f.hp = Math.min(f.maxHp, f.hp + coinsTotal*30);
    f.score += coinsTotal*5;
    playSound('coin'); spawnPulse(f);
    bumpSoldiers(f, coinsTotal*0.15);

    [5,10,20,30,100].forEach(T=>{
        const before = Math.floor(prev / T);
        const after  = Math.floor(f.coins / T);
        let n = after - before;
        if (n <= 0) return;
        n = Math.min(n, 3);
        for (let i=0;i<n;i++) triggerTier(f, T);
    });
}

function triggerTier(f, T){
    if (!f.alive) return;
    if (T === 5)  { spawnOrbitBlades(f); f.boostMul = Math.max(f.boostMul,4); f.boostUntil = performance.now()+7000; }
    if (T === 10) { spawnFlyingBlades(f); f.boostMul = Math.max(f.boostMul,7); f.boostUntil = performance.now()+10000; }
    if (T === 20) { activateGun(f); }
    if (T === 30) { launchRocket(f); }
    if (T === 100){
        spawnOrbitBlades(f); spawnFlyingBlades(f); activateGun(f); launchRocket(f); launchRocket(f);
        f.boostMul = 7; f.boostUntil = performance.now()+10000;
        f.score += 200;
        while (f.soldiers.length < 4) newSoldier(f);
        showUltimateBanner(f.name);
        playSound('ultimate');
        shake(18);
    }
}

function bumpSoldiers(owner, amt){
    owner.soldiers.forEach(sid=>{
        const s = fighters[sid];
        if (s && s.alive){ s.power = Math.min(MAX_POWER, s.power + amt); s.maxHp += amt*4; s.hp += amt*4; }
    });
}

/* ---------- شفرات دوارة حول الشخص (5 عملات) ---------- */
function spawnOrbitBlades(owner){
    playSound('blade');
    for (let i=0;i<2;i++){
        orbitBlades.push({
            ownerId: owner.id, angle: Math.random()*Math.PI*2, speed: 0.09+Math.random()*0.02,
            dist: 0, dmg: 15, until: performance.now()+7000, lastHit:{}
        });
    }
}
/* ---------- شفرات طائرة حرة (10 عملات) ---------- */
function spawnFlyingBlades(owner){
    playSound('blade');
    for (let i=0;i<3;i++){
        flyingBlades.push({
            ownerId: owner.id,
            x: owner.x, y: owner.y,
            vx:(Math.random()-0.5)*4.5, vy:(Math.random()-0.5)*4.5,
            dmg: 30, until: performance.now()+10000, lastHit:{}
        });
    }
}
/* ---------- الرشاش (20 عملة) ---------- */
function activateGun(f){
    f.gun.active = true; f.gun.until = performance.now()+10000; f.gun.timer = 0;
}
/* ---------- الصاروخ (30 عملة) ---------- */
function launchRocket(owner){
    const target = pickEnemyTarget(owner, true);
    if (!target) return;
    playSound('launch');
    rockets.push({
        ownerId: owner.id, targetId: target.id,
        x: owner.x, y: owner.y, vx:0, vy:0, speed: 3.6, turnRate: 0.09,
        trail: [], life: 6000, born: performance.now()
    });
}

function pickEnemyTarget(f, preferStrong){
    let best=null, bestScore=-Infinity;
    Object.values(fighters).forEach(o=>{
        if (!o.alive || teamOf(o)===teamOf(f)) return;
        const d = Math.hypot(o.x-f.x, o.y-f.y);
        const s = preferStrong ? (radiusOf(o)*3 - d) : (-d);
        if (s > bestScore){ bestScore = s; best = o; }
    });
    return best;
}

/* ---------------- الفيزياء والتصادم ---------------- */
function stepAI(f, dt){
    if (!f.alive) return;
    let danger=null, dangerDist=Infinity;
    rockets.forEach(r=>{
        if (r.targetId===f.id){ const d=Math.hypot(r.x-f.x,r.y-f.y); if(d<dangerDist){dangerDist=d;danger={x:r.x,y:r.y};} }
    });
    if (!danger){
        Object.values(fighters).forEach(o=>{
            if (!o.alive || teamOf(o)===teamOf(f)) return;
            const rr = radiusOf(o);
            if (rr > radiusOf(f)*1.35){
                const d = Math.hypot(o.x-f.x,o.y-f.y);
                if (d < 160 && d < dangerDist){ dangerDist=d; danger={x:o.x,y:o.y}; }
            }
        });
    }
    if (danger){
        const ang = Math.atan2(f.y-danger.y, f.x-danger.x);
        f.vx += Math.cos(ang)*0.35; f.vy += Math.sin(ang)*0.35;
    } else {
        let prey=null, preyDist=Infinity;
        Object.values(fighters).forEach(o=>{
            if (!o.alive || teamOf(o)===teamOf(f)) return;
            if (f.isSoldier || radiusOf(f) > radiusOf(o)*0.9){
                const d = Math.hypot(o.x-f.x,o.y-f.y);
                if (d < 260 && d < preyDist){ preyDist=d; prey=o; }
            }
        });
        if (prey){
            const ang = Math.atan2(prey.y-f.y, prey.x-f.x);
            f.vx += Math.cos(ang)*0.18; f.vy += Math.sin(ang)*0.18;
        } else {
            f.vx += (Math.random()-0.5)*0.12; f.vy += (Math.random()-0.5)*0.12;
        }
    }
    const maxSpd = f.isSoldier ? 2.6 : 2.0;
    const spd = Math.hypot(f.vx,f.vy);
    if (spd > maxSpd){ f.vx = f.vx/spd*maxSpd; f.vy = f.vy/spd*maxSpd; }
    f.vx *= 0.985; f.vy *= 0.985;
    f.x += f.vx; f.y += f.vy;
    const r = radiusOf(f);
    if (f.x-r<0){f.x=r;f.vx*=-0.6;} if (f.x+r>canvas.width){f.x=canvas.width-r;f.vx*=-0.6;}
    if (f.y-r<0){f.y=r;f.vy*=-0.6;} if (f.y+r>canvas.height){f.y=canvas.height-r;f.vy*=-0.6;}
}

/* شظايا الصورة المتفجرة */
function spawnShatter(target){
    const img = target.avatar;
    const r = Math.max(14, radiusOf(target));
    const cx = target.x, cy = target.y;
    const grid = 3;
    const ready = img && img.complete && img.naturalWidth > 0;
    const sw = ready ? img.naturalWidth/grid : 0;
    const sh = ready ? img.naturalHeight/grid : 0;
    for (let gy=0; gy<grid; gy++){
        for (let gx=0; gx<grid; gx++){
            const ang = Math.atan2((gy-1), (gx-1)) + (Math.random()-0.5)*0.4;
            const spd = 2.2 + Math.random()*3.2;
            shatterPieces.push({
                img, ready,
                sx: gx*sw, sy: gy*sh, sw, sh,
                size: (r*2)/grid,
                x: cx + (gx-1)*(r*0.5), y: cy + (gy-1)*(r*0.5),
                vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd - 1,
                rot: 0, vrot: (Math.random()-0.5)*0.35,
                life: 750 + Math.random()*250, maxLife: 900,
                color: ['#ff5050','#ff9f40','#ffe600','#ff0050'][(gx+gy)%4]
            });
        }
    }
}
function stepShatter(dt){
    shatterPieces = shatterPieces.filter(p=>{
        p.life -= dt*1000;
        p.vy += 9*dt; // جاذبية خفيفة
        p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
        return p.life > 0;
    });
}
function drawShatter(){
    shatterPieces.forEach(p=>{
        const a = Math.max(0, p.life/p.maxLife);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        if (p.ready){
            ctx.drawImage(p.img, p.sx, p.sy, p.sw, p.sh, -p.size/2, -p.size/2, p.size, p.size);
        } else {
            ctx.fillStyle = p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
        }
        ctx.restore();
    });
}

function eliminate(target, killer){
    if (!target.alive) return;
    target.alive = false;
    playSound('explode');
    spawnShatter(target);
    spawnBurst(target.x, target.y, '#ff0050');
    shake(10);
    if (killer){
        let recipient = killer.isSoldier ? (fighters[killer.ownerId] || killer) : killer;
        if (recipient.alive){
            // الفائز يأخذ حجم/قوة الخصم المتبقية بالكامل
            recipient.power = Math.min(MAX_POWER, recipient.power + target.power);
            recipient.maxHp += target.maxHp*0.3;
            recipient.hp = Math.min(recipient.maxHp, recipient.hp + target.maxHp*0.15);
            recipient.score += 50; // نقاط التفجير
        }
    }
    (target.soldiers||[]).forEach(sid=>{ const s=fighters[sid]; if(s) s.alive=false; });
    updateVIP(target);
}

function resolveCollisions(dt){
    const list = Object.values(fighters).filter(f=>f.alive);
    for (let i=0;i<list.length;i++){
        for (let j=i+1;j<list.length;j++){
            const a=list[i], b=list[j];
            if (teamOf(a)===teamOf(b)) continue;
            const ra=radiusOf(a), rb=radiusOf(b);
            const dx=b.x-a.x, dy=b.y-a.y; const dist=Math.hypot(dx,dy)||0.01;
            const minDist=ra+rb;
            if (dist < minDist){
                const nx=dx/dist, ny=dy/dist, overlap=(minDist-dist);
                const totalR = ra+rb;
                a.x -= nx*overlap*(rb/totalR); a.y -= ny*overlap*(rb/totalR);
                b.x += nx*overlap*(ra/totalR); b.y += ny*overlap*(ra/totalR);
                const chip = 6*dt;
                a.hp -= chip; b.hp -= chip;
                a.flashUntil = performance.now()+120; b.flashUntil = performance.now()+120;
                playSound('punch');
                if (Math.random()<0.05) spawnSpark((a.x+b.x)/2,(a.y+b.y)/2);
                if (a.hp<=0) eliminate(a,b);
                if (b.hp<=0) eliminate(b,a);
            }
        }
    }
}

function stepGun(f, dt, now){
    if (!f.gun.active) return;
    if (now > f.gun.until){ f.gun.active=false; return; }
    f.gun.timer -= dt*1000;
    if (f.gun.timer <= 0){
        f.gun.timer = 160;
        const target = pickEnemyTarget(f,false);
        if (target){
            const ang = Math.atan2(target.y-f.y, target.x-f.x);
            bullets.push({ ownerId:f.id, targetId:target.id, x:f.x, y:f.y,
                vx:Math.cos(ang)*9, vy:Math.sin(ang)*9, life:800 });
            playSound('gun');
        }
    }
}

function stepBullets(dt){
    bullets = bullets.filter(b=>{
        b.x+=b.vx; b.y+=b.vy; b.life-=dt*1000;
        if (b.life<=0) return false;
        const owner = fighters[b.ownerId] || {id:b.ownerId};
        for (const f of Object.values(fighters)){
            if (!f.alive || teamOf(f)===teamOf(owner)) continue;
            if (Math.hypot(f.x-b.x,f.y-b.y) < radiusOf(f)){
                f.hp -= f.hp*0.40; f.flashUntil=performance.now()+150;
                playSound('punch'); spawnSpark(b.x,b.y);
                if (f.hp<=0) eliminate(f, fighters[b.ownerId]);
                return false;
            }
        }
        return b.x>=0 && b.x<=canvas.width && b.y>=0 && b.y<=canvas.height;
    });
}

function stepRockets(dt, now){
    rockets = rockets.filter(r=>{
        const owner = fighters[r.ownerId];
        const target = fighters[r.targetId];
        r.life -= dt*1000;
        if (r.life<=0 || !target || !target.alive) { spawnBurst(r.x,r.y,'#ff7a00'); return false; }
        const ang = Math.atan2(target.y-r.y, target.x-r.x);
        const curAng = Math.atan2(r.vy||0.01, r.vx||0.01);
        let diff = ang-curAng; while(diff>Math.PI) diff-=Math.PI*2; while(diff<-Math.PI) diff+=Math.PI*2;
        const na = curAng + Math.max(-r.turnRate, Math.min(r.turnRate, diff));
        r.vx = Math.cos(na)*r.speed; r.vy = Math.sin(na)*r.speed;
        r.x += r.vx; r.y += r.vy;
        r.trail.push({x:r.x,y:r.y,t:now});
        if (r.trail.length>16) r.trail.shift();
        const rr = radiusOf(target);
        if (Math.hypot(target.x-r.x, target.y-r.y) < rr+6){
            target.hp -= target.hp*0.50; target.flashUntil=performance.now()+200;
            playSound('explode'); spawnBurst(r.x,r.y,'#ffae00'); shake(8);
            if (target.hp<=0 && owner) eliminate(target, owner);
            return false;
        }
        return r.x>=-40 && r.x<=canvas.width+40 && r.y>=-40 && r.y<=canvas.height+40;
    });
}

function stepBlades(dt, now){
    orbitBlades = orbitBlades.filter(bl=>{
        const owner = fighters[bl.ownerId];
        if (!owner || !owner.alive || now>bl.until) return false;
        bl.angle += bl.speed;
        bl.dist = radiusOf(owner) + 26;
        const bx = owner.x + Math.cos(bl.angle)*bl.dist;
        const by = owner.y + Math.sin(bl.angle)*bl.dist;
        Object.values(fighters).forEach(f=>{
            if (!f.alive || teamOf(f)===teamOf(owner)) return;
            if (Math.hypot(f.x-bx,f.y-by) < radiusOf(f)+8){
                const key=f.id; const last=bl.lastHit[key]||0;
                if (now-last>450){ bl.lastHit[key]=now; f.hp-=bl.dmg; f.flashUntil=now+120; playSound('blade'); spawnSpark(bx,by);
                    if (f.hp<=0) eliminate(f, owner); }
            }
        });
        return true;
    });
    flyingBlades = flyingBlades.filter(bl=>{
        if (now>bl.until) return false;
        bl.x+=bl.vx; bl.y+=bl.vy;
        if (bl.x<10||bl.x>canvas.width-10) bl.vx*=-1;
        if (bl.y<10||bl.y>canvas.height-10) bl.vy*=-1;
        const owner = fighters[bl.ownerId];
        Object.values(fighters).forEach(f=>{
            if (!f.alive || (owner && teamOf(f)===teamOf(owner))) return;
            if (Math.hypot(f.x-bl.x,f.y-bl.y) < radiusOf(f)+9){
                const key=f.id; const last=bl.lastHit[key]||0;
                if (now-last>450){ bl.lastHit[key]=now; f.hp-=bl.dmg; f.flashUntil=now+120; playSound('blade'); spawnSpark(bl.x,bl.y);
                    if (f.hp<=0) eliminate(f, owner); }
            }
        });
        return true;
    });
}

/* ---------------- المؤثرات البصرية ---------------- */
let shakeMag = 0;
function shake(v){ shakeMag = Math.max(shakeMag, v); }
function spawnSpark(x,y){
    for(let i=0;i<6;i++) particles.push({x,y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:300,color:'#00f2fe',size:2+Math.random()*2});
}
function spawnBurst(x,y,color){
    for(let i=0;i<22;i++){ const a=Math.random()*Math.PI*2, sp=1+Math.random()*4;
        particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:500+Math.random()*300,color:color||'#ffe600',size:2+Math.random()*3}); }
}
function spawnPulse(f){ particles.push({x:f.x,y:f.y,vx:0,vy:0,life:260,color:'#00ff9d',size:radiusOf(f),ring:true}); }
function stepParticles(dt){
    particles = particles.filter(p=>{
        p.life -= dt*1000; p.x+=p.vx; p.y+=p.vy; p.vx*=0.94; p.vy*=0.94;
        return p.life>0;
    });
}
function showUltimateBanner(name){
    const el = $('ultimateBanner');
    el.textContent = '⚡ قوة خارقة! ' + name + ' ⚡';
    el.classList.add('show');
    clearTimeout(el._t);
    el._t = setTimeout(()=>el.classList.remove('show'), 2200);
}

/* ---------------- الدردشة ---------------- */
function addChat(name, text){
    if (!text) return;
    const el = $('chatOverlay');
    const div = document.createElement('div');
    div.className='chat-msg';
    div.innerHTML = '<b>'+escapeHtml(name||'')+':</b> '+escapeHtml(text).slice(0,80);
    el.insertBefore(div, el.firstChild);
    while (el.children.length>18) el.removeChild(el.lastChild);
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------------- VIP + المحاربون ---------------- */
function loadVIPs(){ try{ return JSON.parse(localStorage.getItem('ttArenaVIPsV2')||'{}'); }catch(e){ return {}; } }
function saveVIPs(v){ localStorage.setItem('ttArenaVIPsV2', JSON.stringify(v)); }
let vipData = loadVIPs();

function updateVIP(f){
    if (f.isSoldier) return;
    if (f.score < CONFIG.vipThreshold) return;
    if (!vipData[f.id] || f.score > vipData[f.id].score){
        vipData[f.id] = { name:f.name, avatar:f.avatar.src, score:Math.round(f.score) };
        saveVIPs(vipData);
    }
}
function renderVIP(){
    const arr = Object.values(vipData).sort((a,b)=>b.score-a.score).slice(0,8);
    const el = $('vipList'); el.innerHTML='';
    arr.forEach((v,i)=>{
        const d=document.createElement('div');
        d.className='p-item'+(i===0?' r1':i===1?' r2':i===2?' r3':'');
        d.innerHTML = '<img src="'+v.avatar+'" onerror="this.src=\''+defaultAvatar+'\'"><span class="nm">'+escapeHtml(v.name)+'</span><span class="sc">'+v.score+'</span>';
        el.appendChild(d);
    });
}
$('vipClearBtn').addEventListener('click', ()=>{ vipData={}; saveVIPs(vipData); renderVIP(); });

function renderWarriors(){
    const arr = Object.values(fighters).filter(f=>!f.isSoldier).sort((a,b)=>b.score-a.score).slice(0,10);
    const el = $('warriorsList'); el.innerHTML='';
    arr.forEach((f,i)=>{
        const d=document.createElement('div');
        d.className='p-item'+(i===0?' r1':i===1?' r2':i===2?' r3':'')+(f.alive?'':' dead');
        d.innerHTML = '<img src="'+f.avatar.src+'" onerror="this.src=\''+defaultAvatar+'\'"><span class="nm">'+escapeHtml(f.name)+'</span><span class="sc">'+Math.round(f.score)+'</span>';
        el.appendChild(d);
    });
}

/* ---------------- الجولة ---------------- */
let roundActive=false, roundEndsAt=0;
$('roundBtn').addEventListener('click', ()=> roundActive ? endRound() : startRound());
$('resetBtn').addEventListener('click', resetBattle);
$('kingCloseBtn').addEventListener('click', ()=>{ $('kingOverlay').classList.remove('open'); resetBattle(); });

function resetBattle(){
    fighters={}; bullets=[]; rockets=[]; orbitBlades=[]; flyingBlades=[]; particles=[]; shatterPieces=[];
    renderWarriors();
    renderTimerIdle();
}
function startRound(){
    resetBattle();
    roundActive=true;
    roundEndsAt = performance.now() + CONFIG.roundMinutes*60000;
    $('roundBtn').textContent='إنهاء الجولة ⏹';
    playSound('tick');
}
function endRound(){
    roundActive=false;
    $('roundBtn').textContent='ابدأ الجولة ⏱';
    const ranked = Object.values(fighters).filter(f=>!f.isSoldier).sort((a,b)=>b.score-a.score);
    ranked.forEach(updateVIP);
    renderTimerIdle();
    if (ranked.length) showKing(ranked);
}
/* العداد ظاهر دومًا: وقت تنازلي أثناء الجولة، أو الوقت المهيّأ قبل البدء */
function renderTimerIdle(){
    const s = Math.max(1, CONFIG.roundMinutes)*60;
    $('roundTimer').textContent = '⏱ جاهز '+fmtTime(s);
}
function fmtTime(totalSeconds){
    const s = Math.max(0, Math.ceil(totalSeconds));
    return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
}
function tickRoundTimer(){
    if (!roundActive) return;
    const left = Math.max(0, roundEndsAt - performance.now());
    $('roundTimer').textContent = '⏱ '+fmtTime(left/1000);
    if (left<=0) endRound();
}
function showKing(ranked){
    const winner = ranked[0];
    $('kingAvatar').src = winner.avatar.src;
    $('kingName').textContent = winner.name;
    const box = $('kingRanking'); box.innerHTML='';
    ranked.slice(0,5).forEach((f,i)=>{
        const row=document.createElement('div');
        row.className='rank-row';
        row.style.fontSize = i===0 ? '1.05rem' : '0.85rem';
        row.innerHTML = '<span class="rn">#'+(i+1)+'</span><img src="'+f.avatar.src+'"><span class="nm">'+escapeHtml(f.name)+'</span><span class="sc">'+Math.round(f.score)+'</span>';
        box.appendChild(row);
    });
    $('kingOverlay').classList.add('open');
    playSound('victory');
}

/* ---------------- الرسم ---------------- */
function drawGrid(){
    ctx.strokeStyle='rgba(255,255,255,0.04)'; ctx.lineWidth=1;
    for(let x=0;x<canvas.width;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
    for(let y=0;y<canvas.height;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
}

function drawFighter(f, now){
    const r = radiusOf(f);
    const flashed = f.flashUntil > now;

    // دورة ظهور (سبين) عند أول ظهور أو عند العودة بعد الموت
    const spawnDur = 550;
    const age = now - f.spawnAt;
    let spinRot = 0, spinScale = 1;
    if (age >= 0 && age < spawnDur){
        const p = age/spawnDur;
        const ease = 1 - Math.pow(1-p, 3);
        spinScale = 0.15 + 0.85*ease;
        spinRot = (1-ease) * Math.PI*4;
    }

    ctx.save();
    ctx.translate(f.x, f.y); ctx.rotate(spinRot); ctx.scale(spinScale, spinScale); ctx.translate(-f.x,-f.y);

    ctx.save();
    ctx.beginPath(); ctx.arc(f.x,f.y,r,0,Math.PI*2); ctx.clip();
    if (f.avatar.complete && f.avatar.naturalWidth) ctx.drawImage(f.avatar, f.x-r, f.y-r, r*2, r*2);
    else { ctx.fillStyle = f.isSoldier ? '#345' : '#00f2fe'; ctx.fill(); }
    if (flashed){ ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.fillRect(f.x-r,f.y-r,r*2,r*2); }
    ctx.restore();

    ctx.lineWidth = f.isSoldier?1.5:2.5;
    ctx.strokeStyle = f.isSoldier ? '#8fd3ff' : '#ffe600';
    ctx.beginPath(); ctx.arc(f.x,f.y,r,0,Math.PI*2); ctx.stroke();

    if (!f.isSoldier){
        const bw = Math.max(46, r*1.7), bh=6;
        const bx=f.x-bw/2, by=f.y-r-26;
        ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(bx,by,bw,bh);
        const pct = Math.max(0, f.hp/f.maxHp);
        ctx.fillStyle = pct>0.5 ? '#2ecc71' : (pct>0.2 ? '#f1c40f' : '#e74c3c');
        ctx.fillRect(bx,by,bw*pct,bh);
        ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1; ctx.strokeRect(bx,by,bw,bh);

        ctx.fillStyle='#fff'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center';
        ctx.fillText(f.name, f.x, by-6);

        ctx.font='bold '+Math.max(11,Math.min(20,r*0.5))+'px sans-serif';
        ctx.fillStyle='rgba(255,255,255,0.95)'; ctx.strokeStyle='rgba(0,0,0,0.85)'; ctx.lineWidth=3;
        ctx.strokeText(Math.round(f.score), f.x, f.y+4);
        ctx.fillText(Math.round(f.score), f.x, f.y+4);
    }

    if (f.gun.active){
        ctx.strokeStyle='#ff5050'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(f.x,f.y,r+5,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
}

function drawBlade(x,y,rot){
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
    ctx.fillStyle='#dfe6ff'; ctx.strokeStyle='#00f2fe'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(-9,0); ctx.lineTo(9,-3); ctx.lineTo(9,3); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
}

function drawScene(now){
    ctx.save();
    if (shakeMag>0.2){ ctx.translate((Math.random()-0.5)*shakeMag,(Math.random()-0.5)*shakeMag); shakeMag*=0.85; } else shakeMag=0;
    ctx.clearRect(-20,-20,canvas.width+40,canvas.height+40);
    drawGrid();

    orbitBlades.forEach(bl=>{
        const owner=fighters[bl.ownerId]; if(!owner) return;
        const bx=owner.x+Math.cos(bl.angle)*bl.dist, by=owner.y+Math.sin(bl.angle)*bl.dist;
        drawBlade(bx,by,bl.angle*4);
    });
    flyingBlades.forEach(bl=> drawBlade(bl.x,bl.y, now/60));

    Object.values(fighters).forEach(f=> drawFighter(f, now));
    drawShatter();

    bullets.forEach(b=>{ ctx.fillStyle='#ffe600'; ctx.beginPath(); ctx.arc(b.x,b.y,3.4,0,Math.PI*2); ctx.fill(); });

    rockets.forEach(r=>{
        r.trail.forEach((t,i)=>{ ctx.fillStyle='rgba(180,180,180,'+(i/r.trail.length*0.5)+')'; ctx.beginPath(); ctx.arc(t.x,t.y,3,0,Math.PI*2); ctx.fill(); });
        const ang = Math.atan2(r.vy,r.vx);
        ctx.save(); ctx.translate(r.x,r.y); ctx.rotate(ang);
        ctx.fillStyle='#ff7a00'; ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(-10,-6); ctx.lineTo(-10,6); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#ffdd55'; ctx.beginPath(); ctx.arc(-11,0,3,0,Math.PI*2); ctx.fill();
        ctx.restore();
    });

    particles.forEach(p=>{
        const a = Math.max(0, p.life/600);
        if (p.ring){
            ctx.strokeStyle = p.color; ctx.globalAlpha=a*0.7; ctx.lineWidth=3;
            ctx.beginPath(); ctx.arc(p.x,p.y, p.size*(1.6-a), 0, Math.PI*2); ctx.stroke();
        } else {
            ctx.fillStyle = p.color; ctx.globalAlpha=a;
            ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha=1;
    });

    ctx.restore();
}

/* ---------------- الحلقة الرئيسية ---------------- */
let lastT = performance.now();
function loop(now){
    const dt = Math.min(0.05, (now-lastT)/1000); lastT = now;

    Object.values(fighters).forEach(f=>{ if(f.alive) stepAI(f, dt); });
    resolveCollisions(dt);
    Object.values(fighters).forEach(f=>{ if(f.alive) stepGun(f, dt, now); });
    stepBullets(dt);
    stepRockets(dt, now);
    stepBlades(dt, now);
    stepParticles(dt);
    stepShatter(dt);
    tickRoundTimer();

    drawScene(now);
    renderWarriors();

    requestAnimationFrame(loop);
}

/* ---------------- البدء ---------------- */
loadConfig();
if (CONFIG.username){
    $('gateUsername').value = CONFIG.username;
    $('gateRoundMinutes').value = CONFIG.roundMinutes;
    $('gateVip').value = CONFIG.vipThreshold;
    const opt = [10,20,30,50].includes(CONFIG.likeThreshold) ? String(CONFIG.likeThreshold) : 'custom';
    $('gateLikeThreshold').value = opt;
    if (opt==='custom'){ $('gateCustomWrap').style.display='block'; $('gateLikeCustom').value = CONFIG.likeThreshold; }
}
renderVIP();
resizeCanvas();
renderTimerIdle();

})();
</script>

    if(actx.state === "suspended") actx.resume();
  }
  window.addEventListener("keydown", function(e){ if(e.ctrlKey && e.shiftKey && e.code === "KeyA"){ e.preventDefault(); try{ parent.postMessage("ovl-admin","*"); }catch(x){} } });

  /* =====================================================================
     تسجيل الدخول باسم مستخدم اللايف + شريط الحالة
     (نفس منطق باقي أدوات اللايف عندك)
     ===================================================================== */
  const LOGIN_STORAGE_KEY = "tt_live_captions_username";
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("status-text");
  const loginBox = document.getElementById("login-box");
  const loginForm = document.getElementById("login-form");
  const loginInput = document.getElementById("login-input");

  let savedUsername = "";
  try{ savedUsername = localStorage.getItem(LOGIN_STORAGE_KEY) || ""; } catch(e){ savedUsername = ""; }
  savedUsername = (params.get("username") || "").replace(/^@/, "");
  if(savedUsername){ loginInput.value = savedUsername; }

  function setStatus(text, mood){
    statusText.textContent = text;
    statusEl.classList.toggle("ok", mood === "ok");
    statusEl.classList.toggle("wait", mood === "wait");
  }
  function showLogin(){ loginBox.classList.remove("hidden"); }
  function hideLogin(){ loginBox.classList.add("hidden"); }
  statusEl.addEventListener("click", showLogin);

  if(savedUsername){
    setStatus("جارٍ الاتصال بـ @" + savedUsername + " ...", "wait");
    hideLogin();
  } else {
    showLogin();
  }

  let activeWs = null;
  function sendLogin(username){
    if(!activeWs || activeWs.readyState !== WebSocket.OPEN) return;
    try{ activeWs.send(JSON.stringify({ type:"login", username })); } catch(e){ /* تجاهل */ }
  }

  loginForm.addEventListener("submit", function(e){
    e.preventDefault();
    const uname = loginInput.value.trim().replace(/^@/, "");
    if(!uname) return;
    savedUsername = uname;
    try{ localStorage.setItem(LOGIN_STORAGE_KEY, uname); } catch(err){ /* تجاهل */ }
    setStatus("جارٍ الاتصال بـ @" + uname + " ...", "wait");
    sendLogin(uname);
    hideLogin();
  });

  function handleStatus(data){
    const uname = data.username || savedUsername;
    switch(data.state){
      case "connected":
        setStatus("متصل بلايف @" + uname + " \u2713", "ok");
        hideLogin();
        break;
      case "connecting":
        setStatus("جارٍ الاتصال بـ @" + uname + " ...", "wait");
        break;
      case "waiting":
        setStatus("@" + uname + " مش مباشر هلق، بنعيد المحاولة...", "wait");
        break;
      case "disconnected":
        setStatus("انتهى بث @" + uname + " أو انقطع الاتصال", "");
        break;
      case "error":
        setStatus("صار خطأ بالاتصال بـ @" + uname + "، بنعيد المحاولة...", "");
        break;
      default:
        break;
    }
  }

  /* =====================================================================
     الكابشن السينمائي: يعرض كل جملة تحكيها بالمايك ككلمات تتلاشى للظهور
     =====================================================================
  */
  const finalLineEl = document.getElementById("final-line");
  const interimLineEl = document.getElementById("interim-line");
  let clearTimer = null;

  function showInterim(text){
    interimLineEl.textContent = text;
  }

  function commitFinalCaption(text){
    text = text.trim();
    if(!text) return;
    interimLineEl.textContent = "";

    finalLineEl.classList.remove("show");
    finalLineEl.innerHTML = "";
    const words = text.split(/\s+/);
    words.forEach(function(w, i){
      const span = document.createElement("span");
      span.className = "word";
      span.textContent = w;
      span.style.animationDelay = (i * 65) + "ms";
      finalLineEl.appendChild(span);
    });

    void finalLineEl.offsetWidth; // إعادة تشغيل الأنيميشن حتى لو الجملة جاية بسرعة ورا بعض
    finalLineEl.classList.add("show");

    clearTimeout(clearTimer);
    const holdMs = Math.min(7000, Math.max(2600, words.length * 420));
    clearTimer = setTimeout(function(){
      finalLineEl.classList.remove("show");
    }, holdMs);
  }

  /* =====================================================================
     التعرف على كلامك بالمايك (Web Speech API) — كله جوّا المتصفح، ما
     بيتبعت ولا يتسجل بأي سيرفر. بيوقف تلقائيًا وقت ما تنقرا كومنتات
     بصوت (Siri) حتى ما ينكتب كلامها وكأنك حكيته.
     ===================================================================== */
  const micBtn = document.getElementById("mic-btn");
  const micBtnText = document.getElementById("mic-btn-text");
  const micHint = document.getElementById("mic-hint");

  const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
  const speechSupported = !!SpeechRecognitionImpl;

  let recognition = null;
  let micWanted = false;      // المستخدم ضغط "فعّل المايك"
  let recognitionActive = false;
  let pausedForSpeech = false; // موقوف مؤقتًا لأنو عم تنقرا كومنتات بصوت
  let lastErrorType = null;
  let quickErrorCount = 0;
  let lastErrorAt = 0;

  // هيدول أخطاء إذن/وصول (المتصفح رفض المايك) - لازم نوقف المحاولة
  // التلقائية عندها، وإلا رح تفضل نافذة "اسمح بالمايك" تطلع كل شوي
  const PERMISSION_ERRORS = { "not-allowed": 1, "service-not-allowed": 1, "audio-capture": 1 };

  function createRecognition(){
    const r = new SpeechRecognitionImpl();
    r.lang = params.get("lang") || "ar-LB";
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onresult = function(e){
      let interim = "";
      for(let i = e.resultIndex; i < e.results.length; i++){
        const res = e.results[i];
        const text = res[0].transcript;
        if(res.isFinal){
          commitFinalCaption(text);
        } else {
          interim += text;
        }
      }
      showInterim(interim.trim());
    };
    r.onerror = function(e){ lastErrorType = e.error; };
    r.onend = function(){
      recognitionActive = false;
      if(!micWanted || pausedForSpeech) return;

      if(PERMISSION_ERRORS[lastErrorType]){
        // المتصفح رفض إذن المايك (أو ما قدر يوصله). منوقف المحاولة
        // التلقائية هون بدل ما نضل نفتح نافذة "اسمح بالمايك" بلا فايدة؛
        // المستخدم لازم يسمح من إعدادات المتصفح ويضغط الزر يدويًا كمان مرة.
        micWanted = false;
        micBtn.classList.remove("active");
        micBtnText.textContent = "🚫 رفض إذن المايك، اسمح له واضغط هون كمان مرة";
        lastErrorType = null;
        return;
      }

      // أخطاء عادية (متل "no-speech" أو انقطاع بسيط) - نعيد المحاولة،
      // بس مع تهدئة بسيطة إذا صارت متكررة بسرعة (تفاديًا لأي حلقة سريعة)
      const now = Date.now();
      quickErrorCount = (now - lastErrorAt < 4000) ? (quickErrorCount + 1) : 0;
      lastErrorAt = now;
      const delay = quickErrorCount > 5 ? 4000 : 300;
      lastErrorType = null;
      setTimeout(startRecognitionIfWanted, delay);
    };
    return r;
  }

  function startRecognitionIfWanted(){
    if(!micWanted || pausedForSpeech || recognitionActive || !speechSupported) return;
    try{
      if(!recognition) recognition = createRecognition();
      recognition.start();
      recognitionActive = true;
    } catch(e){ /* شغال أصلًا غالبًا؛ منتجاهل */ }
  }

  function stopRecognitionInternal(){
    if(recognition){
      try{ recognition.stop(); } catch(e){ /* تجاهل */ }
    }
    recognitionActive = false;
  }

  micBtn.addEventListener("click", function(){
    if(!speechSupported){
      micBtnText.textContent = "المتصفح ما بيدعم هالميزة";
      return;
    }
    micWanted = !micWanted;
    quickErrorCount = 0;
    if(micWanted){
      micBtn.classList.add("active");
      micBtnText.textContent = "المايك شغال \u2713";
      micHint.style.display = "none";
      startRecognitionIfWanted();
    } else {
      micBtn.classList.remove("active");
      micBtnText.textContent = "فعّل المايك";
      stopRecognitionInternal();
    }
  });

  if(!speechSupported){
    micBtnText.textContent = "المتصفح ما بيدعم هالميزة";
    micBtn.style.opacity = ".5";
  }

  /* =====================================================================
     قراءة الكومنتات بصوت بس (بدون ما تنكتب أبدًا عالشاشة، وبدون ما يُذكر
     اسم صاحب الكومنت).

     ملاحظة مهمة: صوت المتصفح المحلي (speechSynthesis) كان عم يطلع مقطّع
     وغير مفهوم لأنو بيعتمد على الأصوات المثبّتة بجهازك، وغالبًا ما في
     صوت عربي حقيقي مثبّت (فبيرجع لصوت آلي بيهجّي الحروف). لهيك هلق
     منستخدم صوت عربي حقيقي وواضح عبر الإنترنت (نفس نوع الصوت يلي
     بتسمعه بأدوات القراءة المشابهة)، ومنقسم الجملة الطويلة لأجزاء
     ومنشغّلها ورا بعضها بشكل متواصل.
     ===================================================================== */
  const commentQueue = [];
  let speakingComment = false;
  let currentAudio = null;

  function chunkTextForSpeech(text, maxLen){
    maxLen = maxLen || 180;
    const words = text.split(/\s+/);
    const chunks = [];
    let current = "";
    words.forEach(function(w){
      const candidate = current ? (current + " " + w) : w;
      if(candidate.length > maxLen && current){
        chunks.push(current);
        current = w;
      } else {
        current = candidate;
      }
    });
    if(current) chunks.push(current);
    return chunks;
  }

  function speakChunksSequentially(chunks, onDone){
    let i = 0; dead = false; ensureAudio();
    function fallback(t){
      try{ const u = new SpeechSynthesisUtterance(t); u.lang = "ar"; u.volume = 1; u.onend = u.onerror = playNext; speechSynthesis.speak(u); }
      catch(e){ playNext(); }
    }
    function playNext(){
      if(dead) return;
      if(i >= chunks.length){ onDone(); return; }
      const t = chunks[i++];
      fetch("/api/tts?l=ar&q=" + encodeURIComponent(t))
        .then(function(res){ if(!res.ok) throw 0; return res.arrayBuffer(); })
        .then(function(b){ return new Promise(function(ok, no){ actx.decodeAudioData(b, ok, no); }); })
        .then(function(buf){ if(dead) return; const s = actx.createBufferSource(); s.buffer = buf; s.connect(gainNode); curSrc = s; s.onended = playNext; s.start(); })
        .catch(function(){ if(!dead) fallback(t); });
    }
    playNext();
  }
  function stopSpeaking(){
    dead = true; commentQueue.length = 0;
    try{ curSrc && curSrc.stop(); }catch(e){}
    try{ speechSynthesis.cancel(); }catch(e){}
    if(speakingComment) finishSpeakingComment();
  }

  function finishSpeakingComment(){
    speakingComment = false;
    pausedForSpeech = false;
    currentAudio = null;
    // مهلة بسيطة قبل ما نعيد فتح المايك حتى ما يلتقط آخر رجفة من صوت القراءة
    setTimeout(startRecognitionIfWanted, 350);
    processCommentQueue();
  }

  function speakComment(text){
    speakingComment = true;
    pausedForSpeech = true;
    stopRecognitionInternal(); // وقف المايك مؤقتًا حتى ما تنكتب كلمات الكومنت وكأنك حكيتها

    if(currentAudio){
      try{ currentAudio.pause(); } catch(e){ /* تجاهل */ }
      currentAudio = null;
    }

    const chunks = chunkTextForSpeech(text);
    if(chunks.length === 0){ finishSpeakingComment(); return; }
    speakChunksSequentially(chunks, finishSpeakingComment);
  }

  function processCommentQueue(){
    if(speakingComment || commentQueue.length === 0) return;
    const next = commentQueue.shift();
    speakComment(next);
  }

  function enqueueComment(text){
    if(!readerOn) return;
    text = (text || "").trim();
    if(!text) return;
    // تفادي تكديس كومنتات كتير وقت الزحمة: نحتفظ فقط بآخر 12 بالطابور
    commentQueue.push(text);
    if(commentQueue.length > 12) commentQueue.shift();
    processCommentQueue();
  }

  /* =====================================================================
     الاتصال بالبرنامج (tiktok_live_captions.py)
     ===================================================================== */
  function connect(){
    let ws;
    try{
      ws = new WebSocket(`ws://localhost:${PORT}`);
    } catch(e){
      setTimeout(connect, 2000);
      return;
    }
    activeWs = ws;
    ws.onopen = function(){
      if(savedUsername){ sendLogin(savedUsername); }
    };
    ws.onclose = function(){ setTimeout(connect, 2000); };
    ws.onerror = function(){ ws.close(); };
    ws.onmessage = function(evt){
      let data;
      try{ data = JSON.parse(evt.data); } catch(e){ return; }
      if(data.type === "status"){
        handleStatus(data);
      } else if(data.type === "comment"){
        enqueueComment(data.comment || data.text);
      }
    };
  }
  connect();

  /* =====================================================================
     زر نسخ رابط الصفحة
     ===================================================================== */
  (function setupCopyLink(){
    const btn = document.getElementById("copy-link");
    const label = document.getElementById("copy-link-text");
    if(!btn || !label) return;
    const originalText = label.textContent;

    function showCopied(ok){
      label.textContent = ok ? "تم نسخ الرابط \u2713" : "تعذّر النسخ، انسخه يدويًا";
      btn.classList.toggle("copied", !!ok);
      clearTimeout(showCopied._t);
      showCopied._t = setTimeout(function(){
        label.textContent = originalText;
        btn.classList.remove("copied");
      }, 1800);
    }

    function fallbackCopy(text){
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;
      try{ ok = document.execCommand("copy"); } catch(e){ ok = false; }
      document.body.removeChild(ta);
      return ok;
    }

    btn.addEventListener("click", function(){
      const url = location.href;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(
          function(){ showCopied(true); },
          function(){ showCopied(fallbackCopy(url)); }
        );
      } else {
        showCopied(fallbackCopy(url));
      }
    });
  })();

  
  (function(){
    const t = document.getElementById("rd-toggle"), v = document.getElementById("rd-vol"), vl = document.getElementById("rd-vl"), test = document.getElementById("rd-test");
    function paint(){ t.classList.toggle("on", readerOn); t.textContent = readerOn ? "🔊 قارئ الكومنتات: ON" : "🔇 قارئ الكومنتات: OFF"; vl.textContent = Math.round(VOL * 100) + "%"; v.value = VOL; }
    t.onclick = function(){ readerOn = !readerOn; try{ localStorage.setItem("ovl_rd_on", readerOn ? "1" : "0"); }catch(e){}
      if(readerOn){ ensureAudio(); } else { stopSpeaking(); } paint(); };
    v.oninput = function(){ VOL = parseFloat(v.value); try{ localStorage.setItem("ovl_rd_vol", String(VOL)); }catch(e){} if(gainNode) gainNode.gain.value = VOL; paint(); };
    test.onclick = function(){ if(!readerOn){ readerOn = true; try{ localStorage.setItem("ovl_rd_on","1"); }catch(e){} paint(); } ensureAudio(); enqueueComment("تجربة الصوت، هل تسمعني بوضوح؟"); };
    paint();
  })();

  /* ---- تجربة سريعة بدون بث حقيقي: اضغط C لمحاكاة وصول كومنت ---- */
  const DEMO_COMMENTS = ["شو هالسيرفر الحلو", "بدي اشترك بالقناة", "تحياتي من لبنان", "كملوا هيك تمام"];
  window.addEventListener("keydown", function(e){
    if(e.key.toLowerCase() === "c"){
      enqueueComment(DEMO_COMMENTS[Math.floor(Math.random()*DEMO_COMMENTS.length)]);
    }
  });
})();
<\/script>

(function(){

const IC={fx:'<path d="M3 8h18v12H3zM3 8l3-5 3 5M9 8l3-5 3 5M15 8l3-5 3 5"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/>',shop:'<path d="M3 4h2l2.5 11h10L20 7H6"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',layers:'<path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5"/>',hist:'<path d="M3 12a9 9 0 109-9 9 9 0 00-7 3.5M3 4v4h4M12 7v5l3 2"/>',chart:'<path d="M3 20h18M6 16l4-5 3 3 5-7"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.8A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/>',gift:'<rect x="3" y="9" width="18" height="12" rx="1"/><path d="M12 9v12M3 13h18M12 9c-3 0-5-4-2-5s4 3 2 5zm0 0c3 0 5-4 2-5s-4 3-2 5z"/>',crown:'<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',video:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/>',music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',bell:'<path d="M6 17V11a6 6 0 0112 0v6l2 2H4zM10 21h4"/>',fire:'<path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-9-2 2-3 3-3 5-1-1-2-2-2-4-3 3-5 6-5 8 0 4 3 7 7 7z"/>',game:'<rect x="2" y="8" width="20" height="10" rx="5"/><path d="M7 11v4M5 13h4M16 12h.01M18 14h.01"/>',flag:'<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',tag:'<path d="M3 12V3h9l9 9-9 9zM7.5 7.5h.01"/>'};
const svg=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(IC[k]||IC.star)+'</svg>';
const icon=s=>s&&s.img?'<img src="'+s.img+'" alt="">':svg(s&&s.icon);
const DEF=[["hearts","💗","تأثير القلوب","قلوب شفافة تطلع مع كل لايك أو هدية"],["leaderboard","🏆","لوحة المتفاعلين","أكثر المتفاعلين تفاعلاً بشكل مباشر"],["gift","🚀","صاروخ الهدايا","صاروخ ينطلق وينفجر مع كل هدية"],["supporters","👑","توب الداعمين","أفضل 8 داعمين بترتيب متحرك حسب قيمة هداياهم"],["snake","🐍","عالم الحيايا 3D","ساحة ثعابين ثلاثية الأبعاد يتحكم فيها المشاهدون"],["arena","⚔️","معركة التيك توك الخارقة","ساحة قتال حية: الأبطال يكبروا بالكبسات والمشاركات والهدايا"]].map(d=>({id:d[0],type:"builtin",view:d[0],sec:"fx",emoji:d[1],name:d[2],desc:d[3]}));
const DSEC=()=>[{id:"fx",name:"التأثيرات",icon:"fx"},{id:"reader",name:"قارئ الكومنتات",icon:"mic",page:"reader"},{id:"videos",name:"متجر الفيديوهات",icon:"shop"},{id:"events",name:"آخر الأحداث",icon:"hist",page:"events"},{id:"stats",name:"الإحصائيات",icon:"chart",page:"stats"}];
function loadCfg(){
  let c=null;
  const ok=x=>x&&x.ver===3&&Array.isArray(x.items);
  try{if(ok(window.OVL_STORE))c=window.OVL_STORE;}catch(e){}
  if(!c)try{const l=JSON.parse(localStorage.getItem("ovl_cfg3")||"null");if(ok(l))c=l;}catch(e){}
  if(!c){let s={};try{s=JSON.parse($("#ovl-config").textContent||"{}");}catch(e){}
    c=Object.assign({name:"OVERLYASMARO",logo:"",phone:"",tiktok:""},s);c.ver=3;
    if(!Array.isArray(c.items)||!c.items.length)c.items=DEF.map(d=>Object.assign({},d));}
  return norm(c);
}
function norm(c){
  if(!Array.isArray(c.items))c.items=[];
  if(!Array.isArray(c.secs)||!c.secs.length)c.secs=DSEC();
  c.items.forEach(i=>{if(!i.sec)i.sec=i.type==="video"?"videos":"fx";});
  c.theme=Object.assign({accent:"#ff1a1a",bg:"#08080a"},c.theme||{});
  c.bgc=Object.assign({mode:"logo",op:18,size:68,blur:0,img:""},c.bgc||{});
  c.codes=Array.isArray(c.codes)?c.codes:[];
  if(!c.brandAnim)c.brandAnim="type";
  if(c.hideCopyLocked==null)c.hideCopyLocked=true;
  c.phone=c.phone||"";c.tiktok=c.tiktok||"";c.name=c.name||"OVERLYASMARO";
  return c;
}
const cfg=loadCfg();

/* ---- تنظيف الصور: يشيل الخلفية الصلبة (سودا/بيضا) ويقص الأطراف، وبالوضع red بيحولها أحمر ---- */
function cleanImg(url,red,max){max=max||256;return new Promise(ok=>{const i=new Image();i.onerror=()=>ok(url);i.onload=()=>{
  const w=i.naturalWidth||1,h=i.naturalHeight||1,s=Math.min(1,max/Math.max(w,h)),W=Math.max(1,Math.round(w*s)),H=Math.max(1,Math.round(h*s));
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d",{willReadFrequently:true});x.drawImage(i,0,0,W,H);
  let d;try{d=x.getImageData(0,0,W,H);}catch(e){return ok(url);}
  const p=d.data,cs=[0,(W-1)*4,(H-1)*W*4,((H-1)*W+W-1)*4];let n=0,R=0,G=0,B=0;
  cs.forEach(o=>{if(p[o+3]>240){n++;R+=p[o];G+=p[o+1];B+=p[o+2];}});
  let bg=false;if(n===4){R/=4;G/=4;B/=4;bg=cs.every(o=>Math.abs(p[o]-R)+Math.abs(p[o+1]-G)+Math.abs(p[o+2]-B)<70);}
  let x0=W,y0=H,x1=0,y1=0;
  for(let y=0;y<H;y++)for(let q=0;q<W;q++){const o=(y*W+q)*4;let a=p[o+3];
    if(bg){const dd=Math.abs(p[o]-R)+Math.abs(p[o+1]-G)+Math.abs(p[o+2]-B);a=a*Math.min(1,Math.max(0,(dd-36)/70));}
    p[o+3]=a;if(red){p[o]=255;p[o+1]=26;p[o+2]=26;}
    if(a>24){if(q<x0)x0=q;if(q>x1)x1=q;if(y<y0)y0=y;if(y>y1)y1=y;}}
  x.putImageData(d,0,0);if(x1<x0)return ok(url);
  const pad=Math.round(Math.max(x1-x0,y1-y0)*.06),cw=x1-x0+1+pad*2,ch=y1-y0+1+pad*2,c2=document.createElement("canvas");c2.width=cw;c2.height=ch;
  c2.getContext("2d").drawImage(c,x0,y0,x1-x0+1,y1-y0+1,pad,pad,x1-x0+1,y1-y0+1);ok(c2.toDataURL("image/png"));};i.src=url;});}

const eom=d=>new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59,999).getTime();
const fmtD=ms=>{const d=new Date(ms);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};

const isLocked=it=>!!(it.locked||it.lock);
const codeCovers=(c,it)=>!!(c.all||(c.secs||[]).includes(it.sec)||(c.items||[]).includes(it.id));
const codeState=c=>c.off?"off":(Date.now()>c.exp?"exp":"on");
function redeemed(){try{return JSON.parse(localStorage.getItem("ovl_red")||"[]");}catch(e){return [];}}
function setRedeemed(a){try{localStorage.setItem("ovl_red",JSON.stringify(a));}catch(e){}}
function unlocked(it){
  if(!isLocked(it))return true;
  if(CLOUD)return !!grantFor(it);
  if(it.lock&&sessionStorage.getItem("ovl_u_"+it.id))return true;
  const r=redeemed();
  return cfg.codes.some(c=>r.includes(c.id)&&codeState(c)==="on"&&codeCovers(c,it));
}

async function tryCode(txt,it){
  if(!CLOUD)return tryCodeLocal(txt,it);
  const c=(txt||"").trim();if(!c)return {ok:false,msg:"اكتب الكود"};
  try{const r=await fetch(CLOUD+"/redeem",{method:"POST",body:JSON.stringify({code:c,device:DEV,item:it?it.id:"",sec:it?it.sec:""})}).then(r=>r.json());
    if(!r.ok)return r;
    setGrants(grants().filter(g=>g.id!==r.grant.id).concat([r.grant]));
    return {ok:true,count:cfg.items.filter(i=>isLocked(i)&&gCovers(r.grant,i)).length,exp:r.grant.exp};
  }catch(e){return {ok:false,msg:"تعذّر الاتصال بسيرفر التفعيل. تأكد من الإنترنت."};}
}
function tryCodeLocal(txt,it){
  const t=(txt||"").trim().toLowerCase();if(!t)return {ok:false,msg:"اكتب الكود"};
  if(it&&it.lock&&t===String(it.lock).trim().toLowerCase()){sessionStorage.setItem("ovl_u_"+it.id,"1");return {ok:true,count:1};}
  const c=cfg.codes.find(x=>String(x.code).trim().toLowerCase()===t);
  if(!c)return {ok:false,msg:"الكود غير صحيح."};
  const st=codeState(c);
  if(st==="off")return {ok:false,msg:"هذا الكود معطّل."};
  if(st==="exp")return {ok:false,msg:"انتهت صلاحية هذا الكود بتاريخ "+fmtD(c.exp)+" ولا يمكن استخدامه مرة ثانية. اطلب كود جديد."};
  if(it&&!codeCovers(c,it))return {ok:false,msg:"هذا الكود لا يفتح «"+it.name+"»."};
  const r=redeemed();if(!r.includes(c.id)){r.push(c.id);setRedeemed(r);}
  return {ok:true,count:cfg.items.filter(i=>isLocked(i)&&codeCovers(c,i)).length,exp:c.exp};
}

  if(a==="copy"){
    if(it.type==="video")return gate(it,()=>{copy(it.url);toast("تم نسخ رابط الفيديو ✅");});
    gate(it,()=>{if(it.type!=="link"&&!user())return toast("اكتب اسم المستخدم أولاً");copy(itemUrl(it));toast("تم نسخ رابط «"+it.name+"» — الصقه بـ Live Studio ✅");});}
  else if(a==="open")gate(it,()=>openItem(it));
  else if(a==="play")playVid(it);
  else if(a==="test"){
    const f=cd.querySelector("iframe");if(!f)return;
    if(TESTING.has(it.id)){TESTING.delete(it.id);f.dataset.src=itemUrl(it,true);b.textContent="🧪 تجربة";b.classList.remove("on");}
    else{TESTING.add(it.id);f.dataset.src=testUrl(it);b.textContent="⏹ إيقاف";b.classList.add("on");}
    f.src=f.dataset.src;
  }
});

function syncAddType(){const t=$("#at");if(!t)return;document.querySelectorAll("#o-adm [data-for]").forEach(x=>{x.style.display=x.dataset.for.split(",").includes(t.value)?"":"none";});}
const moveIn=(arr,idx,dir,same)=>{let j=idx+dir;while(j>=0&&j<arr.length&&!same(arr[j]))j+=dir;if(j<0||j>=arr.length)return false;const t=arr[idx];arr[idx]=arr[j];arr[j]=t;return true;};
const getC=ref=>ref==="new"?draft:cfg.codes.find(c=>c.id===ref);

adm.addEventListener("input",e=>{

adm.addEventListener("change",async e=>{
  const t=e.target;
