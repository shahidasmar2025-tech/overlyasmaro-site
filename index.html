  if(t.id==="bgf"&&t.files[0]){cfg.bgc.img=await fitImg(await rd(t.files[0],1),1280);cfg.bgc.mode="custom";save();renderAll();admin();return toast("تم تحديث الخلفية ✅");}
  if(t.id==="nsi"&&t.files[0]){newImg=await cleanImg(await rd(t.files[0],1),true);return toast("تم تجهيز الأيقونة ✅");}
  if(t.id==="imp"&&t.files[0]){try{const j=JSON.parse(await rd(t.files[0]));if(!(j&&j.ver===3&&Array.isArray(j.items)))throw 0;if(!confirm("استبدال كل الإعدادات الحالية بالملف؟"))return;Object.keys(cfg).forEach(k=>delete cfg[k]);Object.assign(cfg,norm(j));save();renderAll();admin();toast("تم الاستيراد ✅");}catch(x){toast("ملف غير صالح");}return;}
  if(t.dataset.g){const k=t.dataset.g;cfg[k]=t.type==="checkbox"?t.checked:t.value.trim();save();renderAll();return;}
  if(t.dataset.th){cfg.theme[t.dataset.th]=t.value;save();renderAll();admin();return;}
  if(t.dataset.bgc){cfg.bgc[t.dataset.bgc]=t.tagName==="SELECT"?t.value:+t.value;save();renderAll();if(t.tagName==="SELECT")admin();return;}
  /* أكواد */
  const dr=t.closest("[data-draft]");
  if(dr&&t.dataset.df){const k=t.dataset.df;if(k==="exp"){const v=parseD(t.value);if(v)draft.exp=v;}else draft[k]=t.value.trim();return;}
  const cr=t.closest("[data-cref]");
  if(cr&&(t.dataset.cf==="all"||t.dataset.cs||t.dataset.ci)){
    const c=getC(cr.dataset.cref);if(!c)return;c.secs=c.secs||[];c.items=c.items||[];
    if(t.dataset.cf==="all")c.all=t.checked;
    else{const arr=t.dataset.cs?c.secs:c.items,id=t.dataset.cs||t.dataset.ci,i=arr.indexOf(id);if(t.checked&&i<0)arr.push(id);if(!t.checked&&i>=0)arr.splice(i,1);}
    if(cr.dataset.cref!=="new")save();renderAll();admin();return;}
  const cc=t.closest("[data-cid]");
  if(cc&&t.dataset.cf){const c=cfg.codes.find(x=>x.id===cc.dataset.cid);if(!c)return;const k=t.dataset.cf;
    if(k==="code"){const v=t.value.trim();if(!v||codeTaken(v,c.id)){toast("هذا الكود مستخدم من قبل (أو فاضي) — اختر كود مختلف");return admin();}c.code=v;}
    else if(k==="exp"){const v=parseD(t.value);if(v)c.exp=v;}
    else c[k]=t.value.trim();
    save();renderAll();admin();return;}
  /* أقسام */
  const sr=t.closest("[data-sid]");
  if(sr&&!t.dataset.a){const s=cfg.secs.find(x=>x.id===sr.dataset.sid);if(!s)return;
    if(t.dataset.sup!==undefined&&t.files[0]){s.img=await cleanImg(await rd(t.files[0],1),true);}
    else if(t.dataset.sf==="icon"){s.icon=t.value;s.img="";}
    else if(t.dataset.sf==="page"){if(t.value)s.page=t.value;else delete s.page;}
    else if(t.dataset.sf){s[t.dataset.sf]=t.value.trim();}
    save();renderAll();return admin();}
  /* عناصر */
  const own=t.closest("[data-id]");const it=own&&cfg.items.find(i=>i.id===own.dataset.id);
  if(!it)return;
  if(t.dataset.wm!==undefined&&t.files[0]){it.wm=await cleanImg(await rd(t.files[0],1),false,900);save();renderAll();return toast("تم تحديث العلامة المائية ✅");}
  if(t.dataset.icf!==undefined&&t.files[0]){it.icon=await cleanImg(await rd(t.files[0],1),false);save();renderAll();return admin();}
  if(t.dataset.htf!==undefined&&t.files[0]){it.html=await rd(t.files[0]);save();renderAll();admin();return toast("تم استبدال كود الـ HTML ✅");}
  if(t.dataset.pyf!==undefined&&t.files[0]){it.py=await rd(t.files[0]);save();plugin(it.id,it.py);return admin();}
  const f=t.dataset.f;if(!f)return;
  if(t.type==="checkbox"){it[f]=t.checked;if(f==="locked"&&!t.checked)it.lock="";}
  else if(f==="wmop")it[f]=Math.max(0,Math.min(100,+t.value||0));
  else if(f==="w"||f==="h")it[f]=parseInt(t.value,10)||0;
  else if(f==="html")it[f]=t.value;
  else it[f]=t.value.trim();
  save();renderAll();admin();
});

  if(a==="dup"){const n=JSON.parse(JSON.stringify(it));n.id="c"+Date.now().toString(36);n.name=it.name+" (نسخة)";if(n.type==="builtin"){n.type="link";n.url="";}cfg.items.splice(cfg.items.indexOf(it)+1,0,n);admOpen.add(n.id);save();renderAll();admin();return;}
  if(a==="noicon"){delete it.icon;save();renderAll();return admin();}
  if(a==="pyresend"){return plugin(it.id,it.py);}
  if(a==="reset"){DEF.forEach(d=>{if(!cfg.items.some(i=>i.id===d.id))cfg.items.push(Object.assign({},d));});save();renderAll();admin();return toast("تم الاسترجاع ✅");}
  if(a==="resettheme"){cfg.theme={accent:"#ff1a1a",bg:"#08080a"};cfg.bgc={mode:"logo",op:18,size:68,blur:0,img:""};cfg.brandAnim="type";save();renderAll();return admin();}
  if(a==="add"){
    const g=x=>$("#"+x).value.trim(),name=g("an"),type=$("#at").value;if(!name)return toast("اكتب الاسم");
    const nit={id:"c"+Date.now().toString(36),sec:g("as"),name,desc:g("ad"),price:g("ap"),emoji:g("ae")||"✨",locked:$("#al").checked};
    const url=g("au");
    if($("#ai").files[0])nit.icon=await cleanImg(await rd($("#ai").files[0],1),false);
    if(type==="video"){if(!url)return toast("حط رابط الفيديو");nit.type="video";nit.url=url;nit.wmop=Math.max(0,Math.min(100,+g("awo")||55));nit.allowCopy=$("#ac").checked;if($("#aw").files[0])nit.wm=await cleanImg(await rd($("#aw").files[0],1),false,900);}
    else if(type==="html"){const hf=$("#ah").files[0];if(!hf)return toast("ارفع ملف الـ HTML");nit.type="html";nit.html=await rd(hf);const pf=$("#apy").files[0];if(pf){nit.py=await rd(pf);plugin(nit.id,nit.py);}}
    else{if(!url)return toast("حط الرابط");nit.type="link";nit.url=url;}
    cfg.items.push(nit);admOpen.add(nit.id);save();renderAll();admin();return toast("تمت الإضافة ✅");}
  /* الأكواد */
  if(a==="gen"){draft.code=genCode();return admin();}
  if(a==="csel"||a==="cclr"){const cr=b.closest("[data-cref]"),c=getC(cr.dataset.cref);c.items=c.items||[];
    cfg.items.filter(i=>i.sec===b.dataset.sid).forEach(i=>{const k=c.items.indexOf(i.id);if(a==="csel"&&k<0)c.items.push(i.id);if(a==="cclr"&&k>=0)c.items.splice(k,1);});
    if(cr.dataset.cref!=="new")save();renderAll();return admin();}
  if(a==="ccreate"){
    const d=draft;if(!d.code)return toast("اكتب الكود أو ولّد واحد");
    if(codeTaken(d.code))return toast("هذا الكود مستخدم من قبل (حتى لو منتهي) — اختر كود مختلف");
    if(!d.all&&!d.secs.length&&!d.items.length)return toast("اختر شو بيفتح هالكود (قسم، عناصر، أو كل المتجر)");
    if(d.exp<Date.now())return toast("تاريخ الانتهاء لازم يكون بالمستقبل");
    cfg.codes.push({id:"k"+Date.now().toString(36),label:d.label||("كود "+(cfg.codes.length+1)),code:d.code,all:d.all,secs:d.secs.slice(),items:d.items.slice(),exp:d.exp,off:false});
    draft=null;save();renderAll();admin();return toast("تم إنشاء الكود ✅");}
  const cc=b.closest("[data-cid]"),c=cc&&cfg.codes.find(x=>x.id===cc.dataset.cid);
  if(a==="coff"&&c){c.off=!c.off;save();renderAll();return admin();}
  if(a==="cdel"&&c){if(confirm("حذف الكود؟ (إذا كان منتهي، ممكن يرجع يتكرر بعد حذفه)")){cfg.codes=cfg.codes.filter(x=>x.id!==c.id);save();renderAll();admin();}return;}
  if(a==="cnext"&&c){const base0=c.exp<Date.now()?new Date():new Date(c.exp+86400000);const n=JSON.parse(JSON.stringify(c));n.id="k"+Date.now().toString(36);n.code=genCode();n.exp=eom(base0);n.off=false;n.label=c.label+" (جديد)";cfg.codes.push(n);admOpen.add("code:"+n.id);save();renderAll();admin();return toast("تم إنشاء كود جديد: "+n.code);}
  /* أدوات */
  if(a==="dlhtml"){dl("OVERLYASMARO_studio.html",buildHtml(),"text/html");return toast("تم بناء النسخة الجديدة ✅");}
  if(a==="apply"){fetch("/api/build",{method:"POST",headers:{"X-OVL":window.OVL_TOKEN||""},body:buildHtml()}).then(r=>r.ok?toast("تم التطبيق (نسخة احتياطية .bak) ✅"):toast("فشل التطبيق")).catch(()=>toast("فشل التطبيق"));return;}
  if(a==="export"){dl("OVERLYASMARO_settings.json",JSON.stringify(cfg),"application/json");return;}
});
adm.addEventListener("mousedown",e=>{if(e.target.id==="o-adm")hideAdmin();});
$("#o-adm").addEventListener("change",e=>{if(e.target.id==="nst"){const x=$("#nsemb");if(x)x.style.display=e.target.value==="embed"?"":"none";}});
if(cfg.logo&&!cfg.logoOk){cfg.logoOk=1;cleanImg(cfg.logo,false,300).then(u=>{cfg.logo=u;save();renderAll();});}
renderAll();paint();conn();
})();
</script>



</body></html>
